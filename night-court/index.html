e"><button id="pass">PAS</button><button id="steal">ÇAL</button><button id="dribble" class="dribble">ÇALIM</button><button id="sprint">SPRINT</button><button id="shoot" class="shoot">ŞUT</button></div><div id="power" class="ui power hide"><i id="powerFill"></i></div><div id="blind" class="ui blind"></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>const $=s=>document.querySelector(s);const CHARS=[{n:'RAVEN',c:0x267bea,css:'#267bea',speed:4.5,shot:.90,steal:1.15},{n:'NOX',c:0x8b4bd6,css:'#8b4bd6',speed:4.15,shot:1.05,steal:1.0},{n:'BLAZE',c:0xf05a2a,css:'#f05a2a',speed:4.8,shot:.82,steal:.92},{n:'GHOST',c:0xe7e7e7,css:'#e7e7e7',speed:4.3,shot:.95,steal:1.25},{n:'TITAN',c:0x33a16d,css:'#33a16d',speed:3.9,shot:.88,steal:1.35},{n:'VOLT',c:0xf0cf3d,css:'#f0cf3d',speed:4.65,shot:.92,steal:1.05}];let selected=0,scene,camera,renderer,clock,run=false,players=[],fans=[],ball,holder,controlled,monster=null,ballVel,shot=null,move={x:0,y:0},sprint=false,charging=false,charge=0,blue=0,red=0,timeLeft=300,lastTouch='blue',inboundLock=false,aiDribbleCd=0,userDribbleCd=0,inMansion=false,mansionGroup=null,questStep=0,questObjects=[],portal=null;const COURT={L:28,W:15,HOOP:12.65};function renderChars(){const r=$('#chars');r.innerHTML='';CHARS.forEach((c,i)=>{const b=document.createElement('button');b.className='char '+(i===selected?'sel':'');b.innerHTML=`<div class="avatar" style="background:${c.css}"></div><b>${c.n}</b><div class="stats">Hız ${c.speed.toFixed(1)} · Şut ${Math.round(c.shot*100)}<br>Çalma ${Math.round(c.steal*100)}</div>`;b.onclick=()=>{selected=i;renderChars()};r.appendChild(b)})}renderChars();$('#charMenu').onclick=()=>{$('#home').classList.add('hide');$('#charScreen').classList.remove('hide')};$('#charBack').onclick=()=>{$('#charScreen').classList.add('hide');$('#home').classList.remove('hide')};function mat(c,r=.62,m=.02){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m})}function M(g,m){const x=new THREE.Mesh(g,m);x.castShadow=x.receiveShadow=true;return x}function box(w,h,d,c){return M(new THREE.BoxGeometry(w,h,d),mat(c))}function human(color,skin=0xc89572,fan=false){const g=new THREE.Group(),torso=box(fan?.34:.42,fan?.65:.82,fan?.24:.30,color);torso.position.y=fan?1.05:1.2;g.add(torso);const head=M(new THREE.SphereGeometry(fan?.18:.23,12,10),mat(skin));head.position.y=fan?1.52:1.78;g.add(head);for(const sx of[-1,1]){const arm=box(fan?.10:.12,fan?.55:.68,fan?.10:.12,skin);arm.position.set(sx*(fan?.27:.34),fan?.98:1.18,0);g.add(arm);const leg=box(fan?.11:.14,fan?.60:.78,fan?.12:.15,0x222832);leg.position.set(sx*(fan?.11:.14),fan?.43:.42,0);g.add(leg)}return g}function floorLine(points){const g=new THREE.BufferGeometry().setFromPoints(points.map(p=>new THREE.Vector3(p[0],.025,p[1])));scene.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:0xffffff})))}function arc(cx,cz,r,a1,a2){const p=[];for(let i=0;i<=64;i++){const a=a1+(a2-a1)*i/64;p.push([cx+Math.cos(a)*r,cz+Math.sin(a)*r])}floorLine(p)}function hoop(side){const rimX=side*COURT.HOOP,boardX=side*13.15,postX=side*14.45;const post=box(.16,3.05,.16,0x60666f);post.position.set(postX,1.525,0);scene.add(post);const arm=box(Math.abs(postX-boardX),.10,.10,0x60666f);arm.position.set((postX+boardX)/2,3.08,0);scene.add(arm);const board=M(new THREE.BoxGeometry(.08,1.05,1.80),new THREE.MeshPhysicalMaterial({color:0xffffff,transparent:true,opacity:.72,roughness:.08}));board.position.set(boardX,3.45,0);scene.add(board);const rim=M(new THREE.TorusGeometry(.45,.035,10,32),new THREE.MeshStandardMaterial({color:0xff671c}));rim.rotation.y=Math.PI/2;rim.position.set(rimX,3.05,0);scene.add(rim)}function stands(){const colors=[0x2c7be5,0xe43a49,0xe6b13a,0x7e52c7,0x35a36a,0xdddddd];for(const side of[-1,1])for(let row=0;row<5;row++)for(let i=-9;i<=9;i++){const seat=box(.72,.34,.72,row%2?0x424b58:0x333b46);seat.position.set(i*1.35,.3+row*.42,side*(COURT.W/2+1.6+row*.72));scene.add(seat);if(i%2===0||row<4){const f=human(col .add(ball);holder=players[0];holder.userData.has=true;controlled=holder;clock=new THREE.Clock();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});loop()}function start(){if(!window.THREE){$('#msg').textContent='3D motoru yükleniyor...';setTimeout(start,150);return}if(!scene)init();run=true;$('#home').classList.add('hide');['#hud','#joy','#actions','#power'].forEach(s=>$(s).classList.remove('hide'));setTimeout(()=>{if(run&&!monster&&!inMansion)spawnMonster()},9000)}$('#play').onclick=start;function shootBlue(pw){if(!holder||holder.userData.team!=='blue')return;const sh=holder,rim=new THREE.Vector3(COURT.HOOP,3.05,(Math.random()-.5)*1.1),sp=sh.position.clone().add(new THREE.Vector3(0,1.7,0)),dist=sh.position.distanceTo(new THREE.Vector3(COURT.HOOP,0,0)),T=.8+dist/20,d=rim.sub(sp);ball.position.copy(sp);ballVel.set(d.x/T,(d.y+4.9*T*T)/T,d.z/T);shot={team:'blue',three:dist>6.75,scored:false};sh.userData.has=false;holder=null;lastTouch='blue'}function shootRed(p){const rim=new THREE.Vector3(-COURT.HOOP,3.05,(Math.random()-.5)*.9),sp=p.position.clone().add(new THREE.Vector3(0,1.7,0)),dist=p.position.distanceTo(new THREE.Vector3(-COURT.HOOP,0,0)),T=.8+dist/20,d=rim.sub(sp);ball.position.copy(sp);ballVel.set(d.x/T,(d.y+4.9*T*T)/T,d.z/T);p.userData.has=false;holder=null;lastTouch='red';shot={team:'red',three:dist>6.75,scored:false}}function spawnMonster(){if(monster)scene.remove(monster);monster=human(0x2b0710,0x3b0810,false);monster.scale.set(1.35,1.35,1.35);monster.position.set(-13,0,(Math.random()-.5)*8);scene.add(monster);$('#msg').textContent='CANAVAR GELİYOR!';setTimeout(()=>$('#msg').textContent='',900)}function buildMansion(){mansionGroup=new THREE.Group();scene.add(mansionGroup);for(const p of players)p.visible=false;ball.visible=false;if(monster)monster.visible=false;const floor=box(24,.2,18,0x251b19);floor.position.y=-.1;mansionGroup.add(floor);for(const z of[-9,9]){const or(ballVel,dt);if(ball.position.y<.24){ball.position.y=.24;ballVel.y=Math.abs(ballVel.y)>.8?-ballVel.y*.55:0}if(shot&&!shot.scored){const tx=shot.team==='blue'?COURT.HOOP:-COURT.HOOP;if(Math.abs(ball.position.x-tx)<.24&&Math.abs(ball.position.z)<.28&&ball.position.y>2.82&&ball.position.y<3.22&&ballVel.y<0){shot.scored=true;score(shot.team,shot.three?3:2)}}for(const p of players)if(ball.position.y<1.5&&ball.position.distanceTo(p.position)<.62){holder=p;p.userData.has=true;if(p.userData.team==='blue')controlled=p;ballVel.set(0,0,0);shot=null;lastTouch=p.userData.team;break}}function update(dt){if(inMansion){mansionUpdate(dt);return}timeLeft=Math.max(0,timeLeft-dt);$('#clock').textContent=Math.floor(timeLeft/60)+':'+Math.floor(timeLeft%60).toString().padStart(2,'0');$('#blue').textContent=blue;$('#red').textContent=red;if(controlled){let dx=move.x,dz=move.y,L=Math.hypot(dx,dz);if(L>.05){if(L>1){dx/=L;dz/=L}const d=new THREE.Vector3(dx,0,dz);controlled.position.addScaledVector(d,CHARS[selected].speed*dt);controlled.rotation.y=Math.atan2(dx,dz)}}ai(dt);separate();physics(dt);if(monster&&controlled){const d=controlled.position.clone().sub(monster.position);d.y=0;if(d.length()>.05){d.normalize();monster.position.addScaledVector(d,dt*7.2)}if(monster.position.distanceTo(controlled.position)<.8)enterMansion()}camera.position.lerp(new THREE.Vector3(controlled.position.x,7.2,controlled.position.z+9.2),.08);camera.lookAt(controlled.position.x,.8,controlled.position.z-1)}function loop(){requestAnimationFrame(loop);if(!scene)return;const dt=Math.min(clock.getDelta(),.035);if(run)update(dt);renderer.render(scene,camera)}let active=false;function jm(x,y){const r=$('#joy').getBoundingClientRect(),m=36;let dx=x-r.left-r.width/2,dy=y-r.top-r.height/2,d=Math.hypot(dx,dy)||1;if(d>m){dx=dx/d*m;dy=dy/d*m}move.x=dx/m;move.y=dy/m;$('#stick').style.transform=`translate(${dx}px,${dy}px)`}$('#joy').onpointerdown=e=>{active=true;jm(e.clientX,e.clientY)};$('#joy').onpointermove=e=>active&&jm(e.clientX,e.clientY);$('#joy').onpointerup=()=>{active=false;move.x=move.y=0;$('#stick').style.transform='none'};$('#sprint').onpointerdown=()=>sprint=true;$('#sprint').onpointerup=()=>sprint=false;$('#steal').onclick=()=>{};$('#pass').onclick=()=>{};$('#dribble').onclick=()=>{};$('#shoot').onpointerdown=e=>{e.preventDefault();if(holder&&holder.userData.team==='blue'){charging=true;charge=0}};$('#shoot').onpointerup=e=>{e.preventDefault();if(charging){charging=false;shootBlue(charge);charge=0;$('#powerFill').style.width='0%'}};setInterval(()=>{if(charging){charge+=.025;if(charge>1)charge=.2;$('#powerFill').style.width=(charge*100)+'%'}},30)</script></body></html>
