<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'><title>NIGHT COURT</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08090c;color:#fff;font-family:Arial}#game{position:fixed;inset:0}.ui{position:fixed;z-index:10}.hud{top:8px;left:8px;right:8px;display:flex;justify-content:center;gap:8px}.pill{background:#080b10d9;border:1px solid #ffffff22;padding:7px 10px;border-radius:10px;font-weight:900;font-size:12px}.joy{left:18px;bottom:18px;width:116px;height:116px;border-radius:50%;background:#ffffff12;border:1px solid #ffffff32;touch-action:none}.stick{position:absolute;left:37px;top:37px;width:42px;height:42px;border-radius:50%;background:#ffffffc9}.actions{right:18px;bottom:18px;display:grid;grid-template-columns:72px 72px;gap:8px}.actions button{height:58px;border:0;border-radius:16px;color:white;font-weight:900;background:#1d2938;box-shadow:0 4px 18px #0008}.actions .shoot{background:#b41f35}.power{left:50%;bottom:18px;transform:translateX(-50%);width:180px;height:13px;border-radius:9px;background:#111a24;border:1px solid #ffffff38;overflow:hidden}.power i{display:block;height:100%;width:0;background:linear-gradient(90deg,#56d36f,#f0cf4d,#ec4c55)}.msg{left:50%;top:55px;transform:translateX(-50%);font-weight:1000;font-size:24px;text-shadow:0 3px 9px #000}.home{inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#29121b,#05070a 65%)}.card{width:min(560px,92vw);padding:24px;text-align:center;background:#090d13e8;border:1px solid #ffffff25;border-radius:22px}.card h1{font-size:clamp(44px,10vw,72px);margin:0;line-height:.85}.card h1 b{display:block;color:#d72b42}.card button{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:#d72b42;color:white;font-weight:900;font-size:18px}.hide{display:none}@media(orientation:portrait){#rotate{display:grid!important}}#rotate{display:none;inset:0;background:#030405;z-index:100;place-items:center;text-align:center;font-size:24px;font-weight:900}</style></head><body><div id='game'></div><div id='rotate' class='ui'>📱↻<br>Telefonu yatay çevir</div><div id='hud' class='ui hud hide'><div class='pill'>MAVİ <span id='blue'>0</span></div><div class='pill'><span id='clock'>5:00</span></div><div class='pill'>KIRMIZI <span id='red'>0</span></div></div><div id='msg' class='ui msg'></div><div id='joy' class='ui joy hide'><div id='stick' class='stick'></div></div><div id='actions' class='ui actions hide'><button id='pass'>PAS</button><button id='steal'>ÇAL</button><button id='sprint'>SPRINT</button><button id='shoot' class='shoot'>ŞUT</button></div><div id='power' class='ui power hide'><i id='powerFill'></i></div><div id='home' class='ui home'><div class='card'><h1>NIGHT <b>COURT</b></h1><p>5'e 5 basketbol. ŞUT'a basılı tut, gücü ayarla, bırak ve at. Her sayıdan sonra canavar sahaya gelir.</p><button id='play'>MAÇA BAŞLA</button></div></div><script src='https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js'></script><script>const $=s=>document.querySelector(s);let S,C,R,clock3,run=false,players=[],ball,holder=null,controlled=null,monster=null;let move={x:0,y:0},sprint=false,charging=false,charge=0,blue=0,red=0,timeLeft=300,lastTouch='blue',shotInfo=null;const court={L:28,W:15,hoopX:12.6,hoopY:3.05};function mat(c,r=.65,m=.05){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m})}function mesh(g,m){let x=new THREE.Mesh(g,m);x.castShadow=x.receiveShadow=true;return x}function box(w,h,d,c){return mesh(new THREE.BoxGeometry(w,h,d),mat(c))}function line(points){let g=new THREE.BufferGeometry().setFromPoints(points.map(p=>new THREE.Vector3(p[0],.025,p[1])));return new THREE.Line(g,new THREE.LineBasicMaterial({color:0xffffff}))}function arc(cx,cz,r,a1,a2){let p=[];for(let i=0;i<=40;i++){let a=a1+(a2-a1)*i/40;p.push([cx+Math.cos(a)*r,cz+Math.sin(a)*r])}S.add(line(p))}function makePlayer(team,i){let g=new THREE.Group(),col=team==='blue'?0x2678e8:0xe33b48;let body=mesh(new THREE.CapsuleGeometry(.3,.72,5,10),mat(col));body.position.y=1.25;g.add(body);let head=mesh(new THREE.SphereGeometry(.25,14,10),mat(0xc38b68));head.position.y=1.95;g.add(head);let arms=[];for(let x of[-.38,.38]){let a=box(.15,.68,.15,0xc38b68);a.position.set(x,1.3,-.08);g.add(a);arms.push(a)}for(let x of[-.17,.17]){let l=box(.16,.75,.18,0x232831);l.position.set(x,.45,0);g.add(l)}g.userData={team,i,arms,v:new THREE.Vector3(),has:false,aiTarget:new THREE.Vector3()};S.add(g);players.push(g);return g}function makeHoop(side){let x=side*court.hoopX;let post=box(.16,3.2,.16,0x565b63);post.position.set(x+side*.8,1.6,0);S.add(post);let board=mesh(new THREE.BoxGeometry(.12,1.05,1.8),new THREE.MeshPhysicalMaterial({color:0xffffff,transparent:true,opacity:.48,roughness:.15}));board.position.set(x+side*.42,3.35,0);S.add(board);let rim=new THREE.Mesh(new THREE.TorusGeometry(.45,.045,10,28),new THREE.MeshStandardMaterial({color:0xff6b19,metalness:.5,roughness:.35}));rim.rotation.y=Math.PI/2;rim.position.set(x,3.05,0);S.add(rim);for(let i=0;i<12;i++){let a=i*Math.PI*2/12;let geo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x,3.01+Math.sin(a)*.02,Math.cos(a)*.45),new THREE.Vector3(x-side*.04,2.45,Math.cos(a)*.23)]);S.add(new THREE.Line(geo,new THREE.LineBasicMaterial({color:0xeeeeee})))}}function seats(){for(let side of[-1,1])for(let row=0;row<4;row++)for(let i=-8;i<=8;i++){let s=box(.7,.45,.7,row%2?0x3b4654:0x4c596a);s.position.set(i*1.4,.35+row*.45,side*(court.W/2+1.6+row*.75));S.add(s);if(i%2===0){let fan=mesh(new THREE.SphereGeometry(.16,8,6),mat(0xd2a07d));fan.position.set(s.position.x,s.position.y+.65,s.position.z);S.add(fan)}}for(let side of[-1,1])for(let row=0;row<3;row++)for(let i=-4;i<=4;i++){let s=box(.7,.45,.7,0x455262);s.position.set(side*(court.L/2+1.5+row*.75),.35+row*.45,i*1.45);S.add(s)}}function courtScene(){let floor=box(court.L,.18,court.W,0xc99662);floor.position.y=-.09;S.add(floor);S.add(line([[-14,-7.5],[14,-7.5],[14,7.5],[-14,7.5],[-14,-7.5]]));S.add(line([[0,-7.5],[0,7.5]]));arc(0,0,1.8,0,Math.PI*2);for(let side of[-1,1]){let bx=side*10.8;S.add(line([[bx,-2.45],[side*14,-2.45],[side*14,2.45],[bx,2.45],[bx,-2.45]]));arc(side*10.8,0,1.8,-Math.PI/2,Math.PI/2);arc(side*12.6,0,6.75,side===1?Math.PI/2:-Math.PI/2,side===1?Math.PI*1.5:Math.PI/2);makeHoop(side)}seats();let roof=box(38,.28,25,0x1d2127);roof.position.y=10;S.add(roof);for(let z of[-5,0,5]){let l=new THREE.PointLight(0xffffff,3,28);l.position.set(0,8,z);S.add(l)}}function init(){S=new THREE.Scene();S.background=new THREE.Color(0x11141a);C=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,100);R=new THREE.WebGLRenderer({antialias:true});R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,1.5));R.shadowMap.enabled=true;$('#game').appendChild(R.domElement);S.add(new THREE.HemisphereLight(0xd8e8ff,0x2a251f,1.4));let sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(0,16,7);sun.castShadow=true;S.add(sun);courtScene();for(let i=0;i<5;i++){let p=makePlayer('blue',i);p.position.set(-5+i*1.6,-0,[-4,-2,0,2,4][i])}for(let i=0;i<5;i++){let p=makePlayer('red',i);p.position.set(5-i*1.4,0,[-4,-2,0,2,4][i])}ball=mesh(new THREE.SphereGeometry(.24,18,14),new THREE.MeshStandardMaterial({color:0xe36c18,roughness:.8}));S.add(ball);holder=players[0];holder.userData.has=true;controlled=holder;clock3=new THREE.Clock();addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});loop()}function resetPositions(team){players.filter(p=>p.userData.team==='blue').forEach((p,i)=>p.position.set(-4+i*1.2,0,[-4,-2,0,2,4][i]));players.filter(p=>p.userData.team==='red').forEach((p,i)=>p.position.set(4-i*1.2,0,[-4,-2,0,2,4][i]));holder=players.find(p=>p.userData.team===team);players.forEach(p=>p.userData.has=false);holder.userData.has=true;controlled=holder;ball.position.copy(holder.position).add(new THREE.Vector3(0,.7,0));shotInfo=null}function start(){if(!S)init();run=true;blue=red=0;timeLeft=300;resetPositions('blue');$('#home').classList.add('hide');['#hud','#joy','#actions','#power'].forEach(x=>$(x).classList.remove('hide'));clock3.getDelta()}function passBall(){if(!holder||holder.userData.team!=='blue')return;let mates=players.filter(p=>p.userData.team==='blue'&&p!==holder);let target=mates.reduce((a,b)=>b.position.x>a.position.x?b:a,mates[0]);shotInfo={type:'pass',target};ball.position.copy(holder.position).add(new THREE.Vector3(0,1.2,0));ball.userData.v=target.position.clone().sub(ball.position).setY(.4).normalize().multiplyScalar(11);holder.userData.has=false;holder=null;lastTouch='blue'}function shoot(power){if(!holder||holder.userData.team!=='blue')return;let shooter=holder,side=1,target=new THREE.Vector3(court.hoopX,3.08,0);let dist=shooter.position.distanceTo(new THREE.Vector3(court.hoopX,0,0)),ideal=Math.min(1,Math.max(.38,dist/18)),quality=1-Math.abs(power-ideal);let miss=(1-quality)*2.4;target.z+=(Math.random()-.5)*miss;target.x+=(Math.random()-.5)*miss*.4;let start=shooter.position.clone().add(new THREE.Vector3(0,1.7,0));ball.position.copy(start);let T=.9+dist/18,delta=target.clone().sub(start);ball.userData.v=new THREE.Vector3(delta.x/T,(delta.y+4.9*T*T)/T,delta.z/T);shotInfo={type:'shot',team:'blue',shooter,three:dist>6.75,scored:false};shooter.userData.has=false;holder=null;lastTouch='blue'}function spawnMonster(){if(monster)S.remove(monster);monster=new THREE.Group();let b=mesh(new THREE.CapsuleGeometry(.5,1.4,6,10),mat(0x38101a));b.position.y=1.4;monster.add(b);let h=mesh(new THREE.SphereGeometry(.42,12,8),new THREE.MeshStandardMaterial({color:0x12060a,emissive:0x7a0018,emissiveIntensity:1.5}));h.position.y=2.55;monster.add(h);for(let x of[-.6,.6]){let a=box(.18,1.1,.18,0x401018);a.position.set(x,1.5,-.15);monster.add(a)}monster.position.set(-13,0,(Math.random()-.5)*10);S.add(monster);$('#msg').textContent='CANAVAR GELİYOR!';setTimeout(()=>$('#msg').textContent='',900)}function score(team,pts){if(team==='blue')blue+=pts;else red+=pts;spawnMonster();setTimeout(()=>resetPositions(team==='blue'?'red':'blue'),900)}function ai(dt){let blueSlots=[[-7,-4],[-5,-2],[-3,0],[-5,2],[-7,4]],redSlots=[[7,-4],[5,-2],[3,0],[5,2],[7,4]];for(let p of players){if(p===controlled)continue;let arr=p.userData.team==='blue'?blueSlots:redSlots,slot=arr[p.userData.i],target=new THREE.Vector3(slot[0],0,slot[1]);if(holder&&holder.userData.team===p.userData.team){let attack=p.userData.team==='blue'?1:-1;target.x+=attack*3}else if(holder){let opp=players.filter(q=>q.userData.team!==p.userData.team)[p.userData.i]||holder;target.copy(opp.position);target.x+=(p.userData.team==='blue'?-1:1)*.8}let d=target.sub(p.position);d.y=0;if(d.length()>.2){d.normalize();p.position.addScaledVector(d,dt*2.5);p.rotation.y=Math.atan2(d.x,d.z)}}if(holder&&holder.userData.team==='red'){let dToHoop=holder.position.distanceTo(new THREE.Vector3(-court.hoopX,0,0));if(dToHoop<7&&Math.random()<dt*.9)aiShoot(holder,'red');else if(Math.random()<dt*.5)aiPass(holder)}}function aiPass(p){let mates=players.filter(q=>q.userData.team===p.userData.team&&q!==p);let t=mates[Math.floor(Math.random()*mates.length)];ball.position.copy(p.position).add(new THREE.Vector3(0,1.2,0));ball.userData.v=t.position.clone().sub(ball.position).setY(.3).normalize().multiplyScalar(10);p.userData.has=false;holder=null;lastTouch=p.userData.team;shotInfo={type:'pass',target:t}}function aiShoot(p,team){let tx=team==='red'?-court.hoopX:court.hoopX,target=new THREE.Vector3(tx,3.08,0),start=p.position.clone().add(new THREE.Vector3(0,1.7,0)),dist=p.position.distanceTo(new THREE.Vector3(tx,0,0)),T=.9+dist/18,delta=target.clone().sub(start);ball.position.copy(start);ball.userData.v=new THREE.Vector3(delta.x/T,(delta.y+4.9*T*T)/T,delta.z/T);p.userData.has=false;holder=null;lastTouch=team;shotInfo={type:'shot',team,shooter:p,three:dist>6.75,scored:false}}function ballPhysics(dt){if(holder){let t=performance.now()/120,dr=.28+Math.abs(Math.sin(t))*1.05;ball.position.set(holder.position.x,dr,holder.position.z+.35);return}if(!ball.userData.v)ball.userData.v=new THREE.Vector3();ball.userData.v.y-=9.8*dt;ball.position.addScaledVector(ball.userData.v,dt);if(ball.position.y<.24){ball.position.y=.24;if(Math.abs(ball.userData.v.y)>.8)ball.userData.v.y*=-.58;else ball.userData.v.y=0;ball.userData.v.x*=.94;ball.userData.v.z*=.94}if(shotInfo&&shotInfo.type==='shot'&&!shotInfo.scored){let tx=shotInfo.team==='blue'?court.hoopX:-court.hoopX;if(Math.abs(ball.position.x-tx)<.38&&Math.abs(ball.position.z)<.42&&ball.position.y>2.82&&ball.position.y<3.25&&ball.userData.v.y<0){shotInfo.scored=true;score(shotInfo.team,shotInfo.three?3:2)}}for(let p of players){if(ball.position.y<1.55&&ball.position.distanceTo(p.position)<.65){holder=p;p.userData.has=true;controlled=p.userData.team==='blue'?p:controlled;ball.userData.v.set(0,0,0);shotInfo=null;lastTouch=p.userData.team;break}}if(Math.abs(ball.position.x)>court.L/2+.4||Math.abs(ball.position.z)>court.W/2+.4){let team=lastTouch==='blue'?'red':'blue';$('#msg').textContent='TAÇ - '+(team==='blue'?'MAVİ':'KIRMIZI');setTimeout(()=>{$('#msg').textContent='';resetPositions(team)},650)}}function update(dt){timeLeft=Math.max(0,timeLeft-dt);let m=Math.floor(timeLeft/60),s=Math.floor(timeLeft%60).toString().padStart(2,'0');$('#clock').textContent=m+':'+s;$('#blue').textContent=blue;$('#red').textContent=red;if(controlled&&controlled.userData.team==='blue'){let sp=sprint?6.6:4.2,dx=move.x,dz=move.y,l=Math.hypot(dx,dz);if(l>.08){if(l>1){dx/=l;dz/=l}let d=new THREE.Vector3(dx,0,dz);controlled.position.addScaledVector(d,sp*dt);controlled.position.x=THREE.MathUtils.clamp(controlled.position.x,-13.6,13.6);controlled.position.z=THREE.MathUtils.clamp(controlled.position.z,-7.1,7.1);controlled.rotation.y=Math.atan2(dx,dz)}}ai(dt);ballPhysics(dt);if(monster&&controlled){let d=controlled.position.clone().sub(monster.position);d.y=0;if(d.length()>.05){d.normalize();monster.position.addScaledVector(d,dt*7.2);monster.rotation.y=Math.atan2(d.x,d.z)}if(monster.position.distanceTo(controlled.position)<.8){$('#msg').textContent='YAKALANDIN!';monster.position.set(-13,0,(Math.random()-.5)*10)}}C.position.lerp(new THREE.Vector3(controlled?controlled.position.x:0,9.2,(controlled?controlled.position.z:0)+10.5),.08);C.lookAt(controlled?controlled.position.x:0,0,controlled?controlled.position.z-2:0)}function loop(){requestAnimationFrame(loop);if(!S)return;let dt=Math.min(clock3.getDelta(),.035);if(run)update(dt);R.render(S,C)}let active=false;function joyMove(x,y){let r=$('#joy').getBoundingClientRect(),dx=x-r.left-r.width/2,dy=y-r.top-r.height/2,max=36,d=Math.hypot(dx,dy)||1;if(d>max){dx=dx/d*max;dy=dy/d*max}move.x=dx/max;move.y=dy/max;$('#stick').style.transform=`translate(${dx}px,${dy}px)`}$('#joy').addEventListener('pointerdown',e=>{active=true;$('#joy').setPointerCapture(e.pointerId);joyMove(e.clientX,e.clientY)});$('#joy').addEventListener('pointermove',e=>{if(active)joyMove(e.clientX,e.clientY)});$('#joy').addEventListener('pointerup',()=>{active=false;move.x=move.y=0;$('#stick').style.transform='none'});$('#pass').onclick=passBall;$('#steal').onclick=()=>{if(!controlled)return;let opp=players.filter(p=>p.userData.team==='red').sort((a,b)=>a.position.distanceTo(controlled.position)-b.position.distanceTo(controlled.position))[0];if(opp&&opp===holder&&opp.position.distanceTo(controlled.position)<1){opp.userData.has=false;holder=controlled;controlled.userData.has=true;lastTouch='blue'}};$('#sprint').onpointerdown=()=>sprint=true;$('#sprint').onpointerup=$('#sprint').onpointercancel=()=>sprint=false;$('#shoot').addEventListener('pointerdown',e=>{e.preventDefault();if(holder&&holder.userData.team==='blue'){charging=true;charge=0}});$('#shoot').addEventListener('pointerup',e=>{e.preventDefault();if(charging){charging=false;shoot(Math.max(.08,charge));charge=0;$('#powerFill').style.width='0%'}});setInterval(()=>{if(charging){charge+=.025;if(charge>1)charge=0.25;$('#powerFill').style.width=(charge*100)+'%'}},30);$('#play').onclick=start;</script></body></html>
