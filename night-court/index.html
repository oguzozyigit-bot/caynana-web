<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>NIGHT COURT: POSSESSED</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050609;color:#fff;font-family:Arial,sans-serif;touch-action:none}.ui{position:fixed;z-index:20}.hide{display:none!important}#game{position:fixed;inset:0}.home{inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#32141e,#090b10 65%);z-index:50}.panel{width:min(620px,94vw);padding:22px;background:#090c12ee;border:1px solid #ffffff22;border-radius:22px;text-align:center}.logo{font-weight:1000;font-size:clamp(38px,8vw,64px);line-height:.88}.logo b{display:block;color:#e72b49}.primary{width:100%;border:0;border-radius:14px;padding:14px;background:#d52743;color:#fff;font-weight:900;font-size:18px;margin-top:12px}.hud{top:8px;left:50%;transform:translateX(-50%);display:flex;gap:8px}.pill{padding:7px 11px;border-radius:12px;background:#090d13df;border:1px solid #ffffff24;font-weight:900;font-size:12px}.joy{left:18px;bottom:18px;width:118px;height:118px;border-radius:50%;background:#ffffff12;border:1px solid #ffffff35}.stick{position:absolute;width:42px;height:42px;left:38px;top:38px;border-radius:50%;background:#ffffffd8}.lookpad{right:18px;top:22%;width:42vw;height:48vh;border:1px dashed #ffffff25;border-radius:22px;background:#ffffff05;pointer-events:auto}.lookpad span{position:absolute;right:12px;top:12px;font-size:11px;opacity:.55}.actions{right:18px;bottom:18px;display:grid;grid-template-columns:68px 68px 68px;gap:7px}.actions button{height:54px;border:0;border-radius:16px;background:#1a2635;color:#fff;font-weight:900}.actions .shoot{background:#c9233f}.actions .dribble{background:#6f39b8}.power{left:50%;bottom:18px;transform:translateX(-50%);width:190px;height:14px;border-radius:9px;background:#111923;border:1px solid #ffffff button id="pass">PAS</button><button id="steal">ÇAL</button><button id="dribble" class="dribble">ÇALIM</button><button id="sprint">SPRINT</button><button id="shoot" class="shoot">ŞUT</button></div><div id="stamina" class="ui stamina hide"><i id="staminaFill"></i></div><div id="power" class="ui power hide"><i id="powerFill"></i></div><div id="blind" class="ui blind"></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>const $=s=>document.querySelector(s);let scene,camera,renderer,clock,run=false,courtGroup,mansionGroup,players=[],ball,holder,controlled,monster=null,mansionMonster=null,ballVel,shot=null,move={x:0,y:0},sprint=false,stamina=100,charging=false,charge=0,jumpT=0,blue=0,red=0,timeLeft=300,lastTouch='blue',inboundLock=false,inMansion=false,mansionYaw=0,mansionPitch=0,questStep=0,questObjects=[],portal=null,chase=false,catchCd=0,mansionLights=[];const COURT={L:28,W:15,HOOP:12.65};const QUESTS=['Giriş anahtarını bul','Müzik kutusunu çalıştır','Kırık portreyi bul','Kütüphanedeki kitabı bul','Sigortayı aç','Bodrum mührünü kır','Lanetli saati çalıştır'];function mat(c,r=.62,m=.02){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m})}function mesh(g,m){const x=new THREE.Mesh(g,m);x.castShadow=x.receiveShadow=true;return x}function box(w,h,d,c){return mesh(new THREE.BoxGeometry(w,h,d),mat(c))}function human(color,skin=0xc89572,scale=1){const g=new THREE.Group(),t=box(.42,.82,.30,color);t.position.y=1.2;g.add(t);const h=mesh(new THREE.SphereGeometry(.23,12,10),mat(skin));h.position.y=1.78;g.add(h);for(const sx of[-1,1]){const a=box(.12,.68,.12,skin);a.position.set(sx*.34,1.18,0);g.add(a);const l=box(.14,.78,.15,0x222832);l.position.set(sx*.14,.42,0);g.add(l)}g.scale.setScalar(scale);return g}function line(points){const g=new THREE.BufferGeometry().setFromPoints(points.map(p=>new THREE.Vector3(p[0],.025,p[1])));courtGroup.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:0xffffff})))}function arc(cx,cz,r,a1,a2){const p=[];for(let i=0;i<=48;i++){const a=a1+(a2-a1)*i/48;p.push([cx+Math.cos(a)*r,cz+Math.sin(a)*r])}line(p)}function hoop(side){const rimX=side*COURT.HOOP,boardX=side*13.15,postX=side*14.45;const post=box(.16,3.05,.16,0x60666f);post.position.set(postX,1.525,0);courtGroup.add(post);const board=mesh(new THREE.BoxGeometry(.08,1.05,1.8),new THREE.MeshPhysicalMaterial({color:0xffffff,transparent:true,opacity:.72}));board.position.set(boardX,3.45,0);courtGroup.add(board);const rim=mesh(new THREE.TorusGeometry(.45,.035,10,32),mat(0xff671c));rim.rotation.y=Math.PI/2;rim.position.set(rimX,3.05,0);courtGroup.add(rim)}function buildCourt(){courtGroup=new THREE.Group();scene.add(courtGroup);const floor=box(28,.16,15,0xc99b68);floor.position.y=-.08;courtGroup.add(floor);line([[-14,-7.5],[14,-7.5],[14,7.5],[-14,7.5],[-14,-7.5]]);line([[0,-7.5],[0,7.5]]);arc(0,0,1.8,0,Math.PI*2);for(const s of[-1,1]){const bx=s*10.8;line([[bx,-2.45],[s*14,-2.45],[s*14,2.45],[bx,2.45],[bx,-2.45]]);arc(s*12.6,0,6.75,s>0?Math.PI/2:-Math.PI/2,s>0?Math.PI*1.5:Math.PI/2);hoop(s)}for(const side of[-1,1])for(let row=0;row<4;row++)for(let i=-8;i<=8;i+=2){const f=human([0x287be5,0xe43a49,0xe7b642,0x6f50b8][(i+row+20)%4],0xc89572,.72);f.position.set(i*1.45,.25+row*.5,side*(8.7+row*.7));f.rotation.y=side<0?0:Math.PI;courtGroup.add(f)}for(let x of[-10,0,10])for(let z of[-5,0,5]){const l=new THREE.PointLight(0xffffff,1.8,28);l.position.set(x,8,z);courtGroup.add(l)}}function makePlayer(team,i){const g=human(team==='blue'?0x267bea:0xe43c49,team==='blue'?0xc99570:0xb97b58);g.userData={team,i,has:false};courtGroup.add(g);players.push(g);return g}function clampCourt(p){p.position.x=THREE.MathUtils.clamp(p.position.x,-13.6,13.6);p.position.z=THREE.MathUtils.clamp(p.position.z,-7.1,7.1)}function init(){ballVel=new THREE.Vector3();scene=new THREE.Scene();scene.background=new THREE.Color(0x10131a);camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,160);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));$('#game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xdde8ff,0x241d1b,1.45));buildCourt();for(let i=0;i<5;i++){const p=makePlayer('blue',i);p.position.set(-6+i*.8,0,(i-2)*2)}for(let i=0;i<5;i++){const p=makePlayer('red',i);p.position.set(6-i*.8,0,(i-2)*2)}ball=mesh(new THREE.SphereGeometry(.24,18,14),mat(0xe56d18));courtGroup.add(ball);holder=players[0];holder.userData.has=true;controlled=holder;clock=new THREE.Clock();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});loop()}function start(){if(!window.THREE){setTimeout(start,120);return}if(!scene)init();run=true;$('#home').classList.add('hide');['#hud','#joy','#actions','#power','#stamina'].forEach(s=>$(s).classList.remove('hide'));setTimeout(()=>{if(run&&!monster&&!inMansion)spawnCourtMonster()},9000)}$('#play').onclick=start;function spawnCourtMonster(){if(monster)courtGroup.remove(monster);monster=human(0x260710,0x420a10,1.3);monster.position.set(-13,0,(Math.random()-.5)*8);courtGroup.add(monster);$('#msg').textContent='CANAVAR GELİYOR!';setTimeout(()=>$('#msg').textContent='',900)}function shoot(team,p,power=.55){if(!p)return;const hoopX=team==='blue'?COURT.HOOP:-COURT.HOOP,dist=p.position.distanceTo(new THREE.Vector3(hoopX,0,0));let miss=(Math.random()-.5)*(1.1+dist*.055);if(team==='blue')miss+=(power-.58)*2.1;const rim=new THREE.Vector3(hoopX,3.05,miss),sp=p.position.clone().add(new THREE.Vector3(0,1.8,0)),T=.8+dist/20,d=rim.sub(sp);jumpT=.42;ball.position.copy(sp);ballVel.set(d.x/T,(d.y+4.9*T*T)/T,d.z/T);shot={team,three:dist>6.75,scored:false};p.userData.has=false;holder=null;lastTouch=team}function score(team,pts){team==='blue'?blue+=pts:red+=pts;spawnCourtMonster();setTimeout(()=>inbound(team==='blue'?'red':'blue'),700)}function inbound(team){if(inMansion)return;inboundLock=true;players.forEach(p=>p.userData.has=false);const p=players.find(x=>x.userData.team===team);p.position.set(team==='blue'?-13.1:13.1,0,(Math.random()-.5)*6);holder=p;p.userData.has=true;if(team==='blue')controlled=p;ball.position.set(p.position.x,.8,p.position.z);ballVel.set(0,0,0);shot=null;$('#msg').textContent='TAÇ - '+(team==='blue'?'MAVİ':'KIRMIZI');setTimeout(()=>{$('#msg').textContent='';inboundLock=false},700)}function throwIn(){inbound(lastTouch==='blue'?'red':'blue')}function ai(dt){for(const p of players){if(p===controlled)continue;let target;if(holder===p)target=new THREE.Vector3(p.userData.team==='blue'?10.5:-10.5,0,THREE.MathUtils.clamp(p.position.z,-3,3));else if(holder&&holder.userData.team===p.userData.team){const s=p.userData.team==='blue'?1:-1;target=new THREE.Vector3(s*(3+p.userData.i*.55),0,(p.userData.i-2)*2)}else if(holder){const mark=players.filter(q=>q.userData.team!==p.userData.team)[p.userData.i]||holder;target=mark.position.clone()}else target=new THREE.Vector3(p.userData.team==='blue'?-3:3,0,(p.userData.i-2)*2);const d=target.sub(p.position);d.y=0;if(d.length()>.25){d.normalize();p.position.addScaledVector(d,dt*(holder===p?4.3:4));clampCourt(p)}}if(holder&&holder.userData.team==='red'&&holder.position.distanceTo(new THREE.Vector3(-COURT.HOOP,0,0))<8&&Math.random()<dt*1.2)shoot('red',holder,.55)}function physics(dt){if(holder){const t=performance.now()/120;ball.position.set(holder.position.x,.3+Math.abs(Math.sin(t))*1.02,holder.position.z+.38);return}ballVel.y-=9.8*dt;ball.position.addScaledVector(ballVel,dt);if(ball.position.y<.24){ball.position.y=.24;ballVel.y=Math.abs(ballVel.y)>.8?-ballVel.y*.52:0}if(!inboundLock&&(Math.abs(ball.position.x)>14.2||Math.abs(ball.position.z)>7.7)){throwIn();return}if(shot&&!shot.scored){const tx=shot.team==='blue'?COURT.HOOP:-COURT.HOOP;if(Math.abs(ball.position.x-tx)<.22&&Math.abs(ball.position.z)<.27&&ball.position.y>2.84&&ball.position.y<3.18&&ballVel.y<0){shot.scored=true;score(shot.team,shot.three?3:2)}}for(const p of players)if(ball.position.y<1.5&&ball.position.distanceTo(p.position)<.62){holder=p;p.userData.has=true;if(p.userData.team==='blue')controlled=p;ballVel.set(0,0,0);shot=null;lastTouch=p.userData.team;break}}function qObj(x,z,c){const o=box(.65,.65,.65,c);o.position.set(x,.65,z);mansionGroup.add(o);return o}function buildMansion(){courtGroup.visible=false;scene.background=new THREE.Color(0x07060a);mansionGroup=new THREE.Group();scene.add(mansionGroup);const floor=box(46,.2,36,0x201713);floor.position.y=-.1;mansionGroup.add(floor);const ceil=box(46,.18,36,0x0e0b0d);ceil.position.y=5.1;mansionGroup.add(ceil);function wall(x,z,w,d){const m=box(w,5,d,0x2b1b18);m.position.set(x,2.5,z);mansionGroup.add(m)}wall(0,-18,46,.4);wall(0,18,46,.4);wall(-23,0,.4,36);wall(23,0,.4,36);for(const x of[-15,-7,2,11,18]){wall(x,-9,.35,16);wall(x,9,.35,16)}for(const z of[-12,-4,4,12]){wall(-11,z,23,.35);wall(12,z,20,.35)}mansionGroup.add(new THREE.HemisphereLight(0xa9adc0,0x2a1712,.75));for(const [x,z] of[[-19,-14],[-12,-4],[-4,-14],[3,-4],[10,-14],[18,-4],[-18,6],[-8,14],[2,7],[11,14],[20,6]]){const l=new THREE.PointLight(0xffc27a,2.8,12,1.5);l.position.set(x,3.8,z);mansionGroup.add(l);mansionLights.push(l)}questObjects=[qObj(-19,-14,0xe6b33f),qObj(-11,13,0x7b4e9f),qObj(-2,-13,0x8bb7ca),qObj(8,13,0x6e8b4c),qObj(19,-12,0xd33149),qObj(18,12,0x6b3ac8),qObj(0,0,0xb08b45)];portal=mesh(new THREE.TorusGeometry(1.35,.18,12,36),mat(0x6b2bc8));portal.rotation.y=Math.PI/2;portal.position.set(-20,1.6,14);portal.visible=false;mansionGroup.add(portal);controlled.visible=false;controlled.position.set(-20,0,-15);mansionYaw=.3;mansionPitch=0;questStep=0;chase=false;mansionMonster=null;$('#mansionHud').classList.remove('hide');$('#danger').classList.add('hide');$('#lookpad').classList.remove('hide');$('#questText').textContent='1/7 — '+QUESTS[0];$('#actions').classList.add('hide');$('#power').classList.add('hide')}function enterMansion(){run=false;inMansion=true;$('#blind').classList.add('on');setTimeout(()=>{if(monster){courtGroup.remove(monster);monster=null}buildMansion();$('#blind').classList.remove('on');run=true},700)}function activateChase(){chase=true;portal.visible=true;mansionMonster=human(0x130106,0x36020a,1.25);mansionMonster.position.set(20,0,-15);mansionGroup.add(mansionMonster);$('#danger').classList.remove('hide');$('#questText').textContent='PORTALA KAÇ!';for(const l of mansionLights){l.color.set(0xff334f);l.intensity=1.7}}function mansionUpdate(dt){const f=-move.y,s=move.x,dir=new THREE.Vector3(Math.sin(mansionYaw),0,Math.cos(mansionYaw)),right=new THREE.Vector3(dir.z,0,-dir.x),sp=(sprint&&stamina>0?5.6:4)*dt;if(Math.abs(f)>.04)controlled.position.addScaledVector(dir,f*sp);if(Math.abs(s)>.04)controlled.position.addScaledVector(right,s*sp*.85);controlled.position.x=THREE.MathUtils.clamp(controlled.position.x,-22.2,22.2);controlled.position.z=THREE.MathUtils.clamp(controlled.position.z,-17.2,17.2);if(!chase&&questStep<questObjects.length){const q=questObjects[questStep];if(q.visible&&controlled.position.distanceTo(q.position)<1.15){q.visible=false;questStep++;if(questStep<QUESTS.length)$('#questText').textContent=(questStep+1)+'/7 — '+QUESTS[questStep];else activateChase()}}if(chase&&portal&&controlled.position.distanceTo(portal.position)<1.4){exitMansion();return}if(chase&&mansionMonster){const d=controlled.position.clone().sub(mansionMonster.position);d.y=0;if(d.length()>.05){d.normalize();mansionMonster.position.addScaledVector(d,dt*3.05)}if(mansionMonster.position.distanceTo(controlled.position)<.85){controlled.position.set(19,0,14);mansionMonster.position.set(20,0,-15)}}camera.position.set(controlled.position.x,1.66,controlled.position.z);const cp=Math.cos(mansionPitch),look=new THREE.Vector3(Math.sin(mansionYaw)*cp,Math.sin(mansionPitch),Math.cos(mansionYaw)*cp);camera.lookAt(camera.position.clone().add(look.multiplyScalar(6)))}function exitMansion(){inMansion=false;if(mansionGroup)scene.remove(mansionGroup);mansionGroup=null;mansionLights=[];courtGroup.visible=true;scene.background.set(0x10131a);controlled.visible=true;controlled.position.set(-5,0,0);$('#mansionHud').classList.add('hide');$('#danger').classList.add('hide');$('#lookpad').classList.add('hide');$('#actions').classList.remove('hide');$('#power').classList.remove('hide')}function update(dt){if(sprint&&stamina>0)stamina=Math.max(0,stamina-dt*28);else stamina=Math.min(100,stamina+dt*18);$('#staminaFill').style.width=stamina+'%';if(stamina<=0)sprint=false;if(inMansion){mansionUpdate(dt);return}timeLeft=Math.max(0,timeLeft-dt);$('#clock').textContent=Math.floor(timeLeft/60)+':'+Math.floor(timeLeft%60).toString().padStart(2,'0');$('#blue').textContent=blue;$('#red').textContent=red;if(controlled){if(jumpT>0){jumpT-=dt;controlled.position.y=Math.sin(Math.max(0,jumpT)/.42*Math.PI)*.7}else controlled.position.y=0;let dx=move.x,dz=move.y,L=Math.hypot(dx,dz);if(L>.05){if(L>1){dx/=L;dz/=L}const d=new THREE.Vector3(dx,0,dz);controlled.position.addScaledVector(d,(sprint&&stamina>0?5.5:4.4)*dt);clampCourt(controlled)}}ai(dt);physics(dt);if(monster&&controlled){const d=controlled.position.clone().sub(monster.position);d.y=0;if(d.length()>.05){d.normalize();monster.position.addScaledVector(d,dt*6.5)}if(monster.position.distanceTo(controlled.position)<.8)enterMansion()}camera.position.lerp(new THREE.Vector3(controlled.position.x,7.1,controlled.position.z+9),.08);camera.lookAt(controlled.position.x,.8,controlled.position.z-1)}function loop(){requestAnimationFrame(loop);if(!scene)return;const dt=Math.min(clock.getDelta(),.035);if(run)update(dt);renderer.render(scene,camera)}let joyActive=false;function jm(x,y){const r=$('#joy').getBoundingClientRect(),m=36;let dx=x-r.left-r.width/2,dy=y-r.top-r.height/2,d=Math.hypot(dx,dy)||1;if(d>m){dx=dx/d*m;dy=dy/d*m}move.x=dx/m;move.y=dy/m;$('#stick').style.transform=`translate(${dx}px,${dy}px)`}$('#joy').onpointerdown=e=>{joyActive=true;jm(e.clientX,e.clientY)};$('#joy').onpointermove=e=>joyActive&&jm(e.clientX,e.clientY);$('#joy').onpointerup=$('#joy').onpointercancel=()=>{joyActive=false;move.x=move.y=0;$('#stick').style.transform='none'};let lookActive=false,lx=0,ly=0;$('#lookpad').onpointerdown=e=>{lookActive=true;lx=e.clientX;ly=e.clientY};$('#lookpad').onpointermove=e=>{if(!lookActive)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;mansionYaw-=dx*.007;mansionPitch=THREE.MathUtils.clamp(mansionPitch-dy*.005,-.9,.9)};$('#lookpad').onpointerup=$('#lookpad').onpointercancel=()=>lookActive=false;$('#sprint').onpointerdown=()=>{if(stamina>5)sprint=true};$('#sprint').onpointerup=$('#sprint').onpointercancel=()=>sprint=false;$('#steal').onclick=()=>{if(holder&&holder.userData.team==='red'&&controlled.position.distanceTo(holder.position)<1.2&&Math.random()<.65){holder.userData.has=false;holder=controlled;controlled.userData.has=true;lastTouch='blue'}};$('#pass').onclick=()=>{if(holder&&holder.userData.team==='blue'){const mates=players.filter(p=>p.userData.team==='blue'&&p!==holder);mates.sort((a,b)=>b.position.x-a.position.x);const t=mates[0];holder.userData.has=false;t.userData.has=true;holder=t;controlled=t;lastTouch='blue'}};$('#dribble').onclick=()=>{if(controlled){const side=Math.random()<.5?-1:1;controlled.position.z=THREE.MathUtils.clamp(controlled.position.z+side*1.5,-7,7)}};$('#shoot').onpointerdown=e=>{e.preventDefault();if(holder&&holder.userData.team==='blue'){charging=true;charge=0}};$('#shoot').onpointerup=e=>{e.preventDefault();if(charging){charging=false;shoot('blue',holder,charge);charge=0;$('#powerFill').style.width='0%'}};setInterval(()=>{if(charging){charge+=.025;if(charge>1)charge=.15;$('#powerFill').style.width=(charge*100)+'%'}},30)</script></body></html>
