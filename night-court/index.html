 class="ui blind"></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>const $=s=>document.querySelector(s);let scene,camera,renderer,clock,run=false,courtGroup,mansionGroup,players=[],ball,holder,controlled,monster,mansionMonster,ballVel,shot,move={x:0,y:0},sprint=false,stamina=100,charging=false,charge=0,jumpT=0,blue=0,red=0,timeLeft=300,lastTouch='blue',inboundLock=false,inMansion=false,mansionYaw=.3,mansionPitch=0,questStep=0,questObjects=[],portal,chase=false,mansionLights=[];const HOOP=12.65,QUESTS=['Antredeki paslı anahtarı bul','TV odasındaki eski televizyonu aç','Yatak odasındaki bebeği bul','Örümcek ağlı koridordan geç','Çalışma odasındaki lanetli kitabı bul','Sigorta kutusunu çalıştır','Bodrum mührünü kır'];function mat(c,r=.7,m=.02){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m})}function mesh(g,m){const o=new THREE.Mesh(g,m);o.castShadow=o.receiveShadow=true;return o}function box(w,h,d,c){return mesh(new THREE.BoxGeometry(w,h,d),mat(c))}function add(parent,o,x=0,y=0,z=0){o.position.set(x,y,z);parent.add(o);return o}function part(parent,name,geo,material,x,y,z){const pivot=new THREE.Group();pivot.name=name;pivot.position.set(x,y,z);const m=mesh(geo,material);pivot.add(m);parent.add(pivot);return pivot}function shoe(parent,name,x){const pivot=new THREE.Group();pivot.name=name;pivot.position.set(x,.11,.11);const sole=mesh(new THREE.CapsuleGeometry(.12,.24,4,8),mat(0x14171c));sole.rotation.x=Math.PI/2;sole.scale.set(1,1,1.25);sole.position.z=.08;pivot.add(sole);const upper=mesh(new THREE.CapsuleGeometry(.105,.18,4,8),mat(0x252b34));upper.rotation.x=Math.PI/2;upper.scale.set(1,1,1.18);upper.position.set(0,.07,.06);pivot.add(upper);parent.add(pivot);return pivot}function human(color,skin=0xc89572,scale=1){const g=new THREE.Group(),body=new THREE.Group();g.add(body);const torso=part(body,'torso',new THREE.CapsuleGeometry(.28,.72,5,10),mat(color),0,1.15,0),head=part(body,'head',new THREE.Sph
