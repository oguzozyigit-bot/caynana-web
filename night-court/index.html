<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>NIGHT COURT: POSSESSED</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090d;color:#fff;font-family:Arial,sans-serif;touch-action:none}button{font:inherit;touch-action:manipulation}.ui{position:fixed;z-index:20}.hide{display:none!important}#game{position:fixed;inset:0}.home,.screen{inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#3b1722,#090b10 62%);z-index:50}.panel{width:min(660px,94vw);max-height:92vh;overflow:auto;padding:22px;background:#0b0e15ee;border:1px solid #ffffff24;border-radius:24px;text-align:center;box-shadow:0 30px 90px #000c}.logo{font-weight:1000;font-size:clamp(40px,8vw,66px);line-height:.86}.logo b{display:block;color:#e92e4a}.primary,.menuBtn{width:100%;border:0;border-radius:15px;padding:14px;background:#d92743;color:#fff;font-weight:900;font-size:18px;margin-top:10px}.menuBtn{background:#1b2635}.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.char{padding:12px;border-radius:16px;background:#111923;border:2px solid transparent}.char.sel{border-color:#fff}.avatar{width:42px;height:42px;border-radius:50%;margin:auto}.stats{font-size:12px;line-height:1.5;color:#cbd3de}.hud{top:8px;left:50%;transform:translateX(-50%);display:flex;gap:8px}.pill{padding:7px 11px;border-radius:12px;background:#090d13df;border:1px solid #ffffff24;font-weight:900;font-size:12px}.joy{left:18px;bottom:18px;width:118px;height:118px;border-radius:50%;background:#ffffff12;border:1px solid #ffffff35}.stick{position:absolute;width:42px;height:42px;left:38px;top:38px;border-radius:50%;background:#ffffffd8}.actions{right:18px;bottom:18px;display:grid;grid-template-columns:72px 72px 72px;gap:7px}.actions button{height:56px;border:0;border-radius:16px;background:#1a2635;color:#fff;font-weight:900}.actions .shoot{background:#c9233f}.actions .dribble{background:#6f39b8}.power{left:50%;bottom:18px;transform:translateX(-50%);width:190px;height:14px;border-radius:9px;background:#111923;border:1px solid #ffffff36;overflow:hidden}.power i{display:block;width:0;height:100%;background:linear-gradient(90deg,#4dd36a,#f3ce4e,#ed4a55)}.msg{left:50%;top:55px;transform:translateX(-50%);font-size:20px;font-weight:1000;text-shadow:0 3px 10px #000;white-space:nowrap}.blind{inset:0;background:#000;z-index:90;opacity:0;pointer-events:none;transition:opacity .22s}.blind.on{opacity:1}.mansion{inset:0;z-index:80;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#4a1823,#12080c 48%,#020304 85%)}.quest{display:flex;justify-content:space-between;gap:8px;padding:12px;margin:8px 0;border-radius:12px;background:#151018;border:1px solid #ffffff18}.quest.done{opacity:.55;text-decoration:line-through}.locked{opacity:.45}.rotate{display:none;inset:0;z-index:120;background:#020304;place-items:center;text-align:center;font-size:24px;font-weight:900}@media(orientation:portrait){.rotate{display:grid}}@media(max-width:650px){.chars{grid-template-columns:1fr}.panel{padding:16px}.actions{grid-template-columns:64px 64px 64px}.actions button{height:52px}}</style></head><body><div id="game"></div><div id="rotate" class="ui rotate">📱↻<br>Telefonu yatay çevir</div><div id="home" class="ui home"><div class="panel"><div class="logo">NIGHT COURT<b>POSSESSED</b></div><p>3D korku basketbolu</p><button id="play" class="primary">MAÇA BAŞLA</button><button id="charMenu" class="menuBtn">KARAKTER SEÇ</button></div></div><div id="charScreen" class="ui screen hide"><div class="panel"><h2>KARAKTER SEÇ</h2><div id="chars" class="chars"></div><button id="charBack" class="menuBtn">ANA MENÜ</button></div></div><div id="hud" class="ui hud hide"><div class="pill">MAVİ <span id="blue">0</span></div><div class="pill"><span id="clock">5:00</span></div><div class="pill">KIRMIZI <span id="red">0</span></div></div><div id="msg" class="ui msg"></div><div id="joy" class="ui joy hide"><div id="stick" class="stick"></div></div><div id="actions" class="ui actions hide"><button id="pass">PAS</button><button id="steal">ÇAL</button><button id="dribble" class="dribble">ÇALIM</button><button id="sprint">SPRINT</button><button id="shoot" class="shoot">ŞUT</button></div><div id="power" class="ui power hide"><i id="powerFill"></i></div><div id="blind" class="ui blind"></div><div id="mansion" class="ui mansion hide"><div class="panel"><h1>LANETLİ MALİKÂNE</h1><p>Canavar seni kaçırdı. Portal hemen açılmıyor; önce görevleri tamamla.</p><div id="quests"></div><button id="portal" class="primary locked" disabled>PORTAL KİLİTLİ</button></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>const $=s=>document.querySelector(s);const CHARS=[{n:'RAVEN',c:0x267bea,css:'#267bea',speed:4.5,shot:.90,steal:1.15,stam:1.0},{n:'NOX',c:0x8b4bd6,css:'#8b4bd6',speed:4.15,shot:1.05,steal:1.0,stam:1.1},{n:'BLAZE',c:0xf05a2a,css:'#f05a2a',speed:4.8,shot:.82,steal:.92,stam:.95},{n:'GHOST',c:0xe7e7e7,css:'#e7e7e7',speed:4.3,shot:.95,steal:1.25,stam:.9},{n:'TITAN',c:0x33a16d,css:'#33a16d',speed:3.9,shot:.88,steal:1.35,stam:1.3},{n:'VOLT',c:0xf0cf3d,css:'#f0cf3d',speed:4.65,shot:.92,steal:1.05,stam:1.0}];let selected=0;let scene,camera,renderer,clock,run=false,players=[],fans=[],ball,holder,controlled,monster=null,ballVel,shot=null,move={x:0,y:0},sprint=false,charging=false,charge=0,blue=0,red=0,timeLeft=300,lastTouch='blue',inboundLock=false,questStep=0;const COURT={L:28,W:15,HOOP:12.65};function renderChars(){const root=$('#chars');root.innerHTML='';CHARS.forEach((c,i)=>{const d=document.createElement('button');d.className='char '+(i===selected?'sel':'');d.innerHTML=`<div class="avatar" style="background:${c.css}"></div><b>${c.n}</b><div class="stats">Hız ${c.speed.toFixed(1)} · Şut ${Math.round(c.shot*100)}<br>Çalma ${Math.round(c.steal*100)} · Dayanıklılık ${Math.round(c.stam*100)}</div>`;d.onclick=()=>{selected=i;renderChars()};root.appendChild(d)})}renderChars();$('#charMenu').onclick=()=>{$('#home').classList.add('hide');$('#charScreen').classList.remove('hide')};$('#charBack').onclick=()=>{$('#charScreen').classList.add('hide');$('#home').classList.remove('hide')};function mat(c,r=.62,m=.02){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m})}function M(g,m){const x=new THREE.Mesh(g,m);x.castShadow=x.receiveShadow=true;return x}function box(w,h,d,c){return M(new THREE.BoxGeometry(w,h,d),mat(c))}function human(color,skin=0xc89572,fan=false){const g=new THREE.Group(),torso=box(fan?.34:.42,fan?.65:.82,fan?.24:.30,color);torso.position.y=fan?1.05:1.2;g.add(torso);const head=M(new THREE.SphereGeometry(fan?.18:.23,12,10),mat(skin));head.position.y=fan?1.52:1.78;g.add(head);for(const sx of[-1,1]){const arm=box(fan?.10:.12,fan?.55:.68,fan?.10:.12,skin);arm.position.set(sx*(fan?.27:.34),fan?.98:1.18,0);g.add(arm);const leg=box(fan?.11:.14,fan?.60:.78,fan?.12:.15,0x222832);leg.position.set(sx*(fan?.11:.14),fan?.43:.42,0);g.add(leg)}return g}function addLine(points){const g=new THREE.BufferGeometry().setFromPoints(points.map(p=>new THREE.Vector3(p[0],.025,p[1])));scene.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:0xffffff})))}function addArc(cx,cz,r,a1,a2){const p=[];for(let i=0;i<=64;i++){const a=a1+(a2-a1)*i/64;p.push([cx+Math.cos(a)*r,cz+Math.sin(a)*r])}addLine(p)}function hoop(side){const rimX=side*COURT.HOOP,boardX=side*13.15,postX=side*14.45;const post=box(.16,3.05,.16,0x60666f);post.position.set(postX,1.525,0);scene.add(post);const arm=box(Math.abs(postX-boardX),.10,.10,0x60666f);arm.position.set((postX+boardX)/2,3.08,0);scene.add(arm);const board=M(new THREE.BoxGeometry(.08,1.05,1.80),new THREE.MeshPhysicalMaterial({color:0xffffff,transparent:true,opacity:.72,roughness:.08}));board.position.set(boardX,3.45,0);scene.add(board);const rim=M(new THREE.TorusGeometry(.45,.035,10,32),new THREE.MeshStandardMaterial({color:0xff671c,metalness:.45,roughness:.35}));rim.rotation.y=Math.PI/2;rim.position.set(rimX,3.05,0);scene.add(rim);for(let i=0;i<12;i++){const a=i*Math.PI*2/12,z=Math.cos(a)*.45;const geo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(rimX,3.04,z),new THREE.Vector3(rimX+side*.03,2.48,z*.52)]);scene.add(new THREE.Line(geo,new THREE.LineBasicMaterial({color:0xffffff})))} }function standsAndFans(){const colors=[0x2c7be5,0xe43a49,0xe6b13a,0x7e52c7,0x35a36a,0xdddddd];for(const side of[-1,1])for(let row=0;row<5;row++)for(let i=-9;i<=9;i++){const seat=box(.72,.34,.72,row%2?0x424b58:0x333b46);seat.position.set(i*1.35,.3+row*.42,side*(COURT.W/2+1.6+row*.72));scene.add(seat);if(i%2===0||row<4){const f=human(colors[(i+row+20)%colors.length],0xc89572,true);f.position.set(seat.position.x,seat.position.y+.22,seat.position.z);f.rotation.y=side<0?0:Math.PI;scene.add(f);fans.push(f)}}for(const side of[-1,1])for(let row=0;row<4;row++)for(let i=-4;i<=4;i++){const seat=box(.72,.34,.72,0x3d4652);seat.position.set(side*(COURT.L/2+1.7+row*.72),.3+row*.42,i*1.38);scene.add(seat);if(i%2===0||row<2){const f=human(colors[(i+row+12)%colors.length],0xb98362,true);f.position.copy(seat.position).add(new THREE.Vector3(0,.22,0));f.rotation.y=side<0?Math.PI/2:-Math.PI/2;scene.add(f);fans.push(f)}}}function court3D(){const floor=box(COURT.L,.16,COURT.W,0xc99b68);floor.position.y=-.08;scene.add(floor);addLine([[-14,-7.5],[14,-7.5],[14,7.5],[-14,7.5],[-14,-7.5]]);addLine([[0,-7.5],[0,7.5]]);addArc(0,0,1.8,0,Math.PI*2);for(const side of[-1,1]){const bx=side*10.8;addLine([[bx,-2.45],[side*14,-2.45],[side*14,2.45],[bx,2.45],[bx,-2.45]]);addArc(bx,0,1.8,-Math.PI/2,Math.PI/2);addArc(side*12.6,0,6.75,side>0?Math.PI/2:-Math.PI/2,side>0?Math.PI*1.5:Math.PI/2);hoop(side)}standsAndFans();const roof=box(42,.25,29,0x1c2027);roof.position.y=10;scene.add(roof);for(let x of[-10,0,10])for(let z of[-6,0,6]){const l=new THREE.PointLight(0xffffff,2.2,28);l.position.set(x,8,z);scene.add(l)}for(const z of[-13,13]){const wall=box(42,7,.2,0x171b22);wall.position.set(0,3.5,z);scene.add(wall)}for(const x of[-20,20]){const wall=box(.2,7,26,0x171b22);wall.position.set(x,3.5,0);scene.add(wall)}}function makePlayer(team,i){const color=team==='blue'?(i===0?CHARS[selected].c:0x267bea):0xe43c49;const g=human(color,team==='blue'?0xc99570:0xb97b58,false);g.userData={team,i,has:false};scene.add(g);players.push(g);return g}function init(){ballVel=new THREE.Vector3();scene=new THREE.Scene();scene.background=new THREE.Color(0x10131a);camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,130);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;$('#game').innerHTML='';$('#game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xdde8ff,0x241d1b,1.5));const sun=new THREE.DirectionalLight(0xffffff,1.6);sun.position.set(0,15,8);scene.add(sun);court3D();for(let i=0;i<5;i++){const p=makePlayer('blue',i);p.position.set(-6+i*.9,0,[-4,-2,0,2,4][i])}for(let i=0;i<5;i++){const p=makePlayer('red',i);p.position.set(6-i*.9,0,[-4,-2,0,2,4][i])}ball=M(new THREE.SphereGeometry(.24,18,14),mat(0xe56d18));scene.add(ball);holder=players[0];holder.userData.has=true;controlled=holder;clock=new THREE.Clock();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});loop()}function start(){if(!window.THREE){$('#msg').textContent='3D motoru yükleniyor...';setTimeout(start,150);return}if(!scene)init();run=true;timeLeft=300;blue=red=0;$('#home').classList.add('hide');['#hud','#joy','#actions','#power'].forEach(s=>$(s).classList.remove('hide'));setTimeout(()=>{if(run&&!monster)spawnMonster()},9000)}$('#play').onclick=start;function shootBall(pw){if(!holder||holder.userData.team!=='blue')return;const shooter=holder,cfg=CHARS[selected],rim=new THREE.Vector3(COURT.HOOP,3.05,0),startP=shooter.position.clone().add(new THREE.Vector3(0,1.7,0)),dist=shooter.position.distanceTo(new THREE.Vector3(COURT.HOOP,0,0)),ideal=THREE.MathUtils.clamp(dist/18,.35,.9),error=Math.abs(pw-ideal)+(1-cfg.shot)*.4;rim.z+=(Math.random()-.5)*(.7+error*4);rim.x+=(Math.random()-.5)*(.5+error*3);const T=.8+dist/20,d=rim.clone().sub(startP);ball.position.copy(startP);ballVel.set(d.x/T,(d.y+4.9*T*T)/T,d.z/T);shot={team:'blue',three:dist>6.75,scored:false};shooter.userData.has=false;holder=null;lastTouch='blue'}function aiShoot(p){const rim=new THREE.Vector3(-COURT.HOOP,3.05,(Math.random()-.5)*.65),startP=p.position.clone().add(new THREE.Vector3(0,1.7,0)),dist=p.position.distanceTo(new THREE.Vector3(-COURT.HOOP,0,0)),T=.8+dist/20,d=rim.sub(startP);ball.position.copy(startP);ballVel.set(d.x/T,(d.y+4.9*T*T)/T,d.z/T);p.userData.has=false;holder=null;lastTouch='red';shot={team:'red',three:dist>6.75,scored:false}}function spawnMonster(){if(monster)scene.remove(monster);monster=human(0x2b0710,0x3b0810,false);monster.scale.set(1.35,1.35,1.35);monster.position.set(-13,0,(Math.random()-.5)*8);scene.add(monster);$('#msg').textContent='CANAVAR GELİYOR!';setTimeout(()=>$('#msg').textContent='',900)}function renderQuests(){const names=['Lanetli anahtarı bul','Kırık aynayı onar','Elektrik sigortasını aç'];$('#quests').innerHTML=names.map((n,i)=>`<div class="quest ${i<questStep?'done':''}"><span>${n}</span><button ${i!==questStep?'disabled':''} onclick="completeQuest(${i})">${i<questStep?'TAMAM':'YAP'}</button></div>`).join('');const done=questStep>=3;$('#portal').disabled=!done;$('#portal').classList.toggle('locked',!done);$('#portal').textContent=done?'PORTALDAN ÇIK':'PORTAL KİLİTLİ'}window.completeQuest=i=>{if(i!==questStep)return;questStep++;renderQuests()};function caught(){run=false;$('#blind').classList.add('on');questStep=0;setTimeout(()=>{$('#mansion').classList.remove('hide');$('#blind').classList.remove('on');renderQuests()},900)}$('#portal').onclick=()=>{if(questStep<3)return;$('#mansion').classList.add('hide');if(monster){scene.remove(monster);monster=null}run=true};function score(team,pts){if(team==='blue')blue+=pts;else red+=pts;spawnMonster();setTimeout(()=>inbound(team==='blue'?'red':'blue'),700)}function inbound(team){inboundLock=true;players.forEach(p=>p.userData.has=false);const p=players.find(x=>x.userData.team===team);p.position.set(team==='blue'?-13.1:13.1,0,0);holder=p;p.userData.has=true;if(team==='blue')controlled=p;ballVel.set(0,0,0);shot=null;setTimeout(()=>inboundLock=false,700)}function separate(){for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++){const a=players[i],b=players[j],d=b.position.clone().sub(a.position);d.y=0;const L=d.length();if(L>0&&L<.9){d.normalize().multiplyScalar((.9-L)*.5);a.position.addScaledVector(d,-1);b.position.add(d)}}}function ai(dt){const bs=[[-7,-4],[-5,-2],[-3,0],[-5,2],[-7,4]],rs=[[7,-4],[5,-2],[3,0],[5,2],[7,4]];for(const p of players){if(p===controlled)continue;let target;if(holder===p)target=new THREE.Vector3(p.userData.team==='red'?-10.8:10.8,0,THREE.MathUtils.clamp(p.position.z,-3.2,3.2));else{const s=p.userData.team==='blue'?bs:rs;target=new THREE.Vector3(s[p.userData.i][0],0,s[p.userData.i][1]);if(holder&&holder.userData.team!==p.userData.team){const opp=players.filter(q=>q.userData.team!==p.userData.team)[p.userData.i]||holder;target.copy(opp.position);target.x+=(p.userData.team==='blue'?-1:1)*1.1}}const d=target.sub(p.position);d.y=0;if(d.length()>.22){d.normalize();p.position.addScaledVector(d,dt*4.1);p.rotation.y=Math.atan2(d.x,d.z)}}if(holder&&holder.userData.team==='red'){const dist=holder.position.distanceTo(new THREE.Vector3(-COURT.HOOP,0,0));if(dist<8.2&&Math.random()<dt*1.2)aiShoot(holder)}}function physics(dt){if(holder){const t=performance.now()/120;ball.position.set(holder.position.x,.28+Math.abs(Math.sin(t))*1.05,holder.position.z+.38);return}ballVel.y-=9.8*dt;ball.position.addScaledVector(ballVel,dt);if(ball.position.y<.24){ball.position.y=.24;ballVel.y=Math.abs(ballVel.y)>.8?-ballVel.y*.55:0;ballVel.x*=.95;ballVel.z*=.95}if(shot&&!shot.scored){const tx=shot.team==='blue'?COURT.HOOP:-COURT.HOOP;if(Math.abs(ball.position.x-tx)<.24&&Math.abs(ball.position.z)<.28&&ball.position.y>2.82&&ball.position.y<3.22&&ballVel.y<0){shot.scored=true;score(shot.team,shot.three?3:2)}}for(const p of players){if(ball.position.y<1.5&&ball.position.distanceTo(p.position)<.62){holder=p;p.userData.has=true;if(p.userData.team==='blue')controlled=p;ballVel.set(0,0,0);shot=null;lastTouch=p.userData.team;break}}if(!inboundLock&&(Math.abs(ball.position.x)>COURT.L/2+.15||Math.abs(ball.position.z)>COURT.W/2+.15))inbound(lastTouch==='blue'?'red':'blue')}function update(dt){timeLeft=Math.max(0,timeLeft-dt);$('#clock').textContent=Math.floor(timeLeft/60)+':'+Math.floor(timeLeft%60).toString().padStart(2,'0');$('#blue').textContent=blue;$('#red').textContent=red;if(controlled){let dx=move.x,dz=move.y,L=Math.hypot(dx,dz);if(L>.05){if(L>1){dx/=L;dz/=L}const d=new THREE.Vector3(dx,0,dz),cfg=CHARS[selected];controlled.position.addScaledVector(d,(sprint?cfg.speed*1.35:cfg.speed)*dt);controlled.rotation.y=Math.atan2(dx,dz)}}ai(dt);separate();physics(dt);if(monster&&controlled){const d=controlled.position.clone().sub(monster.position);d.y=0;if(d.length()>.05){d.normalize();monster.position.addScaledVector(d,dt*7.2)}if(monster.position.distanceTo(controlled.position)<.8)caught()}camera.position.lerp(new THREE.Vector3(controlled?controlled.position.x:0,7.2,(controlled?controlled.position.z:0)+9.2),.08);camera.lookAt(controlled?controlled.position.x:0,.8,controlled?controlled.position.z-1:0)}function loop(){requestAnimationFrame(loop);if(!scene)return;const dt=Math.min(clock.getDelta(),.035);if(run)update(dt);renderer.render(scene,camera)}let active=false;function jm(x,y){const r=$('#joy').getBoundingClientRect(),m=36;let dx=x-r.left-r.width/2,dy=y-r.top-r.height/2,d=Math.hypot(dx,dy)||1;if(d>m){dx=dx/d*m;dy=dy/d*m}move.x=dx/m;move.y=dy/m;$('#stick').style.transform=`translate(${dx}px,${dy}px)`}$('#joy').onpointerdown=e=>{active=true;jm(e.clientX,e.clientY)};$('#joy').onpointermove=e=>active&&jm(e.clientX,e.clientY);$('#joy').onpointerup=()=>{active=false;move.x=move.y=0;$('#stick').style.transform='none'};$('#sprint').onpointerdown=()=>sprint=true;$('#sprint').onpointerup=$('#sprint').onpointercancel=()=>sprint=false;$('#steal').onclick=()=>{if(!controlled)return;const opp=players.filter(p=>p.userData.team==='red').sort((a,b)=>a.position.distanceTo(controlled.position)-b.position.distanceTo(controlled.position))[0],range=1.05*CHARS[selected].steal;if(opp&&holder===opp&&opp.position.distanceTo(controlled.position)<range){opp.userData.has=false;holder=controlled;controlled.userData.has=true;ballVel.set(0,0,0);shot=null;lastTouch='blue';$('#msg').textContent='TOPU ÇALDIN!';setTimeout(()=>$('#msg').textContent='',500)}};$('#pass').onclick=()=>{if(!holder||holder.userData.team!=='blue')return;const t=players.filter(p=>p.userData.team==='blue'&&p!==holder).sort((a,b)=>b.position.x-a.position.x)[0];if(!t)return;ball.position.copy(holder.position).add(new THREE.Vector3(0,1.1,0));ballVel.copy(t.position.clone().sub(ball.position).setY(.35).normalize().multiplyScalar(10));holder.userData.has=false;holder=null;lastTouch='blue';shot=null};$('#dribble').onclick=()=>{if(controlled){const f=new THREE.Vector3(Math.sin(controlled.rotation.y),0,Math.cos(controlled.rotation.y));controlled.position.addScaledVector(f,1.1)}};$('#shoot').onpointerdown=e=>{e.preventDefault();if(holder&&holder.userData.team==='blue'){charging=true;charge=0}};$('#shoot').onpointerup=e=>{e.preventDefault();if(charging){charging=false;shootBall(Math.max(.08,charge));charge=0;$('#powerFill').style.width='0%'}};setInterval(()=>{if(charging){charge+=.025;if(charge>1)charge=.2;$('#powerFill').style.width=(charge*100)+'%'}},30)</script></body></html>
