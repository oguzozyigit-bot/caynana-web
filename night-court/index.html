<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>NIGHT COURT: POSSESSED</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090d;color:#fff;font-family:Arial,sans-serif;touch-action:none}button{font:inherit;touch-action:manipulation}.ui{position:fixed;z-index:20}.hide{display:none!important}#game{position:fixed;inset:0}.home{inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#3b1722,#090b10 62%);z-index:50}.panel{width:min(580px,92vw);padding:24px;background:#0b0e15ee;border:1px solid #ffffff24;border-radius:24px;text-align:center;box-shadow:0 30px 90px #000c}.logo{font-weight:1000;font-size:clamp(42px,8vw,68px);line-height:.85}.logo b{display:block;color:#e92e4a}.primary{width:100%;border:0;border-radius:15px;padding:16px;background:#d92743;color:#fff;font-weight:900;font-size:20px;margin-top:18px}.hud{top:8px;left:50%;transform:translateX(-50%);display:flex;gap:8px}.pill{padding:7px 11px;border-radius:12px;background:#090d13df;border:1px solid #ffffff24;font-weight:900;font-size:12px}.joy{left:18px;bottom:18px;width:118px;height:118px;border-radius:50%;background:#ffffff12;border:1px solid #ffffff35}.stick{position:absolute;width:42px;height:42px;left:38px;top:38px;border-radius:50%;background:#ffffffd8}.actions{right:18px;bottom:18px;display:grid;grid-template-columns:72px 72px 72px;gap:7px}.actions button{height:56px;border:0;border-radius:16px;background:#1a2635;color:#fff;font-weight:900}.actions .shoot{background:#c9233f}.actions .dribble{background:#6f39b8}.power{left:50%;bottom:18px;transform:translateX(-50%);width:190px;height:14px;border-radius:9px;background:#111923;border:1px solid #ffffff36;overflow:hidden}.power i{display:block;width:0;height:100%;background:linear-gradient(90deg,#4dd36a,#f3ce4e,#ed4a55)}.msg{left:50%;top:55px;transform:translateX(-50%);font-size:22px;font-weight:1000;text-shadow:0 3px 10px #000}.blind{inset:0;background:#000;z-index:90;opacity:0;pointer-events:none;transition:opacity .22s}.blind.on{opacity:1}.mansion{inset:0;z-index:80;display:grid;place-items:center;background:radial-gradient(circle,#351320,#030406 70%)}.mansion .panel{max-width:520px}.rotate{display:none;inset:0;z-index:120;background:#020304;place-items:center;text-align:center;font-size:24px;font-weight:900}@media(orientation:portrait){.rotate{display:grid}}
</style></head><body><div id="game"></div><div id="rotate" class="ui rotate">📱↻<br>Telefonu yatay çevir</div><div id="home" class="ui home"><div class="panel"><div class="logo">NIGHT COURT<b>POSSESSED</b></div><p>3D korku basketbolu</p><button id="play" class="primary">MAÇA BAŞLA</button></div></div><div id="hud" class="ui hud hide"><div class="pill">MAVİ <span id="blue">0</span></div><div class="pill"><span id="clock">5:00</span></div><div class="pill">KIRMIZI <span id="red">0</span></div></div><div id="msg" class="ui msg"></div><div id="joy" class="ui joy hide"><div id="stick" class="stick"></div></div><div id="actions" class="ui actions hide"><button id="pass">PAS</button><button id="steal">ÇAL</button><button id="dribble" class="dribble">ÇALIM</button><button id="sprint">SPRINT</button><button id="shoot" class="shoot">ŞUT</button></div><div id="power" class="ui power hide"><i id="powerFill"></i></div><div id="blind" class="ui blind"></div><div id="mansion" class="ui mansion hide"><div class="panel"><h1>LANETLİ MALİKÂNE</h1><p>Canavar seni kaçırdı. Portalı bul ve maça geri dön.</p><button id="portal" class="primary">PORTALDAN ÇIK</button></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
const $=s=>document.querySelector(s);let scene,camera,renderer,clock,run=false;let players=[],fans=[],ball,holder,controlled,monster=null;let move={x:0,y:0},sprint=false,charging=false,charge=0,blue=0,red=0,timeLeft=300,lastTouch='blue',ballVel=null,shot=null,inboundLock=false;const COURT={L:28,W:15,HOOP:12.75};
function mat(c,r=.62,m=.02){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m})}function M(g,m){const x=new THREE.Mesh(g,m);x.castShadow=x.receiveShadow=true;return x}function box(w,h,d,c){return M(new THREE.BoxGeometry(w,h,d),mat(c))}
function human(color=0x2d7be8,skin=0xc89572,fan=false){const g=new THREE.Group();const torso=box(fan?.34:.42,fan?.65:.82,fan?.24:.30,color);torso.position.y=fan?1.05:1.2;g.add(torso);const head=M(new THREE.SphereGeometry(fan?.18:.23,12,10),mat(skin));head.position.y=fan?1.52:1.78;g.add(head);const limbs=[];for(const sx of[-1,1]){const arm=box(fan?.10:.12,fan?.55:.68,fan?.10:.12,skin);arm.position.set(sx*(fan?.27:.34),fan?.98:1.18,0);arm.rotation.z=sx*.08;g.add(arm);limbs.push(arm);const leg=box(fan?.11:.14,fan?.60:.78,fan?.12:.15,fan?0x30343d:0x1d2430);leg.position.set(sx*(fan?.11:.14),fan?.43:.42,0);g.add(leg);limbs.push(leg)}g.userData.limbs=limbs;return g}
function addLine(points){const g=new THREE.BufferGeometry().setFromPoints(points.map(p=>new THREE.Vector3(p[0],.02,p[1])));scene.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:0xffffff})))}function addArc(cx,cz,r,a1,a2){const p=[];for(let i=0;i<=64;i++){const a=a1+(a2-a1)*i/64;p.push([cx+Math.cos(a)*r,cz+Math.sin(a)*r])}addLine(p)}
function hoop(side){const rimX=side*COURT.HOOP,boardX=side*13.28,postX=side*14.18;const post=box(.20,3.35,.20,0x555b64);post.position.set(postX,1.675,0);scene.add(post);const armLen=Math.abs(postX-boardX);const arm=box(armLen,.12,.12,0x555b64);arm.position.set((postX+boardX)/2,3.35,0);scene.add(arm);const board=M(new THREE.BoxGeometry(.10,1.05,1.80),new THREE.MeshPhysicalMaterial({color:0xffffff,transparent:true,opacity:.62,roughness:.08}));board.position.set(boardX,3.45,0);scene.add(board);const target=box(.025,.45,.60,0xffffff);target.position.set(boardX-side*.06,3.35,0);scene.add(target);const rim=M(new THREE.TorusGeometry(.45,.045,12,36),new THREE.MeshStandardMaterial({color:0xff6518,metalness:.5,roughness:.3}));rim.rotation.y=Math.PI/2;rim.position.set(rimX,3.05,0);scene.add(rim);for(let i=0;i<12;i++){const a=i*Math.PI*2/12,z=Math.cos(a)*.45,y=3.01+Math.sin(a)*.015;const geo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(rimX,y,z),new THREE.Vector3(rimX+side*.04,2.48,z*.52)]);scene.add(new THREE.Line(geo,new THREE.LineBasicMaterial({color:0xf3f3f3})))}const bottom=new THREE.RingGeometry(.20,.24,20);const bm=new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide,transparent:true,opacity:.55});const netBottom=new THREE.Mesh(bottom,bm);netBottom.rotation.y=Math.PI/2;netBottom.position.set(rimX+side*.04,2.48,0);scene.add(netBottom)}
function standsAndFans(){const colors=[0x2c7be5,0xe43a49,0xe6b13a,0x7e52c7,0x35a36a,0xdddddd];for(const side of[-1,1])for(let row=0;row<5;row++)for(let i=-9;i<=9;i++){const seat=box(.72,.38,.72,row%2?0x424b58:0x333b46);seat.position.set(i*1.35,.32+row*.42,side*(COURT.W/2+1.4+row*.72));scene.add(seat);if(i%2===0||row<4){const f=human(colors[(i+row+20)%colors.length],0xc89572,true);f.position.set(seat.position.x,seat.position.y+.25,seat.position.z);f.rotation.y=side<0?0:Math.PI;scene.add(f);fans.push(f)}}for(const side of[-1,1])for(let row=0;row<4;row++)for(let i=-4;i<=4;i++){const seat=box(.72,.38,.72,0x3d4652);seat.position.set(side*(COURT.L/2+1.35+row*.72),.32+row*.42,i*1.38);scene.add(seat);if(i%2===0||row<2){const f=human(colors[(i+row+12)%colors.length],0xb98362,true);f.position.copy(seat.position).add(new THREE.Vector3(0,.25,0));f.rotation.y=side<0?Math.PI/2:-Math.PI/2;scene.add(f);fans.push(f)}}}
function court3D(){const floor=box(COURT.L,.18,COURT.W,0xc99b68);floor.position.y=-.09;scene.add(floor);for(let x=-13.5;x<14;x+=.7){const strip=box(.64,.012,COURT.W-.12,(Math.round(x*10)%2)?0xc49462:0xd1a373);strip.position.set(x,.005,0);scene.add(strip)}addLine([[-14,-7.5],[14,-7.5],[14,7.5],[-14,7.5],[-14,-7.5]]);addLine([[0,-7.5],[0,7.5]]);addArc(0,0,1.8,0,Math.PI*2);for(const side of[-1,1]){const bx=side*10.8;addLine([[bx,-2.45],[side*14,-2.45],[side*14,2.45],[bx,2.45],[bx,-2.45]]);addArc(bx,0,1.8,-Math.PI/2,Math.PI/2);addArc(side*12.6,0,6.75,side>0?Math.PI/2:-Math.PI/2,side>0?Math.PI*1.5:Math.PI/2);hoop(side)}standsAndFans();const roof=box(38,.28,25,0x1c2027);roof.position.y=10;scene.add(roof);for(let x of[-9,0,9])for(let z of[-5,0,5]){const l=new THREE.PointLight(0xffffff,2.4,26);l.position.set(x,8.2,z);scene.add(l)}for(const z of[-9,9]){const wall=box(38,7,.2,0x1b2028);wall.position.set(0,3.5,z);scene.add(wall)}}
function makePlayer(team,i){const g=human(team==='blue'?0x267bea:0xe43c49,team==='blue'?0xc99570:0xb97b58,false);g.userData={team,i,has:false,slot:null};scene.add(g);players.push(g);return g}
function init(){if(!window.THREE)throw new Error('3D motoru henüz hazır değil');ballVel=new THREE.Vector3();scene=new THREE.Scene();scene.background=new THREE.Color(0x10131a);camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,120);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;$('#game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xdde8ff,0x241d1b,1.4));const sun=new THREE.DirectionalLight(0xffffff,1.8);sun.position.set(0,15,8);scene.add(sun);court3D();for(let i=0;i<5;i++){const p=makePlayer('blue',i);p.position.set(-6+i*.9,0,[-4,-2,0,2,4][i])}for(let i=0;i<5;i++){const p=makePlayer('red',i);p.position.set(6-i*.9,0,[-4,-2,0,2,4][i])}ball=M(new THREE.SphereGeometry(.24,20,16),new THREE.MeshStandardMaterial({color:0xe56d18,roughness:.7}));scene.add(ball);holder=players[0];holder.userData.has=true;controlled=holder;clock=new THREE.Clock();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});loop()}
function start(){const btn=$('#play');btn.disabled=true;btn.textContent='YÜKLENİYOR...';const go=()=>{try{if(!window.THREE){setTimeout(go,120);return}if(!scene)init();run=true;timeLeft=300;blue=red=0;$('#home').classList.add('hide');['#hud','#joy','#actions','#power'].forEach(s=>$(s).classList.remove('hide'));clock.getDelta();setTimeout(()=>{if(run&&!monster)spawnMonster()},9000);btn.disabled=false;btn.textContent='MAÇA BAŞLA'}catch(e){btn.disabled=false;btn.textContent='TEKRAR DENE';$('#msg').textContent='Başlatma hatası: '+e.message}};go()}
function shootBall(pw){if(!holder||holder.userData.team!=='blue')return;const shooter=holder;const rim=new THREE.Vector3(COURT.HOOP,3.05,0);const startP=shooter.position.clone().add(new THREE.Vector3(0,1.7,0));const dist=shooter.position.distanceTo(new THREE.Vector3(COURT.HOOP,0,0));const ideal=THREE.MathUtils.clamp(dist/18,.35,.9);const error=Math.abs(pw-ideal);const lateral=(Math.random()-.5)*(0.65+error*3.8);const depth=(Math.random()-.5)*(0.50+error*3.2);rim.z+=lateral;rim.x+=depth;const T=.8+dist/20;const d=rim.clone().sub(startP);ball.position.copy(startP);ballVel.set(d.x/T,(d.y+4.9*T*T)/T,d.z/T);shot={team:'blue',three:dist>6.75,scored:false};shooter.userData.has=false;holder=null;lastTouch='blue'}
function aiShoot(p){const rim=new THREE.Vector3(-COURT.HOOP,3.05,(Math.random()-.5)*.35),startP=p.position.clone().add(new THREE.Vector3(0,1.7,0)),dist=p.position.distanceTo(new THREE.Vector3(-COURT.HOOP,0,0)),T=.8+dist/20,d=rim.sub(startP);ball.position.copy(startP);ballVel.set(d.x/T,(d.y+4.9*T*T)/T,d.z/T);p.userData.has=false;holder=null;lastTouch='red';shot={team:'red',three:dist>6.75,scored:false}}
function spawnMonster(){if(monster)scene.remove(monster);monster=human(0x2b0710,0x3b0810,false);monster.scale.set(1.35,1.35,1.35);monster.position.set(-13,0,(Math.random()-.5)*8);scene.add(monster);$('#msg').textContent='CANAVAR GELİYOR!';setTimeout(()=>$('#msg').textContent='',900)}function caught(){run=false;$('#blind').classList.add('on');setTimeout(()=>{$('#mansion').classList.remove('hide');$('#blind').classList.remove('on')},900)}$('#portal').onclick=()=>{$('#mansion').classList.add('hide');$('#blind').classList.remove('on');if(monster){scene.remove(monster);monster=null}run=true}
function score(team,pts){if(team==='blue')blue+=pts;else red+=pts;spawnMonster();setTimeout(()=>inbound(team==='blue'?'red':'blue'),700)}function inbound(team){inboundLock=true;players.forEach(p=>p.userData.has=false);const p=players.find(x=>x.userData.team===team);p.position.set(team==='blue'?-13.1:13.1,0,0);holder=p;p.userData.has=true;if(team==='blue')controlled=p;ballVel.set(0,0,0);shot=null;$('#msg').textContent='TAÇ - '+(team==='blue'?'MAVİ':'KIRMIZI');setTimeout(()=>{$('#msg').textContent='';inboundLock=false},700)}
function separate(){for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++){const a=players[i],b=players[j],d=b.position.clone().sub(a.position);d.y=0;const L=d.length();if(L>0&&L<.82){d.normalize().multiplyScalar((.82-L)*.5);a.position.addScaledVector(d,-1);b.position.add(d)}}}
function ai(dt){const blueSlots=[[-7,-4],[-5,-2],[-3,0],[-5,2],[-7,4]],redSlots=[[7,-4],[5,-2],[3,0],[5,2],[7,4]];for(const p of players){if(p===controlled)continue;let target;const slots=p.userData.team==='blue'?blueSlots:redSlots;if(holder===p){target=new THREE.Vector3(p.userData.team==='red'?-COURT.HOOP+2.2:COURT.HOOP-2.2,0,THREE.MathUtils.clamp(p.position.z,-3.4,3.4))}else{target=new THREE.Vector3(slots[p.userData.i][0],0,slots[p.userData.i][1]);if(holder&&holder.userData.team===p.userData.team){target.x+=(p.userData.team==='blue'?1:-1)*2.0}else if(holder){const opp=players.filter(q=>q.userData.team!==p.userData.team)[p.userData.i]||holder;target.copy(opp.position);target.x+=(p.userData.team==='blue'?-1:1)*1.0}}const d=target.sub(p.position);d.y=0;if(d.length()>.22){d.normalize();p.position.addScaledVector(d,dt*4.1);p.rotation.y=Math.atan2(d.x,d.z)}}if(holder&&holder.userData.team==='red'){const dist=holder.position.distanceTo(new THREE.Vector3(-COURT.HOOP,0,0));if(dist<8.4&&Math.random()<dt*1.15)aiShoot(holder);else if(Math.random()<dt*.22){const mates=players.filter(q=>q.userData.team==='red'&&q!==holder);const t=mates.sort((a,b)=>a.position.distanceTo(new THREE.Vector3(-COURT.HOOP,0,0))-b.position.distanceTo(new THREE.Vector3(-COURT.HOOP,0,0)))[0];if(t){ball.position.copy(holder.position).add(new THREE.Vector3(0,1.1,0));ballVel.copy(t.position.clone().sub(ball.position).setY(.4).normalize().multiplyScalar(9.5));holder.userData.has=false;holder=null;lastTouch='red';shot=null}}}}
function physics(dt){if(holder){const t=performance.now()/120;ball.position.set(holder.position.x,.28+Math.abs(Math.sin(t))*1.05,holder.position.z+.38);return}ballVel.y-=9.8*dt;ball.position.addScaledVector(ballVel,dt);if(ball.position.y<.24){ball.position.y=.24;ballVel.y=Math.abs(ballVel.y)>.8?-ballVel.y*.55:0;ballVel.x*=.95;ballVel.z*=.95}if(shot&&!shot.scored){const tx=shot.team==='blue'?COURT.HOOP:-COURT.HOOP;if(Math.abs(ball.position.x-tx)<.24&&Math.abs(ball.position.z)<.28&&ball.position.y>2.82&&ball.position.y<3.22&&ballVel.y<0){shot.scored=true;score(shot.team,shot.three?3:2)}}for(const p of players){if(ball.position.y<1.5&&ball.position.distanceTo(p.position)<.62){holder=p;p.userData.has=true;if(p.userData.team==='blue')controlled=p;ballVel.set(0,0,0);shot=null;lastTouch=p.userData.team;break}}if(!inboundLock&&(Math.abs(ball.position.x)>COURT.L/2+.15||Math.abs(ball.position.z)>COURT.W/2+.15)){inbound(lastTouch==='blue'?'red':'blue')}}
function update(dt){timeLeft=Math.max(0,timeLeft-dt);$('#clock').textContent=Math.floor(timeLeft/60)+':'+Math.floor(timeLeft%60).toString().padStart(2,'0');$('#blue').textContent=blue;$('#red').textContent=red;if(controlled){let dx=move.x,dz=move.y,L=Math.hypot(dx,dz);if(L>.05){if(L>1){dx/=L;dz/=L}const d=new THREE.Vector3(dx,0,dz);controlled.position.addScaledVector(d,(sprint?6:4.1)*dt);controlled.rotation.y=Math.atan2(dx,dz)}if(holder===controlled){const near=players.filter(p=>p.userData.team==='red').sort((a,b)=>a.position.distanceTo(controlled.position)-b.position.distanceTo(controlled.position))[0];if(near&&near.position.distanceTo(controlled.position)<.95&&Math.random()<dt*.55){controlled.userData.has=false;holder=near;near.userData.has=true;lastTouch='red';shot=null;$('#msg').textContent='RAKİP TOPU ÇALDI!';setTimeout(()=>$('#msg').textContent='',500)}}}ai(dt);separate();physics(dt);if(monster&&controlled){const d=controlled.position.clone().sub(monster.position);d.y=0;if(d.length()>.05){d.normalize();monster.position.addScaledVector(d,dt*7.5);monster.rotation.y=Math.atan2(d.x,d.z)}if(monster.position.distanceTo(controlled.position)<.8)caught()}fans.forEach((f,i)=>{f.rotation.z=Math.sin(performance.now()/400+i)*.015});camera.position.lerp(new THREE.Vector3(controlled?controlled.position.x:0,7.5,(controlled?controlled.position.z:0)+9.5),.08);camera.lookAt(controlled?controlled.position.x:0,.8,controlled?controlled.position.z-1:0)}function loop(){requestAnimationFrame(loop);if(!scene)return;const dt=Math.min(clock.getDelta(),.035);if(run)update(dt);renderer.render(scene,camera)}
let active=false;function jm(x,y){const r=$('#joy').getBoundingClientRect(),m=36;let dx=x-r.left-r.width/2,dy=y-r.top-r.height/2,d=Math.hypot(dx,dy)||1;if(d>m){dx=dx/d*m;dy=dy/d*m}move.x=dx/m;move.y=dy/m;$('#stick').style.transform=`translate(${dx}px,${dy}px)`}$('#joy').addEventListener('pointerdown',e=>{active=true;$('#joy').setPointerCapture?.(e.pointerId);jm(e.clientX,e.clientY)});$('#joy').addEventListener('pointermove',e=>active&&jm(e.clientX,e.clientY));$('#joy').addEventListener('pointerup',()=>{active=false;move.x=move.y=0;$('#stick').style.transform='none'});$('#sprint').onpointerdown=()=>sprint=true;$('#sprint').onpointerup=$('#sprint').onpointercancel=()=>sprint=false;$('#pass').onclick=()=>{if(!holder||holder.userData.team!=='blue')return;const mates=players.filter(p=>p.userData.team==='blue'&&p!==holder);const target=mates.sort((a,b)=>b.position.x-a.position.x)[0];if(!target)return;ball.position.copy(holder.position).add(new THREE.Vector3(0,1.1,0));ballVel.copy(target.position.clone().sub(ball.position).setY(.35).normalize().multiplyScalar(10));holder.userData.has=false;holder=null;lastTouch='blue';shot=null};$('#steal').onclick=()=>{if(!controlled)return;const opp=players.filter(p=>p.userData.team==='red').sort((a,b)=>a.position.distanceTo(controlled.position)-b.position.distanceTo(controlled.position))[0];if(opp&&holder===opp&&opp.position.distanceTo(controlled.position)<1.25){opp.userData.has=false;holder=controlled;controlled.userData.has=true;ballVel.set(0,0,0);shot=null;lastTouch='blue';$('#msg').textContent='TOPU ÇALDIN!';setTimeout(()=>$('#msg').textContent='',500)}else{$('#msg').textContent='Çalmak için yaklaş';setTimeout(()=>$('#msg').textContent='',450)}};$('#dribble').onclick=()=>{if(controlled){const f=new THREE.Vector3(Math.sin(controlled.rotation.y),0,Math.cos(controlled.rotation.y));controlled.position.addScaledVector(f,1.15)}};$('#shoot').onpointerdown=e=>{e.preventDefault();if(holder&&holder.userData.team==='blue'){charging=true;charge=0}};$('#shoot').onpointerup=e=>{e.preventDefault();if(charging){charging=false;shootBall(Math.max(.08,charge));charge=0;$('#powerFill').style.width='0%'}};setInterval(()=>{if(charging){charge+=.025;if(charge>1)charge=.2;$('#powerFill').style.width=(charge*100)+'%'}},30);$('#play').addEventListener('pointerup',e=>{e.preventDefault();start()});$('#play').addEventListener('click',e=>{e.preventDefault();start()});
</script></body></html>
