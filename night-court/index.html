ft:50%;top:54px;transform:translateX(-50%);font-size:19px;font-weight:1000;text-shadow:0 3px 10px #000;white-space:nowrap}.blind{inset:0;background:#000;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}.blind.on{opacity:1}.mansionHud{top:10px;left:50%;transform:translateX(-50%);padding:9px 14px;border-radius:12px;background:#07070bdc;border:1px solid #ffffff22;font-weight:900}.danger{top:48px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:900;color:#ff6378;text-shadow:0 2px 8px #000}.rotate{display:none;inset:0;z-index:120;background:#020304;place-items:center;text-align:center;font-size:24px;font-weight:900}@media(orientation:portrait){.rotate{display:grid}}</style></head><body><div id="game"></div><div id="rotate" class="ui rotate">📱↻<br>Telefonu yatay çevir</div><div id="home" class="ui home"><div class="panel"><div class="logo">NIGHT COURT<b>POSSESSED</b></div><p>3D korku basketbolu</p><button id="play" class="primary">MAÇA BAŞLA</button></div></div><div id="hud" class="ui hud hide"><div class="pill">MAVİ <span id="blue">0</span></div><div class="pill"><span id="clock">5:00</span></div><div class="pill">KIRMIZI <span id="red">0</span></div></div><div id="msg" class="ui msg"></div><div id="mansionHud" class="ui mansionHud hide">MALİKÂNE: <span id="questText">Anahtarı bul</span></div><div id="danger" class="ui danger hide">CANAVAR MALİKÂNEDE!</div><div id="joy" class="ui joy hide"><div id="stick" class="stick"></div></div><div id="actions" class="ui actions hide"><button id="pass">PAS</button><button id="steal">ÇAL</button><button id="dribble" class="dribble">ÇALIM</button><button id="sprint">SPRINT</button><button id="shoot" class="shoot">ŞUT</button></div><div id="power" class="ui power hide"><i id="powerFill"></i></div><div id="blind" class="ui blind"></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>const $=s=>document.querySelector(s);let scene,camera,renderer,clock,run=false,players=[],ball,holder,controlled,monster=null,ballVel,shot=null,move={x:0,y:0},sprint=false,charging=false,charge=0,blue=0,red=0,timeLeft=300,lastTouch='blue',inboundLock=false,inMansion=false,mansionGroup=null,mansionMonster=null,portal=null,questStep=0,questObjects=[],mansionYaw=0,mansionCatchCd=0;const COURT={L:28,W:15,HOOP:12.65};function mat(c,r=.62,m=.02){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m})}function M(g,m){const x=new THREE.Mesh(g,m);x.castShadow=x.receiveShadow=true;return x}function box(w,h,d,c){return M(new THREE.BoxGeometry(w,h,d),mat(c))}function human(color,skin=0xc89572,scale=1){const g=new THREE.Group(),torso=box(.42,.82,.30,color);torso.position.y=1.2;g.add(torso);const head=M(new THREE.SphereGeometry(.23,12,10),mat(skin));head.position.y=1.78;g.add(head);for(const sx of[-1,1]){const arm=box(.12,.68,.12,skin);arm.position.set(sx*.34,1.18,0);g.add(arm);const leg=box(.14,.78,.15,0x222832);leg.position.set(sx*.14,.42,0);g.add(leg)}g.scale.setScalar(scale);return g}function floorLine(points){const g=new THREE.BufferGeometry().setFromPoints(points.map(p=>new THREE.Vector3(p[0],.025,p[1])));scene.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:0xffffff})))}function arc(cx,cz,r,a1,a2){const p=[];for(let i=0;i<=64;i++){const a=a1+(a2-a1)*i/64;p.push([cx+Math.cos(a)*r,cz+Math.sin(a)*r])}floorLine(p)}function hoop(side){const rimX=side*COURT.HOOP,boardX=side*13.15,postX=side*14.45;const post=box(.16,3.05,.16,0x60666f);post.position.set(postX,1.525,0);scene.add(post);const arm=box(Math.abs(postX-boardX),.1,.1,0x60666f);arm.position.set((postX+boardX)/2,3.08,0);scene.add(arm);const board=M(new THREE.BoxGeometry(.08,1.05,1.8),new THREE.MeshPhysicalMaterial({color:0xffffff,transparent:true,opacity:.72}));board.position.set(boardX,3.45,0);scene.add(board);const rim=M(new THREE.TorusGeometry(.45,.035,10,32),mat(0xff671c));rim.rotation.y=Math.PI/2;rim.position.set(rimX,3.05,0);scene.add(rim)}function court(){const floor=box(CO rget;if(holder===p){const x=p.userData.team==='blue'?10.5:-10.5;target=new THREE.Vector3(x,0,THREE.MathUtils.clamp(p.position.z,-3,3))}else if(holder&&holder.userData.team===p.userData.team){const s=p.userData.team==='blue'?1:-1;const cut=(p.userData.i===1||p.userData.i===3)&&Math.sin(performance.now()/700+p.userData.i)>0;target=cut?new THREE.Vector3(s*9,0,(p.userData.i-2)*1.5):new THREE.Vector3(s*(3+p.userData.i*.5),0,(p.userData.i-2)*2)}else if(holder){const mark=players.filter(q=>q.userData.team!==p.userData.team)[p.userData.i]||holder;target=mark.position.clone();target.x+=(p.userData.team==='blue'?-1:1)}else target=new THREE.Vector3(p.userData.team==='blue'?-3:3,0,(p.userData.i-2)*2);const d=target.sub(p.position);d.y=0;if(d.length()>.25){d.normalize();p.position.addScaledVector(d,dt*(holder===p?4.4:4));p.rotation.y=Math.atan2(d.x,d.z);clampCourt(p)}}if(holder&&holder.userData.team==='red'&&holder.position.distanceTo(new THREE.Vector3(-COURT.HOOP,0,0))<7.8&&Math.random()<dt*1.1)shoot('red',holder)}function physics(dt){if(holder){const t=performance.now()/120;ball.position.set(holder.position.x,.3+Math.abs(Math.sin(t))*1.02,holder.position.z+.38);return}ballVel.y-=9.8*dt;ball.position.addScaledVector(ballVel,dt);if(ball.position.y<.24){ball.position.y=.24;ballVel.y=Math.abs(ballVel.y)>.8?-ballVel.y*.52:0;ballVel.x*=.97;ballVel.z*=.97}if(!inboundLock&&(Math.abs(ball.position.x)>14.2||Math.abs(ball.position.z)>7.7)){throwIn();return}if(shot&&!shot.scored){const tx=shot.team==='blue'?COURT.HOOP:-COURT.HOOP;if(Math.abs(ball.position.x-tx)<.24&&Math.abs(ball.position.z)<.3&&ball.position.y>2.82&&ball.position.y<3.22&&ballVel.y<0){shot.scored=true;score(shot.team,shot.three?3:2)}}for(const p of players)if(ball.position.y<1.5&&ball.position.distanceTo(p.position)<.62){holder=p;p.userData.has=true;if(p.userData.team==='blue')controlled=p;ballVel.set(0,0,0);shot=null;lastTouch=p.userData.team;break}}function buildMansion(){mansionGroup=new THREE.Group();scene.add(mansion assList.add('hide');$('#actions').classList.remove('hide');$('#power').classList.remove('hide');setTimeout(()=>run=true,250)}function update(dt){if(inMansion){mansionUpdate(dt);return}timeLeft=Math.max(0,timeLeft-dt);$('#clock').textContent=Math.floor(timeLeft/60)+':'+Math.floor(timeLeft%60).toString().padStart(2,'0');$('#blue').textContent=blue;$('#red').textContent=red;if(controlled){let dx=move.x,dz=move.y,L=Math.hypot(dx,dz);if(L>.05){if(L>1){dx/=L;dz/=L}const d=new THREE.Vector3(dx,0,dz);controlled.position.addScaledVector(d,(sprint?5.5:4.4)*dt);controlled.rotation.y=Math.atan2(dx,dz);clampCourt(controlled)}}ai(dt);physics(dt);if(monster&&controlled){const d=controlled.position.clone().sub(monster.position);d.y=0;if(d.length()>.05){d.normalize();monster.position.addScaledVector(d,dt*7.1)}if(monster.position.distanceTo(controlled.position)<.8)enterMansion()}camera.position.lerp(new THREE.Vector3(controlled.position.x,7.1,controlled.position.z+9),.08);camera.lookAt(controlled.position.x,.8,controlled.position.z-1)}function loop(){requestAnimationFrame(loop);if(!scene)return;const dt=Math.min(clock.getDelta(),.035);if(run)update(dt);renderer.render(scene,camera)}let active=false;function jm(x,y){const r=$('#joy').getBoundingClientRect(),m=36;let dx=x-r.left-r.width/2,dy=y-r.top-r.height/2,d=Math.hypot(dx,dy)||1;if(d>m){dx=dx/d*m;dy=dy/d*m}move.x=dx/m;move.y=dy/m;$('#stick').style.transform=`translate(${dx}px,${dy}px)`}$('#joy').onpointerdown=e=>{active=true;jm(e.clientX,e.clientY)};$('#joy').onpointermove=e=>active&&jm(e.clientX,e.clientY);$('#joy').onpointerup=()=>{active=false;move.x=move.y=0;$('#stick').style.transform='none'};$('#sprint').onpointerdown=()=>sprint=true;$('#sprint').onpointerup=$('#sprint').onpointercancel=()=>sprint=false;$('#steal').onclick=()=>{};$('#pass').onclick=()=>{};$('#dribble').onclick=()=>{};$('#shoot').onpointerdown=e=>{e.preventDefault();if(holder&&holder.userData.team==='blue'){charging=true;charge=0}};$('#shoot').onpointerup=e=>{
