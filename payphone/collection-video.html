<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Telefon Müzesi</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#bfe8f8}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="app" src="collection.html" allow="microphone; camera; autoplay"></iframe><script>const f=document.getElementById('app');f.addEventListener('load',()=>{try{const d=f.contentDocument;if(!d||d.getElementById('videoCallScript'))return;const s=d.createElement('script');s.id='videoCallScript';s.src='video-call.js';d.body.appendChild(s)}catch(e){console.error(e)}});</script></body></html>
