<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Telefon Müzesi</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial,sans-serif;background:#a9d8ef;color:#173242}button,input,textarea{font:inherit}button{border:0;border-radius:12px;padding:10px 12px;font-weight:800;background:#263847;color:#fff}.gold,.active{background:#e3ad35!important;color:#19130a!important}.museum{min-height:100vh;padding-bottom:210px;background:linear-gradient(#c9efff,#91cce5)}.top{text-align:center;padding:8px}.top h1{margin:2px}.wall{max-width:900px;margin:auto;padding:2px 10px 20px}.shelf{position:relative;min-height:190px;display:flex;align-items:flex-end;justify-content:center;gap:12px;padding:12px 8px 25px;margin:4px auto 18px}.shelf:after{content:'';position:absolute;left:0;right:0;bottom:0;height:24px;border-radius:6px;background:linear-gradient(#a96f36,#74451f);box-shadow:0 8px 10px #3455}.phoneCard{width:30%;max-width:155px;min-width:92px;height:155px;display:flex;align-items:flex-end;justify-content:center;position:relative;z-index:2;cursor:pointer;transition:.2s}.phoneCard.selected{transform:translateY(-8px) scale(1.08);filter:drop-shadow(0 10px 8px #3455)}.deviceWrap{text-align:center}.phone{position:relative;margin:auto;background:#2c3238;border:3px solid #15191c;box-shadow:inset 0 0 0 2px #505a62;border-radius:14px;width:76px;height:132px}.screen{position:absolute;left:9px;right:9px;top:14px;height:40px;background:#a8bb8c;border:2px solid #11191c;border-radius:4px}.keys{position:absolute;left:10px;right:10px;top:62px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.keys i{height:11px;background:#68727b;border-radius:3px}.brick{width:84px;height:145px;border-radius:7px}.brick:before{content:'';position:absolute;width:8px;height:38px;right:8px;top:-35px;background:#24282b;border-radius:5px}.flip{height:76px;margin-bottom:50px}.flip:before{content:'';position:absolute;left:-3px;top:-68px;width:76px;height:65px;background:#3b444c;border:3px solid #171a1d;border-radius:13px 13px 5px 5px}.slider:before{content:'';position:absolute;left:6px;top:-28px;width:58px;height:84px;background:#46515b;border-radius:10px;border:2px solid #222}.qwerty{width:105px;height:112px}.qwerty .keys{grid-template-columns:repeat(6,1fr);top:62px}.touch{width:78px;height:138px;border-radius:20px}.touch .screen{inset:6px;height:auto;background:linear-gradient(155deg,#18354a,#4a8098);border-radius:13px}.touch .keys,.fold .keys,.rotary .keys{display:none}.fold{width:86px;height:138px;border-radius:15px}.fold:after{content:'';position:absolute;top:3px;bottom:3px;left:50%;width:1px;background:#fff6}.rotary{width:125px;height:76px;border-radius:17px;margin-bottom:16px}.rotary .screen{display:none}.rotary:before{content:'☎';font-size:44px;position:absolute;left:39px;top:-38px}.rotary:after{content:'◉';font-size:39px;position:absolute;left:43px;top:23px;color:#b9aa91}.label{font-size:10px;font-weight:900;margin-top:6px;max-width:140px}.controls{position:fixed;z-index:20;left:50%;bottom:6px;transform:translateX(-50%);width:min(690px,96vw);background:#f8fbfdef;border:1px solid #fff;border-radius:20px;padding:8px;box-shadow:0 12px 30px #3455}.controls h2,.controls p{margin:2px;text-align:center}.row{display:flex;gap:6px;align-items:center;justify-content:center;overflow-x:auto}.years,.models{justify-content:flex-start;padding:3px 0}.years button{min-width:60px}.models button{min-width:118px;font-size:11px}.stage{position:fixed;inset:0;z-index:40;background:linear-gradient(#c9efff,#91cce5);padding:14px;overflow:auto;text-align:center}.hide{display:none!important}.panel{max-width:440px;margin:10px auto;background:#fff;border-radius:18px;padding:14px;box-shadow:0 8px 24px #3453}.display{background:#a8bb8c;color:#152015;border:5px solid #263238;border-radius:8px;padding:12px;font:900 23px monospace;min-height:58px}.dial{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}.dial button{height:58px;font-size:20px}.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.app{min-height:80px;background:#dceaf0;color:#173242}.app span{display:block;font-size:25px}.game{background:#a8bb8c;border:5px solid #243038;width:260px;height:180px;max-width:100%}.dpad{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center}.dpad button{height:50px}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}.rotaryDial{width:245px;height:245px;border-radius:50%;margin:10px auto;position:relative;background:#2d2b27;border:15px solid #806e57}.rotaryDial button{position:absolute;width:46px;height:46px;border-radius:50%;margin:-23px;background:#e4dac5;color:#222}</style></head><body><main id="home" class="museum"><div class="top"><b>TELEFON MÜZESİ</b><h1>1970 → 2026</h1><small>Açık mavi duvar · ahşap raf · telefonların üstüne dokun</small></div><div id="wall" class="wall"></div><div class="controls"><div id="yearLabel" style="text-align:center;font-weight:900"></div><h2 id="modelName"></h2><p id="modelDesc"></p><div id="models" class="row models"></div><div id="years" class="row years"></div><div class="row"><button id="prevBtn">←</button><input id="yearSlider" type="range" min="1970" max="2026" style="flex:1"><button id="nextBtn">→</button></div><div class="row" style="flex-wrap:wrap"><button id="openPhoneBtn" class="gold">TELEFONU AÇ</button><button id="openAppsBtn" class="gold">UYGULAMALAR</button><button id="insideBtn">İÇİNİ AÇ</button><button id="updatesBtn">GÜNCELLEMELER</button></div></div></main><section id="stage" class="stage hide"></section><script>const $=id=>document.getElementById(id);const wall=$('wall'),yearsEl=$('years'),modelsEl=$('models'),yearLabel=$('yearLabel'),modelName=$('modelName'),modelDesc=$('modelDesc'),yearSlider=$('yearSlider'),home=$('home'),stage=$('stage');const brands=['RetroTel','Nokkia','Soniq','Motora','Siemax','Eriksonn','Panasonix','Alcatell','LX','Samsunq','BlackBerri','Future'],vars=['Core','Plus','Mini','Max','Music','Game','Pro','Lite'];function types(y){if(y<1984)return['rotary','rotary','brick'];if(y<1994)return['brick','bar','brick'];if(y<2001)return['bar','bar','brick'];if(y<2005)return['bar','flip','bar'];if(y<2008)return['flip','slider','bar','flip'];if(y<2010)return['qwerty','slider','touch'];if(y<2014)return['touch','qwerty','touch'];if(y<2019)return['touch','touch','bar','touch'];if(y<2022)return['touch','fold','touch','qwerty'];return['touch','fold','touch','fold','touch']}const desc={rotary:'Döner kadranlı masa telefonu',brick:'Antenli büyük mobil telefon',bar:'Klasik tuşlu cep telefonu',flip:'Kapaklı telefon',slider:'Sürgülü telefon',qwerty:'Tam klavyeli mesaj telefonu',touch:'Dokunmatik akıllı telefon',fold:'Katlanabilir akıllı telefon'};const catalog={};for(let y=1970;y<=2026;y++)catalog[y]=types(y).map((t,i)=>({type:t,name:brands[(y+i)%brands.length]+' '+vars[(y+i*2)%vars.length]+' '+String(y).slice(-2)+(i?'-'+(i+1):''),desc:desc[t]}));let year=2001,idx=0,audioCtx,raw='',gameTimer=null,gx=30,gy=80,vx=1,vy=0,score=0;const cur=()=>catalog[year][idx];function phoneHTML(m,i){const k=m.type==='touch'||m.type==='fold'||m.type==='rotary'?'':'<div class="keys">'+Array.from({length:m.type==='qwerty'?18:12},()=>'<i></i>').join('')+'</div>';return '<div class="phoneCard '+(i===idx?'selected':'')+'" data-i="'+i+'"><div class="deviceWrap"><div class="phone '+m.type+'"><div class="screen"></div>'+k+'</div><div class="label">'+m.name+'</div></div></div>'}function renderWall(){wall.innerHTML='<div class="shelf">'+catalog[year].map(phoneHTML).join('')+'</div>';wall.querySelectorAll('.phoneCard').forEach(el=>el.onclick=()=>selectModel(+el.dataset.i))}function renderYears(){yearsEl.innerHTML='';for(let y=1970;y<=2026;y++){const b=document.createElement('button');b.textContent=y;b.className=y===year?'active':'';b.onclick=()=>selectYear(y);yearsEl.appendChild(b)}}function renderModels(){modelsEl.innerHTML='';catalog[year].forEach((m,i)=>{const b=document.createElement('button');b.textContent=m.name;b.className=i===idx?'active':'';b.onclick=()=>selectModel(i);modelsEl.appendChild(b)})}function refresh(){yearLabel.textContent=year+' · '+catalog[year].length+' TELEFON';modelName.textContent=cur().name;modelDesc.textContent=cur().desc;yearSlider.value=year;renderWall();renderYears();renderModels()}function selectYear(y){year=y;idx=0;refresh()}function selectModel(i){idx=i;clickSound(2);refresh()}function ctx(){audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();return audioCtx}function clickSound(n=0){try{const c=ctx(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type=year<1990?'square':year<2010?'triangle':'sine';o.frequency.value=(year<1990?190:year<2010?520:760)+n*22;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.07);o.connect(g);g.connect(c.destination);o.start();o.stop(t+.08)}catch(e){}}function show(html){home.classList.add('hide');stage.classList.remove('hide');stage.innerHTML='<button id="backBtn">← RAFA DÖN</button><h2>'+cur().name+' · '+year+'</h2>'+html;$('backBtn').onclick=back}function back(){clearInterval(gameTimer);stage.classList.add('hide');home.classList.remove('hide');refresh()}function openDial(){raw='';if(cur().type==='rotary'&&year<1984){let b='';for(let i=1;i<=10;i++){let n=i===10?0:i,a=(i-1)*36-90,x=122+86*Math.cos(a*Math.PI/180),y=122+86*Math.sin(a*Math.PI/180);b+='<button style="left:'+x+'px;top:'+y+'px" data-digit="'+n+'">'+n+'</button>'}show('<div class="panel"><div id="num" class="display">NUMARA</div><div id="rot" class="rotaryDial">'+b+'</div><button id="callBtn" class="gold">☎ AHİZEYİ KALDIR</button></div>');$('rot').querySelectorAll('button').forEach(x=>x.onclick=()=>digit(x.dataset.digit));$('callBtn').onclick=call;return}show('<div class="panel"><div id="num" class="display">NUMARA</div><div id="dial" class="dial"></div><div class="row" style="margin-top:10px"><button id="delBtn">SİL</button><button id="callBtn" class="gold">☎ ARA</button></div></div>');['1','2','3','4','5','6','7','8','9','*','0','#'].forEach(k=>{let b=document.createElement('button');b.textContent=k;b.onclick=()=>digit(k);$('dial').appendChild(b)});$('delBtn').onclick=()=>{clickSound();raw=raw.slice(0,-1);$('num').textContent=raw||'NUMARA'};$('callBtn').onclick=call}function digit(k){clickSound(+k||1);if(/\d/.test(k)&&raw.length<11)raw+=k;$('num').textContent=raw||'NUMARA'}function call(){clickSound(8);if(raw.length<7){$('num').textContent='NUMARA EKSİK';return}show('<div class="panel"><div>ARANIYOR</div><h2>'+raw+'</h2><div style="font-size:90px">☎</div><button id="answerBtn" class="gold">CEVAPLA</button></div>');$('answerBtn').onclick=()=>{$('answerBtn').textContent='BAĞLANDI';clickSound(6)}}function gameName(){if(year<1990)return'Brick Paddle';if(year<2000)return'Pixel Snake';if(year<2010)return'Java Racer';if(year<2020)return'Tap Runner';return'Neon Dash'}function appList(){let a=[['☎','Telefon'],['👥','Rehber'],['🎮',gameName()],['🧮','Hesap'],['⏰','Saat']];if(year>=1995)a.splice(2,0,['✉️','Mesajlar']);if(year>=2000)a.push(['🎵','Müzik'],['📷','Kamera']);if(year>=2010)a.push(['📝','Notlar'],['🌐','Tarayıcı'],['⚙️','Ayarlar']);return a}function openApps(){show('<div id="apps" class="panel apps"></div><div id="appView" class="panel">Bir uygulamaya dokun.</div>');appList().forEach((a,i)=>{let b=document.createElement('button');b.className='app';b.innerHTML='<span>'+a[0]+'</span>'+a[1];b.onclick=()=>runApp(i);$('apps').appendChild(b)})}function runApp(i){clickSound(i);const n=appList()[i][1],v=$('appView');if(n==='Telefon'){openDial();return}if(n===gameName()){showGame();return}if(n==='Mesajlar'){v.innerHTML='<textarea id="msg" style="width:100%;height:90px"></textarea><button id="sendBtn">GÖNDER</button><div id="msgResult"></div>';$('sendBtn').onclick=()=>{$('msgResult').textContent='Gönderildi';clickSound(2)};return}if(n==='Hesap'){v.innerHTML='<input id="calc" style="width:100%;padding:10px" placeholder="2+2"><button id="eqBtn">HESAPLA</button>';$('eqBtn').onclick=()=>{try{$('calc').value=Function('return '+$('calc').value.replace(/[^0-9+\-*/.()]/g,''))()}catch(e){$('calc').value='HATA'}};return}if(n==='Saat'){v.innerHTML='<h1>'+new Date().toLocaleTimeString('tr-TR')+'</h1>';return}if(n==='Müzik'){v.innerHTML='<button id="playBtn">▶ ÇAL</button><p>'+year+' dönem tarzı özgün ton.</p>';$('playBtn').onclick=()=>clickSound(3);return}if(n==='Kamera'){v.innerHTML='<div style="height:130px;background:#345;color:white;display:grid;place-items:center">📷 '+year+'</div><button id="photoBtn">FOTOĞRAF ÇEK</button>';$('photoBtn').onclick=()=>{$('photoBtn').textContent='KAYDEDİLDİ';clickSound(4)};return}v.innerHTML='<h3>'+n+'</h3><p>Uygulama açıldı.</p>'}function showGame(){show('<div class="panel"><h3>'+gameName()+'</h3><canvas id="game" class="game" width="240" height="160"></canvas><div class="dpad"><button class="up" data-x="0" data-y="-1">▲</button><button class="left" data-x="-1" data-y="0">◀</button><button class="down" data-x="0" data-y="1">▼</button><button class="right" data-x="1" data-y="0">▶</button></div><div id="sc"></div></div>');stage.querySelectorAll('.dpad button').forEach(b=>b.onclick=()=>{vx=+b.dataset.x;vy=+b.dataset.y;clickSound(1)});startGame()}function startGame(){clearInterval(gameTimer);gx=30;gy=80;vx=1;vy=0;score=0;draw();gameTimer=setInterval(()=>{gx+=vx*7;gy+=vy*7;if(gx<0)gx=230;if(gx>230)gx=0;if(gy<0)gy=150;if(gy>150)gy=0;score++;draw()},110)}function draw(){const c=$('game');if(!c)return,x=c.getContext('2d');x.fillStyle=year<2010?'#a8bb8c':'#173242';x.fillRect(0,0,240,160);x.fillStyle=year<2010?'#172217':'#e3ad35';x.fillRect(gx,gy,14,14);$('sc').textContent='Skor: '+score}function openInside(){show('<div class="panel"><h3>İç Yapı</h3><p>🧱 Kasa</p><p>🔋 Batarya</p><p>🧠 Anakart</p><p>📡 Anten / Haberleşme</p><p>🔊 Hoparlör + Mikrofon</p><p>🖥️ Ekran ve tuş modülü</p></div>')}function openUpdates(){show('<div class="panel"><h3>Güncellemeler</h3><p><b>'+year+'</b> · İlk sürüm</p><p><b>'+(year+1)+'</b> · Menü ve pil iyileştirmeleri</p><p><b>'+(year+2)+'</b> · Son bakım sürümü</p></div>')}$('prevBtn').onclick=()=>selectYear(year===1970?2026:year-1);$('nextBtn').onclick=()=>selectYear(year===2026?1970:year+1);yearSlider.oninput=e=>selectYear(+e.target.value);$('openPhoneBtn').onclick=openDial;$('openAppsBtn').onclick=openApps;$('insideBtn').onclick=openInside;$('updatesBtn').onclick=openUpdates;refresh();</script></body></html>
