<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Telefon Müzesi</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial,sans-serif;background:#bfe8f8;color:#173242}button,input{font:inherit}button{border:0;border-radius:12px;padding:10px 12px;font-weight:800;background:#263847;color:#fff}.gold,.active{background:#e3ad35!important;color:#19130a!important}.museum{min-height:100vh;padding:8px 8px 225px;background:linear-gradient(#c9efff,#92cde6)}.top{text-align:center}.top h1{margin:3px}.wall{max-width:900px;margin:6px auto}.shelf{position:relative;min-height:230px;display:flex;align-items:flex-end;justify-content:center;gap:15px;padding:18px 8px 38px;margin:10px auto;background:#b8e4f6;border-radius:20px;overflow:visible}.shelf:after{content:'';position:absolute;left:1%;right:1%;bottom:9px;height:25px;background:linear-gradient(#b77a3d,#754720);border-radius:5px;box-shadow:0 9px 10px #3455}.phoneCard{width:22%;min-width:72px;max-width:150px;min-height:174px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;z-index:2;cursor:pointer;transition:.18s;padding-top:18px}.phoneCard.selected{transform:translateY(-8px) scale(1.06)}.device{position:relative;width:76px;height:136px;background:linear-gradient(145deg,#46505a,#20262b);border:3px solid #12171b;border-radius:15px;box-shadow:inset 0 0 0 2px #65717a,0 8px 14px #3455;overflow:visible}.device:after{content:'';position:absolute;left:9px;right:9px;bottom:6px;height:3px;border-radius:3px;background:#101519}.screen{position:absolute;left:10px;right:10px;top:13px;height:39px;background:linear-gradient(#c8d8ad,#8da078);border:2px solid #11191c;border-radius:5px;box-shadow:inset 0 2px 5px #fff6}.keys{position:absolute;left:9px;right:9px;top:62px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.keys i{height:11px;background: ground:linear-gradient(155deg,#17364c 0%,#3d7894 55%,#78aebd 100%);border-radius:16px;border:1px solid #0f1a20}.touch:before{content:'';position:absolute;top:10px;left:50%;transform:translateX(-50%);width:18px;height:3px;background:#0c1114;border-radius:4px;z-index:2}.touch:after{content:'';position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:19px;height:4px;border-radius:5px;background:#737d84}.touch .keys,.fold .keys,.rotary .keys{display:none}.fold{width:91px;height:145px;border-radius:18px;background:linear-gradient(90deg,#252c31 0 48%,#101518 49% 51%,#384149 52%);border-color:#11171a}.fold .screen{inset:6px;height:auto;border-radius:13px;background:linear-gradient(145deg,#172d42,#5289a1)}.fold:after{content:'';position:absolute;top:7px;bottom:7px;left:50%;width:1px;background:#b9c7cf66}.rotary{width:132px;height:84px;margin-bottom:30px;border-radius:19px;background:linear-gradient(#746f67,#3a3732);border-color:#2c2925}.rotary .screen{display:none}.rotary:before{content:'☎';position:absolute;left:39px;top:-42px;font-size:49px;filter:drop-shadow(0 3px 2px #0004)}.rotary:after{content:'◉';position:absolute;left:45px;top:24px;font-size:40px;color:#ded0b4;text-shadow:0 1px 0 #fff5}.payphone{width:105px;height:154px;border-radius:8px;background:linear-gradient(145deg,#87939a,#3f484e);border-color:#252b2f;box-shadow:inset 0 0 0 2px #aeb8bd,0 8px 14px #3455}.payphone .screen{left:37px;right:10px;top:18px;height:29px;background:#c5d5b1}.payphone .keys{left:39px;right:12px;top:58px;gap:3px}.payphone .keys i{height:10px;border-radius:2px;background:linear-gradient(#dadfe2,#8b969d)}.payphone:before{content:'☎';position:absolute;left:-17px;top:24px;width:42px;height:82px;font-size:37px;display:flex;align-items:center;justify-content:center;background:#31383d;border:3px solid #1a1f22;border-radius:18px;box-shadow:3px 3px 6px #0005}.payphone:after{content:'₺  KART';position:absolute;right:11px;bottom:12px;width:56px;height:21px;background:#20272b;color:#e8ec c5;color:#222}.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.app{min-height:78px;background:#dceaf0;color:#173242}.app span{display:block;font-size:25px}.game{background:#a8bb8c;border:5px solid #243038;width:260px;height:180px;max-width:100%}.dpad{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center}.dpad button{height:50px}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}@media(max-width:430px){.shelf{gap:5px;min-height:208px;padding-top:12px}.phoneCard{min-width:66px;min-height:154px;padding-top:14px}.device{transform:scale(.84);transform-origin:bottom center}.flip{margin-bottom:56px}.slider{margin-bottom:13px}.rotary{margin-bottom:24px}.payphone{transform:scale(.78);transform-origin:bottom center}.label{font-size:9px;margin-top:1px}.museum{padding-bottom:245px}}</style></head><body><main id="home" class="museum"><div class="top"><b>TELEFON MÜZESİ</b><h1>1970 → 2026</h1><small>Açık mavi duvar · ahşap raf · telefona dokun</small></div><div id="wall" class="wall"></div><div class="controls"><div id="yearLabel" style="text-align:center;font-weight:900"></div><h2 id="modelName"></h2><p id="modelDesc"></p><div id="models" class="row models"></div><div id="years" class="row years"></div><div class="row"><button id="prevBtn">←</button><input id="yearSlider" type="range" min="1970" max="2026" value="2001" style="flex:1"><button id="nextBtn">→</button></div><div class="row" style="flex-wrap:wrap"><button id="openPhoneBtn" class="gold">TELEFONU AÇ</button><button id="openAppsBtn" class="gold">UYGULAMALAR</button><button id="insideBtn">İÇİNİ AÇ</button><button id="updatesBtn">GÜNCELLEMELER</button></div></div></main><section id="stage" class="stage hide"></section><script>(()=>{const $=id=>document.getElementById(id),wall=$('wall'),yearsEl=$('years'),modelsEl=$('models'),yearLabel=$('yearLabel'),modelName=$('modelName'),modelDesc=$('modelDesc'),yearSlider=$('yearSlider'),home=$('home'),stage=$('stage');const names=['RetroTel','Nokkia','Soniq','Motora','Siemax','Eriksonn','Panasonix','Alcatell','LX','Samsunq','BlackBerri','Future'];function types(y){if(y<1984)return['rotary','payphone','brick'];if(y<1994)return['brick','bar','payphone'];if(y<2001)return['bar','brick','bar'];if(y<2005)return['bar','flip','brick','slider'];if(y<2008)return['flip','slider','bar','flip'];if(y<2010)return['qwerty','slider','touch'];if(y<2014)return['touch','qwerty','touch'];if(y<2019)return['touch','touch','bar','touch'];if(y<2022)return['touch','fold','touch','qwerty'];return['touch','fold','touch','fold','touch']}const descriptions={rotary:'Döner kadranlı masa telefonu',payphone:'Duvar tipi ankesörlü telefon',brick:'Antenli büyük mobil telefon',bar:'Klasik tuşlu cep telefonu',flip:'Kapaklı telefon',slider:'Sürgülü telefon',qwerty:'Tam klavyeli mesaj telefonu',touch:'Dokunmatik akıllı telefon',fold:'Katlanabilir akıllı telefon'};const catalog={};for(let y=1970;y<=2026;y++)catalog[y]=types(y).map((t,i)=>({type:t,name:names[(y+i)%names.length]+' '+['Core','Plus','Mini','Max','Music','Game'][i%6]+' '+String(y).slice(-2)+(i?'-'+(i+1):''),desc:descriptions[t]}));let year=2001,idx=0,audioCtx,raw='',gameTimer=null,gx=30,gy=80,vx=1,vy=0,score=0;const cur=()=>catalog[year][idx];function keyDots(t){if(['touch','fold','rotary'].includes(t))return'';let n=t==='qwerty'?18:12;return'<div class="keys">'+Array.from({length:n},()=>'<i></i>').join('')+'</div>'}function phoneHTML(m,i){return'<div class="phoneCard '+(i===idx?'selected':'')+'" data-i="'+i+'"><div class="device '+m.type+'"><div class="screen"></div>'+keyDots(m.type)+'</div><div class="label">'+m.name+'</div></div>'}function renderWall(){wall.innerHTML='<div class="shelf">'+catalog[year].map(phoneHTML).join('')+'</div>';wall.querySelectorAll('.phoneCard').forEach(el=>el.addEventListener('click',()=>selectModel(Number(el.dataset.i))))}function renderYears(){yearsEl.innerHTML='';for(let y=1970;y<=2026;y++){let b=document.createElement('button');b.textContent=y;b.className=y===year?'active':'';b.onclick=()=>selectYear(y);yearsEl.appendChild(b)}}function renderModels(){modelsEl.innerHTML='';catalog[year].forEach((m,i)=>{let b=document.createElement('button');b.textContent=m.name;b.className=i===idx?'active':'';b.onclick=()=>selectModel(i);modelsEl.appendChild(b)})}function refresh(){yearLabel.textContent=year+' · '+catalog[year].length+' TELEFON';modelName.textContent=cur().name;modelDesc.textContent=cur().desc;yearSlider.value=year;renderWall();renderYears();renderModels()}function selectYear(y){year=y;idx=0;refresh()}function selectModel(i){idx=i;sound(2);refresh()}function sound(n=0){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;o.type=year<1990?'square':year<2010?'triangle':'sine';o.frequency.value=(year<1990?190:year<2010?520:760)+n*22;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.07);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(t+.08)}catch(e){}}function show(html){home.classList.add('hide');stage.classList.remove('hide');stage.innerHTML='<button id="backBtn">← RAFA DÖN</button><h2>'+cur().name+' · '+year+'</h2>'+html;$('backBtn').onclick=back}function back(){clearInterval(gameTimer);stage.classList.add('hide');home.classList.remove('hide');refresh()}function digit(k){sound(Number(k)||1);if(/\d/.test(k)&&raw.length<11)raw+=k;$('num').textContent=raw||'NUMARA'}function call(){sound(8);if(raw.length<7){$('num').textContent='NUMARA EKSİK';return}$('num').textContent='ARANIYOR '+raw}function dialClass(){if(cur().type==='qwerty')return'qwertyDial';if(year<1990)return'era80';if(year<2000)return'era90';if(year<2010)return'era00';if(year<2020)return'era10';return'era20'}function openDial(){raw='';if(cur().type==='rotary'&&year<1984){let b='';for(let i=1;i<=10;i++){let n=i===10?0:i,a=(i-1)*36-90,x=122+86*Math.cos(a*Math.PI/180),y=122+86*Math.sin(a*Math.PI/180);b+='<button style="left:'+x+'px;top:'+y+'px" data-digit="'+n+'">'+n+'</button>'}show('<div class="panel"><div id="num" class="display">NUMARA</div><div id="rot" class="rotaryDial">'+b+'</div><button id="callBtn" class="gold">☎ AHİZEYİ KALDIR</button></div>');$('rot').querySelectorAll('button').forEach(x=>x.onclick=()=>digit(x.dataset.digit));$('callBtn').onclick=call;return}show('<div class="panel"><div id="num" class="display">NUMARA</div><div id="dial" class="dial '+dialClass()+'"></div><div class="row" style="margin-top:10px"><button id="delBtn">SİL</button><button id="callBtn" class="gold">☎ ARA</button></div></div>');['1','2','3','4','5','6','7','8','9','*','0','#'].forEach(k=>{let b=document.createElement('button');b.textContent=k;b.onclick=()=>digit(k);$('dial').appendChild(b)});$('delBtn').onclick=()=>{sound();raw=raw.slice(0,-1);$('num').textContent=raw||'NUMARA'};$('callBtn').onclick=call}function gameName(){const old=['Paddle 76','Road Dodge','Tank Dot','Maze Bit'];const n90=['Pixel Snake','Brick Fall','Pocket Goal','Space Dot'];const n00=['Java Racer','Block Stack','Street Kick','Orb Catch'];const n10=['Tap Runner','Sky Hop','Lane Rush','Color Dash'];const n20=['Neon Dash','Cube Drift','Pulse Jump','Rocket Tap'];const a=year<1990?old:year<2000?n90:year<2010?n00:year<2020?n10:n20;return a[(year+idx)%a.length]}function apps(){let a=[['☎','Telefon'],['👥','Rehber'],['🎮',gameName()],['🧮','Hesap'],['⏰','Saat']];if(year>=1995)a.splice(2,0,['✉️','Mesajlar']);if(year>=2000)a.push(['🎵','Müzik'],['📷','Kamera']);if(year>=2010)a.push(['📝','Notlar'],['🌐','Tarayıcı'],['⚙️','Ayarlar']);return a}function openApps(){show('<div id="apps" class="panel apps"></div><div id="appView" class="panel">Bir uygulamaya dokun.</div>');apps().forEach((a,i)=>{let b=document.createElement('button');b.className='app';b.innerHTML='<span>'+a[0]+'</span>'+a[1];b.onclick=()=>runApp(i);$('apps').appendChild(b)})}function runApp(i){sound(i);let n=apps()[i][1],v=$('appView');if(n==='Telefon'){openDial();return}if(n===gameName()){showGame();return}if(n==='Mesajlar'){v.innerHTML='<textarea style="width:100%;height:90px"></textarea><button onclick="this.textContent=\'GÖNDERİLDİ\'">GÖNDER</button>';return}if(n==='Hesap'){v.innerHTML='<input id="calc" style="width:100%;padding:10px" placeholder="2+2"><button id="calcBtn">HESAPLA</button>';$('calcBtn').onclick=()=>{try{$('calc').value=Function('return '+$('calc').value.replace(/[^0-9+\-*/.()]/g,''))()}catch(e){$('calc').value='HATA'}};return}if(n==='Saat'){v.innerHTML='<h1>'+new Date().toLocaleTimeString('tr-TR')+'</h1>';return}v.innerHTML='<h3>'+n+'</h3><p>Uygulama çalışıyor.</p>'}function showGame(){show('<div class="panel"><h3>'+gameName()+'</h3><canvas id="game" class="game" width="240" height="160"></canvas><div class="dpad"><button class="up" data-x="0" data-y="-1">▲</button><button class="left" data-x="-1" data-y="0">◀</button><button class="down" data-x="0" data-y="1">▼</button><button class="right" data-x="1" data-y="0">▶</button></div><div id="sc"></div></div>');stage.querySelectorAll('.dpad button').forEach(b=>b.onclick=()=>{vx=Number(b.dataset.x);vy=Number(b.dataset.y);sound(1)});clearInterval(gameTimer);gx=30;gy=80;vx=1;vy=0;score=0;const mode=(year+idx)%4;let ox=180,oy=50,dx=-1,dy=1;gameTimer=setInterval(()=>{let c=$('game');if(!c)return;let x=c.getContext('2d');x.fillStyle=year<2010?'#a8bb8c':'#173242';x.fillRect(0,0,240,160);if(mode===0){gx+=vx*7;gy+=vy*7;if(gx<0)gx=230;if(gx>230)gx=0;if(gy<0)gy=150;if(gy>150)gy=0;x.fillStyle=year<2010?'#172217':'#e3ad35';x.fillRect(gx,gy,14,14)}else if(mode===1){gx+=vx*6;gy+=vy*6;oy+=3;if(oy>160){oy=-15;ox=20+Math.random()*190}if(Math.abs(gx-ox)<16&&Math.abs(gy-oy)<16){score=0;oy=-15}x.fillStyle=year<2010?'#172217':'#e3ad35';x.fillRect(gx,gy,14,14);x.fillRect(ox,oy,18,18)}else if(mode===2){gx+=vx*5;gy+=vy*5;ox+=dx*4;oy+=dy*3;if(ox<8||ox>220)dx*=-1;if(oy<8||oy>140)dy*=-1;x.fillStyle=year<2010?'#172217':'#e3ad35';x.fillRect(gx,gy,14,14);x.beginPath();x.arc(ox,oy,8,0,Math.PI*2);x.fill();if(Math.abs(gx-ox)<15&&Math.abs(gy-oy)<15){score+=12;ox=Math.random()*220;oy=Math.random()*140}}else{gx+=vx*8;gy+=vy*8;let gate=40+(score%120);x.fillStyle=year<2010?'#172217':'#e3ad35';x.fillRect(gx,gy,14,14);x.fillRect(110,0,10,gate);x.fillRect(110,gate+45,10,160);if(gx>104&&gx<124&&(gy<gate||gy>gate+31)){gx=30;gy=80;score=0}}score++;$('sc').textContent='Skor: '+score},110)}$('prevBtn').onclick=()=>selectYear(year===1970?2026:year-1);$('nextBtn').onclick=()=>selectYear(year===2026?1970:year+1);yearSlider.oninput=e=>selectYear(Number(e.target.value));$('openPhoneBtn').onclick=openDial;$('openAppsBtn').onclick=openApps;$('insideBtn').onclick=()=>show('<div class="panel"><h3>İç Yapı</h3><p>🧱 Kasa</p><p>🔋 Batarya</p><p>🧠 Anakart</p><p>📡 Anten</p><p>🔊 Hoparlör + Mikrofon</p></div>');$('updatesBtn').onclick=()=>show('<div class="panel"><h3>Güncellemeler</h3><p>'+year+' · İlk sürüm</p><p>'+(year+1)+' · İyileştirme</p></div>');refresh()})();</script></body></html>
