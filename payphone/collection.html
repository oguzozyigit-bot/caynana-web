<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TELEFON ZAMAN MAKİNESİ</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10;color:#fff;font-family:Arial,sans-serif}.hide{display:none!important}#showroom{position:fixed;inset:0}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:18px;left:0;right:0;text-align:center}.era{font-size:11px;letter-spacing:3px;color:#e5b73d}.info{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(390px,92vw);background:#0b1119e8;border:1px solid #ffffff20;border-radius:20px;padding:14px;text-align:center;pointer-events:auto}.info b{font-size:19px}.info p{font-size:13px;opacity:.72}.buttons{display:flex;gap:8px;justify-content:center}.buttons button,.back,.action{border:0;border-radius:13px;padding:11px 15px;font-weight:900}.open,.action{background:#e5b73d;color:#17130a}.navBtn,.back{background:#26313e;color:#fff}.stage{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at top,#24313d,#080b10 64%);overflow:auto;padding:18px;text-align:center}.dialPanel,.music{max-width:390px;margin:12px auto;background:#0e141ce8;border:1px solid #ffffff1e;border-radius:22px;padding:16px}.number{background:#b6c89b;color:#13200e;border:7px solid #2b3239;border-radius:10px;min-height:64px;padding:12px;font:900 26px monospace}.own{font-size:12px;opacity:.68;margin:8px}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.key{height:55px;border:0;border-radius:16px;background:#45505d;color:#fff;font-size:22px;font-weight:900}.touchKeys .key{border-radius:10px;background:#202a37}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.actions button{height:48px;border:0;border-radius:12px;color:#fff;font-weight:900}.call{background:#22a85b}.del{background:#515a65}.hang{background:#bd3042}.flipPhone{width:245px;margin:12px auto;perspective:900px}.upper,.lower{background:linear-gradient(145deg,#343b45,#11151a);border:3px solid #5b626c;width:245px}.upper{height:185px;border-radius:28px 28px 12px 12px;transform-origin:bottom;transition:.55s;display:grid;place-items:center}.flipPhone.closed .upper{transform:rotateX(-155deg)}.lower{height:260px;border-radius:12px 12px 30px 30px;padding:16px}.lcd{width:185px;height:125px;background:#a8bd8d;border:8px solid #20262c;color:#162016;display:grid;place-items:center;font-family:monospace}.snakeCanvas{background:#a8bd8d;border:5px solid #1c2228;width:180px;height:130px;image-rendering:pixelated}.gameBtns{display:grid;grid-template-columns:repeat(3,55px);justify-content:center;gap:5px}.gameBtns button{height:42px;border:0;border-radius:9px;background:#535e6b;color:#fff}.gameBtns .up{grid-column:2}.gameBtns .left{grid-column:1}.gameBtns .down{grid-column:2}.gameBtns .right{grid-column:3}.track{padding:9px;border-top:1px solid #ffffff18;font-size:13px}.callScreen{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 25%,#25313a,#080a0d 65%);display:flex;align-items:center;justify-content:center}.callBox{text-align:center;width:min(390px,94vw)}.caller{font-size:28px;font-weight:1000;margin:8px}.handsetBtn{width:250px;height:160px;border:0;background:transparent;position:relative}.handset{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);width:215px;height:72px;border-radius:38px;background:linear-gradient(#3a3d42,#15171a);border:3px solid #5a5d62}.handset:before,.handset:after{content:"";position:absolute;top:-23px;width:62px;height:116px;border-radius:35px;background:linear-gradient(#45484d,#17191d);border:3px solid #5c5f64}.handset:before{left:-13px;transform:rotate(13deg)}.handset:after{right:-13px;transform:rotate(-13deg)}.ringing .handset{animation:ring .42s infinite alternate}.active .handset{border-color:#35d477;filter:drop-shadow(0 0 12px #35d477)}@keyframes ring{from{transform:translate(-50%,-50%) rotate(-13deg)}to{transform:translate(-50%,-50%) rotate(-3deg)}}</style></head><body><div id="showroom"></div><div id="homeHud" class="hud"><div class="top"><div class="era">TELEFON ZAMAN MAKİNESİ</div><h1>3D Telefon Vitrini</h1><p>Hepsiyle arama yapabilirsin.</p></div><div class="info"><b id="modelName"></b><p id="modelDesc"></p><div class="buttons"><button class="navBtn" onclick="prevModel()">←</button><button class="open" onclick="openSelected()">AÇ</button><button class="navBtn" onclick="nextModel()">→</button></div></div></div><section id="phoneStage" class="stage hide"><button class="back" onclick="closePhone()">← VİTRİNE DÖN</button><div class="era" id="stageEra"></div><h2 id="stageTitle"></h2><div id="flipVisual" class="hide"><div id="flip" class="flipPhone closed"><div class="upper" onclick="toggleFlip()"><div class="lcd"><div><b id="lcdTitle">KAPAĞA DOKUN</b><br><small id="lcdSub">Açmak için</small></div></div></div><div class="lower"><div style="width:62px;height:62px;border:10px solid #697482;border-radius:50%;margin:auto"></div></div></div><button class="action" onclick="toggleFlip()">KAPAĞI AÇ / KAPAT</button></div><div class="dialPanel"><div id="dialNumber" class="number"></div><div class="own">Senin numaran: <b id="ownNo"></b></div><div id="dialKeys" class="keys"></div><div class="actions"><button class="del" onclick="delDigit()">SİL</button><button class="call" onclick="placeCall()">ARA</button><button class="hang" onclick="clearNumber()">TEMİZLE</button></div></div><div id="extras" class="hide"><div class="music"><h3>🐍 YILAN</h3><canvas id="snakeCanvas" class="snakeCanvas" width="180" height="130"></canvas><div class="gameBtns"><button class="up" onclick="dir(0,-1)">▲</button><button class="left" onclick="dir(-1,0)">◀</button><button class="down" onclick="dir(0,1)">▼</button><button class="right" onclick="dir(1,0)">▶</button></div></div><div class="music"><h3>🎵 2000'ler</h3><div class="track">Gece Şehri · özgün demo <button onclick="tone(330)">▶</button></div><div class="track">Piksel Aşk · özgün demo <button onclick="tone(440)">▶</button></div></div></div></section><section id="callScreen" class="callScreen hide"><div class="callBox"><div class="era" id="callLabel">ARANIYOR</div><div id="caller" class="caller"></div><div id="callState">Telefon çalıyor…</div><button id="handsetBtn" class="handsetBtn ringing"><span class="handset"></span></button><div id="callHint"><b>AHİZEYE DOKUN → AÇ</b></div></div></section><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>const models=[{name:'1970 · Döner Telefon',desc:'Döner kadranla ara.',type:'rotary',era:'1970'},{name:'2003 · Kapaklı Cep',desc:'Tuşlarla ara, kapağı aç, Yılan oyna.',type:'flip',era:'2003'},{name:'2010 · Dokunmatik',desc:'Dokunmatik tuşlarla ara.',type:'touch',era:'2010'}];let scene,camera,renderer,groups=[],selected=0,drag=false,lastX=0,raw='',opened=false,calling=false,answered=false,secs=0,timer=null,audioCtx,gameLoop,snakeBody=[[5,5],[4,5],[3,5]],food=[12,7],vx=1,vy=0;const mine=localStorage.getItem('payphone_no')||('0601'+Math.floor(2000000+Math.random()*7999999));localStorage.setItem('payphone_no',mine);const fmt=n=>n.replace(/(\d{4})(\d{3})(\d{2})(\d{2}).*/,'$1 $2 $3 $4').trim();function mat(c){return new THREE.MeshStandardMaterial({color:c,metalness:.2,roughness:.6})}function box(w,h,d,c){return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c))}function cyl(r,h,c){return new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,32),mat(c))}function add(p,o,x=0,y=0,z=0){o.position.set(x,y,z);p.add(o);return o}function rotary(){let g=new THREE.Group();add(g,box(3.4,1.5,2.7,0x24272c),0,.75,0);let d=cyl(.88,.16,0x111315);d.rotation.x=Math.PI/2;add(g,d,0,1.5,1.12);for(let i=0;i<10;i++){let a=-1.8+i*.4,h=cyl(.12,.18,0x777d85);h.rotation.x=Math.PI/2;add(g,h,Math.cos(a)*.65,1.5+Math.sin(a)*.65,1.3)}add(g,box(3.7,.45,.52,0x15171a),0,2.35,.08);return g}function flip3d(){let g=new THREE.Group();add(g,box(2.1,2.4,.55,0x242a31),0,1.2,0);let u=box(2.1,2,.45,0x343b45);u.rotation.x=-.35;add(g,u,0,3.05,-.45);add(g,box(1.45,1.05,.05,0xa9bd8f),0,3.15,-.18);return g}function touch3d(){let g=new THREE.Group();add(g,box(2.2,4.1,.38,0x15171c),0,2,0);add(g,box(1.92,3.35,.05,0x18283b),0,2.15,.22);return g}function init3d(){scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(0,3.1,9);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);showroom.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xcdd9e8,0x24190f,1.3));let l=new THREE.DirectionalLight(0xffffff,2);l.position.set(5,8,6);scene.add(l);groups=[rotary(),flip3d(),touch3d()];groups.forEach(g=>scene.add(g));animate()}function animate(){requestAnimationFrame(animate);groups.forEach((g,i)=>{g.rotation.y+=.003;g.position.x+=(((i-selected)*5)-g.position.x)*.08;g.scale.setScalar(i===selected?1.1:.82)});renderer.render(scene,camera)}function refresh(){modelName.textContent=models[selected].name;modelDesc.textContent=models[selected].desc}function nextModel(){selected=(selected+1)%3;refresh()}function prevModel(){selected=(selected+2)%3;refresh()}function openSelected(){let m=models[selected];if(m.type==='rotary'){location.href='./';return}showroom.classList.add('hide');homeHud.classList.add('hide');phoneStage.classList.remove('hide');stageEra.textContent=m.era;stageTitle.textContent=m.name;ownNo.textContent=fmt(mine);flipVisual.classList.toggle('hide',m.type!=='flip');extras.classList.toggle('hide',m.type!=='flip');dialKeys.className='keys '+(m.type==='touch'?'touchKeys':'');renderKeys();clearNumber();if(m.type==='flip')startSnake()}function closePhone(){phoneStage.classList.add('hide');showroom.classList.remove('hide');homeHud.classList.remove('hide');clearInterval(gameLoop)}function renderKeys(){dialKeys.innerHTML='';['1','2','3','4','5','6','7','8','9','*','0','#'].forEach(k=>{let b=document.createElement('button');b.className='key';b.textContent=k;b.onclick=()=>{if(raw.length<11&&/\d/.test(k)){raw+=k;dialNumber.textContent=fmt(raw)}};dialKeys.appendChild(b)})}function delDigit(){raw=raw.slice(0,-1);dialNumber.textContent=fmt(raw)}function clearNumber(){raw='';dialNumber.textContent=''}function placeCall(){if(raw.length<10){dialNumber.textContent='NUMARA EKSİK';setTimeout(()=>dialNumber.textContent=fmt(raw),700);return}showCall(raw,'outgoing')}function showCall(num,mode){caller.textContent=fmt(num);callLabel.textContent=mode==='incoming'?'GELEN ARAMA':'ARANIYOR';callState.textContent=mode==='incoming'?'Telefon çalıyor…':'Karşı taraf aranıyor…';callScreen.classList.remove('hide');handsetBtn.className='handsetBtn ringing';callHint.innerHTML='<b>AHİZEYE DOKUN → AÇ</b>';calling=true;answered=false}function startTimer(){clearInterval(timer);secs=0;callState.textContent='Bağlandı · 00:00';timer=setInterval(()=>{secs++;callState.textContent='Bağlandı · '+String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0')},1000)}function endCall(){calling=false;answered=false;clearInterval(timer);callState.textContent='Görüşme kapandı';setTimeout(()=>callScreen.classList.add('hide'),500)}handsetBtn.onclick=()=>{if(!calling)return;if(!answered){answered=true;handsetBtn.className='handsetBtn active';callHint.innerHTML='<b>TEKRAR DOKUN → KAPAT</b>';startTimer()}else endCall()};function toggleFlip(){opened=!opened;flip.classList.toggle('closed',!opened);lcdTitle.textContent=opened?'FLIP 03':'KAPAĞA DOKUN';lcdSub.textContent=opened?'Arama ve Yılan hazır':'Açmak için'}function dir(x,y){if(x===-vx&&y===-vy)return;vx=x;vy=y}function startSnake(){clearInterval(gameLoop);snakeBody=[[5,5],[4,5],[3,5]];food=[12,7];vx=1;vy=0;drawSnake();gameLoop=setInterval(stepSnake,160)}function stepSnake(){let h=[snakeBody[0][0]+vx,snakeBody[0][1]+vy];if(h[0]<0||h[0]>=18||h[1]<0||h[1]>=13||snakeBody.some(p=>p[0]===h[0]&&p[1]===h[1]))return startSnake();snakeBody.unshift(h);if(h[0]===food[0]&&h[1]===food[1])food=[Math.floor(Math.random()*18),Math.floor(Math.random()*13)];else snakeBody.pop();drawSnake()}function drawSnake(){let c=document.getElementById('snakeCanvas').getContext('2d');c.fillStyle='#a8bd8d';c.fillRect(0,0,180,130);c.fillStyle='#182319';snakeBody.forEach(p=>c.fillRect(p[0]*10+1,p[1]*10+1,8,8));c.fillStyle='#4b2b20';c.fillRect(food[0]*10+2,food[1]*10+2,6,6)}function tone(f){audioCtx=audioCtx||new (AudioContext||webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;o.type='square';g.gain.value=.05;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.35)}window.demoIncoming=()=>showCall('06015550101','incoming');addEventListener('pointerdown',e=>{if(!homeHud.classList.contains('hide')){drag=true;lastX=e.clientX}});addEventListener('pointermove',e=>{if(drag){let dx=e.clientX-lastX;lastX=e.clientX;groups[selected].rotation.y+=dx*.01}});addEventListener('pointerup',()=>drag=false);init3d();refresh()</script></body></html>
