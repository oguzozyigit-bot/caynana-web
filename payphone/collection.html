<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Telefon Müzesi</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial,sans-serif;background:#a9d8ef;color:#173242;overflow-x:hidden}button,input,textarea{font:inherit}button{border:0;border-radius:12px;padding:10px 12px;font-weight:800;background:#263847;color:#fff}.gold,.active{background:#e3ad35!important;color:#19130a!important}.top{text-align:center;padding:10px 8px 4px}.top h1{margin:2px}.museum{min-height:100vh;padding-bottom:250px;background:linear-gradient(#bfe8f8,#91cce5)}.wall{max-width:900px;margin:auto;padding:4px 10px}.shelf{position:relative;margin:16px auto 36px;height:175px;display:flex;align-items:flex-end;justify-content:center;gap:18px;padding:0 12px 20px}.shelf:after{content:'';position:absolute;left:0;right:0;bottom:0;height:20px;background:linear-gradient(#a46b33,#74451f);border-radius:5px;box-shadow:0 8px 8px #46606f55}.phoneCard{width:125px;min-width:105px;height:145px;display:grid;place-items:end center;cursor:pointer;transition:.2s;position:relative;z-index:2}.phoneCard.selected{transform:translateY(-9px) scale(1.08);filter:drop-shadow(0 10px 8px #3455)}.phone{position:relative;background:#2b3036;border:3px solid #171a1d;box-shadow:inset 0 0 0 2px #4d555d;border-radius:13px;width:68px;height:120px}.phone .screen{position:absolute;left:9px;right:9px;top:15px;height:35px;border:2px solid #12191c;background:#a8bb8c;border-radius:4px}.phone .keys{position:absolute;left:9px;right:9px;top:58px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.phone .keys i{height:10px;background:#69727a;border-radius:3px}.brick{width:76px;height:138px;border-radius:6px}.brick:before{content:'';position:absolute;width:7px;height:34px;right:7px;top:-31px;background:#24282b;border-radius:5px}.flip{height:72px;margin-bottom:46px}.flip:before{content:'';position:absolute;left:-3px;top:-62px;width:68px;height:60px;background:#363e46;border:3px solid #171a1d;border-radius:12px 12px 5px 5px;transform:rotateX(18deg)}.slider:before{content:'';position:absolute;left:5px;top:-24px;width:52px;height:76px;background:#46515b;border-radius:10px;border:2px solid #222}.qwerty{width:96px;height:105px}.qwerty .screen{height:31px}.qwerty .keys{grid-template-columns:repeat(6,1fr);top:58px}.touch{width:70px;height:128px;border-radius:17px}.touch .screen{inset:5px;height:auto;background:linear-gradient(155deg,#18354a,#3a6c83);border-radius:12px}.touch .keys{display:none}.fold{width:78px;height:128px;border-radius:13px}.fold:after{content:'';position:absolute;top:2px;bottom:2px;left:50%;width:1px;background:#ffffff44}.rotary{width:112px;height:70px;border-radius:16px;margin-bottom:10px}.rotary .screen,.rotary .keys{display:none}.rotary:before{content:'☎';font-size:40px;position:absolute;left:33px;top:-34px}.rotary:after{content:'◉';font-size:35px;position:absolute;left:39px;top:20px;color:#b9aa91}.label{font-size:10px;font-weight:800;text-align:center;margin-top:5px;max-width:120px}.controls{position:fixed;z-index:10;left:50%;bottom:6px;transform:translateX(-50%);width:min(680px,96vw);background:#f8fbfddd;border:1px solid #fff;border-radius:20px;padding:9px;box-shadow:0 12px 30px #3455}.row{display:flex;gap:6px;align-items:center;justify-content:center;overflow-x:auto}.years,.models{justify-content:flex-start;padding:4px 0}.years button{min-width:61px}.models button{min-width:120px;font-size:11px}.controls h2,.controls p{margin:3px;text-align:center}.stage{position:fixed;inset:0;z-index:30;background:linear-gradient(#bfe8f8,#91cce5);padding:14px;overflow:auto;text-align:center}.hide{display:none!important}.panel{max-width:440px;margin:10px auto;background:#f9fcfd;border-radius:18px;padding:14px;box-shadow:0 8px 24px #3453}.dial{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.dial button{height:58px;font-size:20px}.display{background:#a8bb8c;color:#152015;border:5px solid #263238;border-radius:8px;padding:12px;font:900 23px monospace;min-height:58px}.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.app{min-height:80px;background:#dceaf0;color:#173242}.app span{display:block;font-size:25px}.game{background:#a8bb8c;border:5px solid #243038;width:260px;height:180px;max-width:100%;touch-action:none}.dpad{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center}.dpad button{height:50px}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}.rotaryDial{width:245px;height:245px;border-radius:50%;margin:10px auto;position:relative;background:#2d2b27;border:15px solid #806e57}.rotaryDial button{position:absolute;width:46px;height:46px;border-radius:50%;margin:-23px;background:#e4dac5;color:#222}.small{font-size:12px;opacity:.75}</style></head><body><main class="museum" id="home"><div class="top"><div>TELEFON MÜZESİ</div><h1>1970 → 2026</h1><small>Açık mavi duvar · ahşap raflar · çalışan telefonlar</small></div><div id="wall" class="wall"></div><div class="controls"><div id="yearLabel" style="text-align:center;font-weight:900"></div><h2 id="modelName"></h2><p id="modelDesc"></p><div id="models" class="row models"></div><div id="years" class="row years"></div><div class="row"><button onclick="prevYear()">←</button><input id="yearSlider" type="range" min="1970" max="2026" style="flex:1" oninput="selectYear(+this.value)"><button onclick="nextYear()">→</button></div><div class="row" style="flex-wrap:wrap"><button class="gold" onclick="openDial()">TELEFONU AÇ</button><button class="gold" onclick="openApps()">UYGULAMALAR</button><button onclick="openInside()">İÇİNİ AÇ</button><button onclick="openUpdates()">GÜNCELLEMELER</button></div></div></main><section id="stage" class="stage hide"></section><script>const brands=['RetroTel','Nokkia','Soniq','Motora','Siemax','Eriksonn','Panasonix','Alcatell','LX','Samsunq','BlackBerri','Future'],vars=['Core','Plus','Mini','Max','Music','Game','Pro','Lite'];function types(y){if(y<1984)return['rotary','rotary','brick'];if(y<1994)return['brick','bar','brick'];if(y<2001)return['bar','bar','brick'];if(y<2005)return['bar','flip','bar'];if(y<2008)return['flip','slider','bar','flip'];if(y<2010)return['qwerty','slider','touch'];if(y<2014)return['touch','qwerty','touch'];if(y<2019)return['touch','touch','bar','touch'];if(y<2022)return['touch','fold','touch','qwerty'];return['touch','fold','touch','fold','touch']}const catalog={};for(let y=1970;y<=2026;y++)catalog[y]=types(y).map((t,i)=>({type:t,name:brands[(y+i)%brands.length]+' '+vars[(y+i*2)%vars.length]+' '+String(y).slice(-2)+(i?'-'+(i+1):''),desc:({rotary:'Döner kadranlı masa telefonu',brick:'Antenli büyük mobil telefon',bar:'Klasik tuşlu cep telefonu',flip:'Kapaklı telefon',slider:'Sürgülü telefon',qwerty:'Tam klavyeli mesaj telefonu',touch:'Dokunmatik akıllı telefon',fold:'Katlanabilir akıllı telefon'})[t]}));let year=2001,idx=0,audioCtx,raw='',gameTimer=null,gx=30,gy=80,vx=1,vy=0,score=0;const cur=()=>catalog[year][idx];function phoneHTML(m,i){let keys=m.type==='touch'||m.type==='fold'||m.type==='rotary'?'':'<div class="keys">'+Array.from({length:m.type==='qwerty'?18:12},()=>'<i></i>').join('')+'</div>';return '<div class="phoneCard '+(i===idx?'selected':'')+'" onclick="selectModel('+i+')"><div><div class="phone '+m.type+'"><div class="screen"></div>'+keys+'</div><div class="label">'+m.name+'</div></div></div>'}function renderWall(){let list=catalog[year],chunks=[];for(let i=0;i<list.length;i+=3)chunks.push(list.slice(i,i+3).map((m,j)=>phoneHTML(m,i+j)).join(''));wall.innerHTML=chunks.map(x=>'<div class="shelf">'+x+'</div>').join('')}function renderYears(){years.innerHTML='';for(let y=1970;y<=2026;y++)years.innerHTML+='<button class="'+(y===year?'active':'')+'" onclick="selectYear('+y+')">'+y+'</button>'}function renderModels(){models.innerHTML=catalog[year].map((m,i)=>'<button class="'+(i===idx?'active':'')+'" onclick="selectModel('+i+')">'+m.name+'</button>').join('')}function refresh(){yearLabel.textContent=year+' · '+catalog[year].length+' TELEFON';modelName.textContent=cur().name;modelDesc.textContent=cur().desc;yearSlider.value=year;renderWall();renderYears();renderModels()}function selectYear(y){year=y;idx=0;refresh()}function selectModel(i){idx=i;clickSound(2);refresh()}function nextYear(){selectYear(year===2026?1970:year+1)}function prevYear(){selectYear(year===1970?2026:year-1)}function ctx(){audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();return audioCtx}function clickSound(n=0){try{let c=ctx(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type=year<1990?'square':year<2010?'triangle':'sine';o.frequency.value=(year<1990?190:year<2010?520:760)+n*22;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+.07);o.connect(g);g.connect(c.destination);o.start();o.stop(t+.08)}catch(e){}}function show(html){home.classList.add('hide');stage.classList.remove('hide');stage.innerHTML='<button onclick="back()">← RAFA DÖN</button><h2>'+cur().name+' · '+year+'</h2>'+html}function back(){clearInterval(gameTimer);stage.classList.add('hide');home.classList.remove('hide');refresh()}function openDial(){raw='';if(cur().type==='rotary'&&year<1984){let b='';for(let i=1;i<=10;i++){let n=i===10?0:i,a=(i-1)*36-90,x=122+86*Math.cos(a*Math.PI/180),y=122+86*Math.sin(a*Math.PI/180);b+='<button style="left:'+x+'px;top:'+y+'px" onclick="digit(\''+n+'\')">'+n+'</button>'}show('<div class="panel"><div id="num" class="display">NUMARA</div><div class="rotaryDial">'+b+'</div><button class="gold" onclick="call()">☎ AHİZEYİ KALDIR</button></div>');return}show('<div class="panel"><div id="num" class="display">NUMARA</div><div class="dial">'+['1','2','3','4','5','6','7','8','9','*','0','#'].map(k=>'<button onclick="digit(\''+k+'\')">'+k+'</button>').join('')+'</div><div class="row" style="margin-top:10px"><button onclick="raw=raw.slice(0,-1);num.textContent=raw||\'NUMARA\'">SİL</button><button class="gold" onclick="call()">☎ ARA</button></div></div>')}function digit(k){clickSound(+k||1);if(/\d/.test(k)&&raw.length<11)raw+=k;num.textContent=raw||'NUMARA'}function call(){clickSound(8);if(raw.length<7){num.textContent='NUMARA EKSİK';return}stage.innerHTML='<button onclick="back()">← KAPAT</button><div class="panel"><div class="small">ARANIYOR</div><h2>'+raw+'</h2><div style="font-size:90px">☎</div><button class="gold" onclick="this.textContent=\'BAĞLANDI\';clickSound(6)">CEVAPLA</button></div>'}function gameName(){if(year<1990)return'Brick Paddle';if(year<2000)return'Pixel Snake';if(year<2010)return'Java Racer';if(year<2020)return'Tap Runner';return'Neon Dash'}function appList(){let a=[['☎','Telefon'],['👥','Rehber'],['🎮',gameName()],['🧮','Hesap'],['⏰','Saat']];if(year>=1995)a.splice(2,0,['✉️','Mesajlar']);if(year>=2000)a.push(['🎵','Müzik'],['📷','Kamera']);if(year>=2010)a.push(['📝','Notlar'],['🌐','Tarayıcı'],['⚙️','Ayarlar']);return a}function openApps(){show('<div class="panel apps">'+appList().map((a,i)=>'<button class="app" onclick="runApp('+i+')"><span>'+a[0]+'</span>'+a[1]+'</button>').join('')+'</div><div id="appView" class="panel">Bir uygulamaya dokun.</div>')}function runApp(i){clickSound(i);let n=appList()[i][1];if(n==='Telefon'){openDial();return}if(n===gameName()){showGame();return}if(n==='Mesajlar'){appView.innerHTML='<textarea id="msg" style="width:100%;height:90px"></textarea><button onclick="this.nextElementSibling.textContent=\'Gönderildi\'">GÖNDER</button><div></div>';return}if(n==='Hesap'){appView.innerHTML='<input id="calc" style="width:100%;padding:10px"><div class="dial">'+['7','8','9','4','5','6','1','2','3','0','.','='].map(k=>'<button onclick="if(\''+k+'\'===\'=\'){try{calc.value=Function(\'return \'+calc.value)()}catch(e){calc.value=\'HATA\'}}else calc.value+=\''+k+'\'">'+k+'</button>').join('')+'</div>';return}if(n==='Saat'){appView.innerHTML='<h1>'+new Date().toLocaleTimeString('tr-TR')+'</h1>';return}if(n==='Müzik'){appView.innerHTML='<button onclick="clickSound(3)">▶ ÇAL</button><p>'+year+' dönem tarzı özgün ton.</p>';return}if(n==='Kamera'){appView.innerHTML='<div style="height:130px;background:#345;color:white;display:grid;place-items:center">📷 '+year+'</div><button onclick="this.textContent=\'KAYDEDİLDİ\'">FOTOĞRAF ÇEK</button>';return}appView.innerHTML='<h3>'+n+'</h3><p>Uygulama açıldı.</p>'}function showGame(){show('<div class="panel"><h3>'+gameName()+'</h3><canvas id="game" class="game" width="240" height="160"></canvas><div class="dpad"><button class="up" onclick="dir(0,-1)">▲</button><button class="left" onclick="dir(-1,0)">◀</button><button class="down" onclick="dir(0,1)">▼</button><button class="right" onclick="dir(1,0)">▶</button></div><div id="sc"></div></div>');startGame()}function startGame(){clearInterval(gameTimer);gx=30;gy=80;vx=1;vy=0;score=0;draw();gameTimer=setInterval(()=>{gx+=vx*7;gy+=vy*7;if(gx<0)gx=230;if(gx>230)gx=0;if(gy<0)gy=150;if(gy>150)gy=0;score++;draw()},110)}function dir(x,y){clickSound(1);vx=x;vy=y}function draw(){let c=document.getElementById('game');if(!c)return,x=c.getContext('2d');x.fillStyle=year<2010?'#a8bb8c':'#173242';x.fillRect(0,0,240,160);x.fillStyle=year<2010?'#172217':'#e3ad35';x.fillRect(gx,gy,14,14);if(sc)sc.textContent='Skor: '+score}function openInside(){show('<div class="panel"><h3>İç Yapı</h3><p>🧱 Kasa</p><p>🔋 Batarya</p><p>🧠 Anakart</p><p>📡 Anten / Haberleşme</p><p>🔊 Hoparlör + Mikrofon</p><p>🖥️ Ekran ve tuş modülü</p></div>')}function openUpdates(){show('<div class="panel"><h3>Güncellemeler</h3><p><b>'+year+'</b> · İlk sürüm</p><p><b>'+(year+1)+'</b> · Menü ve pil iyileştirmeleri</p><p><b>'+(year+2)+'</b> · Son bakım sürümü</p></div>')}refresh()</script></body></html>
