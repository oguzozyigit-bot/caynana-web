<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0d0f12"><title>ANKESÖR</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:#0d0f12;color:#f6f6f6;font-family:Arial,sans-serif}body{display:grid;place-items:center;padding:16px}.phone{width:min(420px,96vw);background:linear-gradient(#1a1d21,#0d0f12);border:2px solid #40444b;border-radius:26px;padding:18px;box-shadow:0 20px 60px #0008}.brand{text-align:center;font-weight:1000;letter-spacing:3px;color:#d7d7d7}.screen{margin:14px 0;background:#c9d6b0;color:#182012;border:8px solid #30343a;border-radius:12px;padding:14px;min-height:120px;box-shadow:inset 0 0 20px #0003}.small{font-size:12px;opacity:.75}.number{font-family:monospace;font-size:29px;font-weight:900;letter-spacing:2px;min-height:38px;word-break:break-all}.status{font-size:14px;margin-top:8px}.own{font-size:13px;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.key{height:64px;border:0;border-radius:16px;background:#2b3037;color:white;font-size:24px;font-weight:900;box-shadow:0 4px 0 #111}.key:active{transform:translateY(2px);box-shadow:0 2px 0 #111}.sub{display:block;font-size:9px;opacity:.55;letter-spacing:1px}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}.call,.hang,.del{border:0;border-radius:15px;height:54px;color:white;font-weight:900;font-size:15px}.call{background:#25a95b}.hang{background:#c92d3e}.del{background:#444b55}.card{margin-top:14px;padding:12px;border:1px solid #ffffff1c;border-radius:14px;background:#ffffff08}.card h3{margin:0 0 8px;font-size:14px}.online{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid #ffffff12;font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:#36d16d;display:inline-block;margin-right:7px}.note{font-size:11px;opacity:.7;line-height:1.4;margin-top:10px}</style></head><body><main class="phone"><div class="brand">ANKESÖR</div><section class="screen"><div class="small">NUMARA ÇEVİR</div><div id="number" class="number"></div><div id="status" class="status">Hazır</div><div class="own">Senin numaran: <b id="own"></b></div></section><div id="keys" class="grid"></div><div class="row"><button id="del" class="del">SİL</button><button id="call" class="call">ARA</button><button id="hang" class="hang">KAPAT</button></div><section class="card"><h3>Çevrimiçi kullanıcılar</h3><div class="online"><span><i class="dot"></i>Demo Kullanıcı 1</span><b>0601 555 01 01</b></div><div class="online"><span><i class="dot"></i>Demo Kullanıcı 2</span><b>0601 555 02 02</b></div></section><div class="note">Bu sürüm bağımsız arayüz prototipidir. Gerçek cihazlar arası sesli görüşme için WebRTC sinyalleşme sunucusu, kullanıcı oturumu ve çağrı bildirim altyapısı bağlanmalıdır.</div></main><script>(()=>{const number=document.getElementById('number'),status=document.getElementById('status'),keys=document.getElementById('keys'),own=document.getElementById('own');let raw='',calling=false,timer=null,secs=0;const saved=localStorage.getItem('payphone_no');const mine=saved||('0601'+Math.floor(2000000+Math.random()*7999999));localStorage.setItem('payphone_no',mine);function fmt(n){return n.replace(/(\d{4})(\d{3})(\d{2})(\d{2}).*/,'$1 $2 $3 $4').trim()}own.textContent=fmt(mine);const layout=[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['*',''],['0','+'],['#','']];for(const [k,s] of layout){const b=document.createElement('button');b.className='key';b.innerHTML=k+(s?`<span class="sub">${s}</span>`:'');b.onclick=()=>{if(calling)return;if(raw.length<11){raw+=k.replace(/\D/g,'');number.textContent=fmt(raw)}};keys.appendChild(b)}document.getElementById('del').onclick=()=>{if(calling)return;raw=raw.slice(0,-1);number.textContent=fmt(raw)};document.getElementById('call').onclick=()=>{if(calling)return;if(raw.length<10){status.textContent='Geçerli bir numara gir';return}calling=true;secs=0;status.textContent='Aranıyor: '+fmt(raw);setTimeout(()=>{if(!calling)return;status.textContent='Bağlandı · 00:00';timer=setInterval(()=>{secs++;const m=String(Math.floor(secs/60)).padStart(2,'0'),s=String(secs%60).padStart(2,'0');status.textContent='Bağlandı · '+m+':'+s},1000)},1200)};document.getElementById('hang').onclick=()=>{calling=false;clearInterval(timer);status.textContent='Görüşme kapandı';setTimeout(()=>status.textContent='Hazır',900)}})()</script></body></html>
