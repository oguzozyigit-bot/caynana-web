<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173242"><link rel="manifest" href="manifest.webmanifest"><title>Telefon Call</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#bfe8f8}iframe{border:0;width:100%;height:100%;display:block}#installBar{position:fixed;z-index:99999;left:10px;right:10px;bottom:10px;display:none;gap:8px;justify-content:center;flex-wrap:wrap}#installBar button{border:0;border-radius:14px;padding:12px 16px;font:800 14px Arial;color:#fff;background:#173242;box-shadow:0 4px 16px #0004}</style></head><body><iframe id="appFrame" allow="camera; microphone; autoplay"></iframe><div id="installBar"><button id="installBtn">TELEFONA KUR</button><button id="notifyBtn">ARAMA BİLDİRİMLERİNİ AÇ</button></div><script>(()=>{const CANON='www.caynana.ai';if(location.hostname!==CANON){location.replace('https://'+CANON+'/payphone/app.html'+location.search+location.hash);return;}const KEY='phoneMuseumOwnNumber',CK='pm_own_number';const readCookie=()=>{const m=document.cookie.match(new RegExp('(?:^|; )'+CK+'=([^;]*)'));return m?decodeURIComponent(m[1]):''};const valid=n=>/^0601\d{7}$/.test(String(n||''));let n=localStorage.getItem(KEY)||readCookie();if(!valid(n)){n='0601'+String(Math.floor(Math.random()*10000000)).padStart(7,'0')}localStorage.setItem(KEY,n);document.cookie=CK+'='+encodeURIComponent(n)+'; Max-Age=315360000; Path=/; SameSite=Lax; Secure';document.getElementById('appFrame').src='collection.html';let deferredPrompt=null;const bar=document.getElementById('installBar'),install=document.getElementById('installBtn'),notify=document.getElementById('notifyBtn');if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js').then(()=>{bar.style.display='flex'}).catch(()=>{})}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;bar.style.display='flex'});install.onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null}else{alert('Tarayıcı menüsünden “Ana ekrana ekle / Uygulamayı yükle” seçeneğini kullanabilirsin.')}};notify.onclick=async()=>{if(!('Notification'in window))return alert('Bu cihaz bildirim desteklemiyor.');const p=await Notification.requestPermission();notify.textContent=p==='granted'?'BİLDİRİMLER AÇIK':'BİLDİRİM İZNİ VER'};})();</script></body></html>
