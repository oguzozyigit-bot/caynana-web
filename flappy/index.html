<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#70c5ce"><title>Sky Hop</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#70c5ce;font-family:Arial,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}.ui{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 3px 0 #0007}.top{position:absolute;top:max(14px,env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:36px;font-weight:1000}.stats{position:absolute;top:max(16px,env(safe-area-inset-top));left:14px;font-weight:900;font-size:14px}.best{position:absolute;top:max(16px,env(safe-area-inset-top));right:14px;font-weight:900;font-size:14px}.panel{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(390px,92vw);padding:20px;border-radius:22px;background:#0b1729e8;border:2px solid #ffffff55;text-align:center;pointer-events:auto}.panel h1{margin:0 0 8px;font-size:38px}.panel p{margin:8px 0 14px;line-height:1.35}.panel button{width:100%;border:0;border-radius:14px;padding:13px 16px;font-size:17px;font-weight:900;background:#ffd54a;color:#172033;box-shadow:0 5px 0 #b98f18;margin-top:10px}.chars{display:flex;gap:8px;justify-content:center;margin:12px 0}.char{width:66px!important;height:58px;padding:0!important;margin:0!important;font-size:26px!important;background:#23344f!important;color:#fff!important;box-shadow:none!important;border:2px solid transparent!important}.char.sel{border-color:#ffd54a!important;background:#314d74!important}.small{margin-top:10px;font-size:12px;opacity:.85}.hide{display:none}</style></head><body><canvas id="game"></canvas><div class="ui"><div id="score" class="top hide">0</div><div id="stats" class="stats">🪙 0 · LV 1</div><div id="best" class="best">EN İYİ: 0</div><div id="start" class="panel"><h1>SKY HOP</h1><p>Karakterini seç. Jetonları topla, bölümleri geç ve gece canavarından kaç.</p><div class="chars"><button class="char sel" data-char="0">🐤</button><button class="char" data-char="1">🦉</button><button class="char" data-char="2">🐲</button><button class="char" data-char="3">👻</button></div><button id="play">OYNA</button><div class="small">Dokun / tıkla / boşluk tuşu</div></div><div id="over" class="panel hide"><h1>OYUN BİTTİ</h1><p>Skor: <b id="finalScore">0</b><br>Jeton: <b id="finalCoins">0</b><br>En iyi: <b id="finalBest">0</b></p><button id="again">TEKRAR OYNA</button></div></div><script>(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),statsEl=document.getElementById('stats'),start=document.getElementById('start'),over=document.getElementById('over'),play=document.getElementById('play'),again=document.getElementById('again'),finalScore=document.getElementById('finalScore'),finalBest=document.getElementById('finalBest'),finalCoins=document.getElementById('finalCoins');let W,H,dpr,bird,pipes,coins,monster,score,best=Number(localStorage.getItem('skyhop_best')||0),bank=Number(localStorage.getItem('skyhop_coins')||0),runCoins=0,level=1,running=false,dead=false,last=0,spawn=0,coinSpawn=0,speed=190,gap=175,night=false,char=Number(localStorage.getItem('skyhop_char')||0);const chars=['🐤','🦉','🐲','👻'];bestEl.textContent='EN İYİ: '+best;document.querySelectorAll('.char').forEach((b,i)=>{b.classList.toggle('sel',i===char);b.onclick=()=>{char=i;localStorage.setItem('skyhop_char',char);document.querySelectorAll('.char').forEach((q,j)=>q.classList.toggle('sel',j===char))}});function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function updateHud(){level=1+Math.floor(score/10);night=level>=3;statsEl.textContent='🪙 '+bank+' · LV '+level}function reset(){bird={x:W*.27,y:H*.45,vy:0,r:18,rot:0};pipes=[];coins=[];monster=null;score=0;runCoins=0;spawn=0;coinSpawn=0;speed=Math.max(175,Math.min(235,W*.34));gap=Math.max(150,Math.min(195,H*.22));scoreEl.textContent='0';scoreEl.classList.remove('hide');over.classList.add('hide');dead=false;running=true;last=performance.now();updateHud()}function flap(){if(!running||dead)return;bird.vy=-390}function addPipe(){const ground=78,margin=74,min=margin,max=H-ground-gap-margin,top=min+Math.random()*Math.max(20,max-min);pipes.push({x:W+50,w:70,top,gap,passed:false})}function addCoin(){coins.push({x:W+40,y:80+Math.random()*(H-220),r:11,t:0})}function hitPipe(p){const br=bird.r*.72;return bird.x+br>p.x&&bird.x-br<p.x+p.w&&(bird.y-br<p.top||bird.y+br>p.top+p.gap)}function end(){if(dead)return;dead=true;running=false;scoreEl.classList.add('hide');bank+=runCoins;localStorage.setItem('skyhop_coins',bank);if(score>best){best=score;localStorage.setItem('skyhop_best',best)}bestEl.textContent='EN İYİ: '+best;finalScore.textContent=score;finalCoins.textContent=runCoins;finalBest.textContent=best;updateHud();setTimeout(()=>over.classList.remove('hide'),220)}function update(dt){const ground=78;bird.vy+=1050*dt;bird.y+=bird.vy*dt;bird.rot=Math.max(-.5,Math.min(1.15,bird.vy/520));spawn+=dt;coinSpawn+=dt;if(spawn>1.45){spawn=0;addPipe()}if(coinSpawn>2.2){coinSpawn=0;addCoin()}for(const p of pipes){p.x-=speed*dt;if(!p.passed&&p.x+p.w<bird.x){p.passed=true;score++;scoreEl.textContent=score;speed=Math.min(speed+2.4,290);gap=Math.max(gap-.8,132);updateHud();if(score%10===0)monster={x:W+80,y:H*.35+Math.random()*H*.25,r:28,t:0}}if(hitPipe(p))end()}pipes=pipes.filter(p=>p.x+p.w>-20);for(const q of coins){q.x-=speed*dt;q.t+=dt;const d=Math.hypot(q.x-bird.x,q.y-bird.y);if(!q.got&&d<bird.r+q.r){q.got=true;runCoins++;statsEl.textContent='🪙 '+(bank+runCoins)+' · LV '+level}}coins=coins.filter(q=>!q.got&&q.x>-20);if(monster){monster.t+=dt;monster.x-=speed*.68*dt;monster.y+=Math.sin(monster.t*3)*45*dt;if(Math.hypot(monster.x-bird.x,monster.y-bird.y)<monster.r+bird.r*.7)end();if(monster.x<-60)monster=null}if(bird.y+bird.r>=H-ground||bird.y-bird.r<=0)end()}function bg(){const g=x.createLinearGradient(0,0,0,H);if(night){g.addColorStop(0,'#0a1530');g.addColorStop(1,'#283457')}else{g.addColorStop(0,'#66c6d3');g.addColorStop(1,'#d8f0d0')}x.fillStyle=g;x.fillRect(0,0,W,H);if(night){x.fillStyle='#fff';for(let i=0;i<40;i++)x.fillRect((i*83)%W,(i*47)%Math.max(120,H-100),2,2)}else{x.fillStyle='#ffffff55';for(let i=0;i<6;i++){const cx=(i*210+40)%Math.max(W,1),cy=75+(i%3)*62;x.beginPath();x.arc(cx,cy,24,0,Math.PI*2);x.arc(cx+28,cy+3,18,0,Math.PI*2);x.arc(cx-25,cy+7,16,0,Math.PI*2);x.fill()}}x.fillStyle=night?'#24351f':'#8fd05c';x.fillRect(0,H-78,W,78);x.fillStyle=night?'#182715':'#6db343';x.fillRect(0,H-78,W,12)}function pipe(p){const grad=x.createLinearGradient(p.x,p.x+p.w,0,0);grad.addColorStop(0,night?'#273a48':'#3e9d3d');grad.addColorStop(.55,night?'#436477':'#76d34c');grad.addColorStop(1,night?'#1b2b35':'#2e7b32');x.fillStyle=grad;x.strokeStyle=night?'#101820':'#245f27';x.lineWidth=3;x.fillRect(p.x,0,p.w,p.top);x.strokeRect(p.x,0,p.w,p.top);x.fillRect(p.x-7,p.top-26,p.w+14,26);x.strokeRect(p.x-7,p.top-26,p.w+14,26);const b=p.top+p.gap;x.fillRect(p.x,b,p.w,H-b-78);x.strokeRect(p.x,b,p.w,H-b-78);x.fillRect(p.x-7,b,p.w+14,26);x.strokeRect(p.x-7,b,p.w+14,26)}function drawCoin(q){x.save();x.translate(q.x,q.y);x.rotate(q.t*4);x.fillStyle='#ffd34a';x.strokeStyle='#a46d00';x.lineWidth=3;x.beginPath();x.arc(0,0,q.r,0,Math.PI*2);x.fill();x.stroke();x.fillStyle='#fff2a4';x.fillRect(-2,-6,4,12);x.restore()}function drawBird(){x.save();x.translate(bird.x,bird.y);x.rotate(bird.rot);x.font='42px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(chars[char],0,0);x.restore()}function drawMonster(){if(!monster)return;x.save();x.translate(monster.x,monster.y);x.font='54px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText('👹',0,0);x.restore()}function render(){bg();for(const p of pipes)pipe(p);for(const q of coins)drawCoin(q);drawMonster();if(bird)drawBird()}function loop(t){const dt=Math.min((t-last)/1000,.033);last=t;if(running)update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);function startGame(){start.classList.add('hide');reset();flap()}play.onclick=startGame;again.onclick=()=>{reset();flap()};addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;flap()});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flap()}})})();</script></body></html>
