<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#70c5ce"><title>Sky Hop</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#70c5ce;font-family:Arial,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}.ui{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 3px 0 #0007}.top{position:absolute;top:max(16px,env(safe-area-inset-top));left:0;right:0;text-align:center;font-size:42px;font-weight:1000}.panel{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(360px,88vw);padding:22px;border-radius:22px;background:#0b1729d9;border:2px solid #ffffff55;text-align:center;pointer-events:auto}.panel h1{margin:0 0 8px;font-size:40px}.panel p{margin:8px 0 18px;line-height:1.4}.panel button{width:100%;border:0;border-radius:14px;padding:14px 18px;font-size:18px;font-weight:900;background:#ffd54a;color:#172033;box-shadow:0 5px 0 #b98f18}.small{margin-top:12px;font-size:13px;opacity:.85}.hide{display:none}.best{position:absolute;top:max(18px,env(safe-area-inset-top));right:18px;font-weight:900;font-size:14px}</style></head><body><canvas id="game"></canvas><div class="ui"><div id="score" class="top hide">0</div><div id="best" class="best">EN İYİ: 0</div><div id="start" class="panel"><h1>SKY HOP</h1><p>Ekrana dokun, yüksel. Borulara ve yere çarpma.</p><button id="play">OYNA</button><div class="small">Dokun / tıkla / boşluk tuşu</div></div><div id="over" class="panel hide"><h1>OYUN BİTTİ</h1><p>Skor: <b id="finalScore">0</b><br>En iyi: <b id="finalBest">0</b></p><button id="again">TEKRAR OYNA</button></div></div><script>(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),start=document.getElementById('start'),over=document.getElementById('over'),play=document.getElementById('play'),again=document.getElementById('again'),finalScore=document.getElementById('finalScore'),finalBest=document.getElementById('finalBest');let W,H,dpr,bird,pipes,score,best=Number(localStorage.getItem('skyhop_best')||0),running=false,dead=false,last=0,spawn=0,speed=190,gap=175;bestEl.textContent='EN İYİ: '+best;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function reset(){bird={x:W*.27,y:H*.45,vy:0,r:18,rot:0};pipes=[];score=0;spawn=0;speed=Math.max(175,Math.min(235,W*.34));gap=Math.max(150,Math.min(195,H*.22));scoreEl.textContent='0';scoreEl.classList.remove('hide');over.classList.add('hide');dead=false;running=true;last=performance.now()}function flap(){if(!running||dead)return;bird.vy=-390}function addPipe(){const ground=78,margin=74,min=margin,max=H-ground-gap-margin,top=min+Math.random()*Math.max(20,max-min);pipes.push({x:W+50,w:70,top,gap,passed:false})}function hitPipe(p){const br=bird.r*.72;return bird.x+br>p.x&&bird.x-br<p.x+p.w&&(bird.y-br<p.top||bird.y+br>p.top+p.gap)}function end(){if(dead)return;dead=true;running=false;scoreEl.classList.add('hide');if(score>best){best=score;localStorage.setItem('skyhop_best',best)}bestEl.textContent='EN İYİ: '+best;finalScore.textContent=score;finalBest.textContent=best;setTimeout(()=>over.classList.remove('hide'),220)}function update(dt){const ground=78;bird.vy+=1050*dt;bird.y+=bird.vy*dt;bird.rot=Math.max(-.5,Math.min(1.15,bird.vy/520));spawn+=dt;if(spawn>1.45){spawn=0;addPipe()}for(const p of pipes){p.x-=speed*dt;if(!p.passed&&p.x+p.w<bird.x){p.passed=true;score++;scoreEl.textContent=score;speed=Math.min(speed+2.2,275);gap=Math.max(gap-.7,138)}if(hitPipe(p))end()}pipes=pipes.filter(p=>p.x+p.w>-20);if(bird.y+bird.r>=H-ground||bird.y-bird.r<=0)end()}function bg(){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#66c6d3');g.addColorStop(1,'#d8f0d0');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#ffffff55';for(let i=0;i<6;i++){const cx=(i*210+40)%Math.max(W,1),cy=75+(i%3)*62;x.beginPath();x.arc(cx,cy,24,0,Math.PI*2);x.arc(cx+28,cy+3,18,0,Math.PI*2);x.arc(cx-25,cy+7,16,0,Math.PI*2);x.fill()}x.fillStyle='#8fd05c';x.fillRect(0,H-78,W,78);x.fillStyle='#6db343';x.fillRect(0,H-78,W,12);x.fillStyle='#b8874d';for(let yy=H-62;yy<H;yy+=14){for(let xx=0;xx<W;xx+=28){x.fillRect(xx+(yy%28?14:0),yy,18,6)}}}function pipe(p){const grad=x.createLinearGradient(p.x,p.x+p.w,0,0);grad.addColorStop(0,'#3e9d3d');grad.addColorStop(.55,'#76d34c');grad.addColorStop(1,'#2e7b32');x.fillStyle=grad;x.strokeStyle='#245f27';x.lineWidth=3;x.fillRect(p.x,0,p.w,p.top);x.strokeRect(p.x,0,p.w,p.top);x.fillRect(p.x-7,p.top-26,p.w+14,26);x.strokeRect(p.x-7,p.top-26,p.w+14,26);const b=p.top+p.gap;x.fillRect(p.x,b,p.w,H-b-78);x.strokeRect(p.x,b,p.w,H-b-78);x.fillRect(p.x-7,b,p.w+14,26);x.strokeRect(p.x-7,b,p.w+14,26)}function drawBird(){x.save();x.translate(bird.x,bird.y);x.rotate(bird.rot);x.fillStyle='#ffd43b';x.strokeStyle='#8a5b14';x.lineWidth=3;x.beginPath();x.ellipse(0,0,22,17,0,0,Math.PI*2);x.fill();x.stroke();x.fillStyle='#f4a72f';x.beginPath();x.ellipse(-6,6,13,8,-.35,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(9,-6,7,0,Math.PI*2);x.fill();x.fillStyle='#111';x.beginPath();x.arc(12,-6,3,0,Math.PI*2);x.fill();x.fillStyle='#f26d31';x.beginPath();x.moveTo(19,-1);x.lineTo(34,4);x.lineTo(19,8);x.closePath();x.fill();x.restore()}function render(){bg();for(const p of pipes)pipe(p);if(bird)drawBird()}function loop(t){const dt=Math.min((t-last)/1000,.033);last=t;if(running)update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);function startGame(){start.classList.add('hide');reset();flap()}play.onclick=startGame;again.onclick=()=>{reset();flap()};addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;flap()});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!running&&!dead&&start.classList.contains('hide'))reset();flap()}})})();</script></body></html>
