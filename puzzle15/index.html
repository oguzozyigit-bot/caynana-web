<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SLIDE 15</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b0d12;color:#f4f7fb;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}body{display:flex;justify-content:center;padding:18px}.app{width:min(100%,520px)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.brand{font-weight:900;letter-spacing:.16em;font-size:22px}.sub{font-size:12px;color:#9ea8b5}.stats{display:flex;gap:8px}.pill{background:#151923;border:1px solid #252b38;border-radius:14px;padding:8px 11px;text-align:center;min-width:72px}.pill b{display:block;font-size:16px}.pill span{font-size:10px;color:#9ea8b5}.panel{background:#11151d;border:1px solid #252b38;border-radius:26px;padding:14px}.preview{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:1;background:#0f1420}.board{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:3px;padding:3px;background:#0c1017}.tile{border:0;border-radius:10px;position:relative;overflow:hidden;padding:0;background:transparent;cursor:pointer;touch-action:manipulation}.tile:before{content:"";position:absolute;inset:0;background-image:var(--art);background-size:400% 400%;background-position:var(--pos);transition:transform .14s ease,filter .14s ease}.tile:after{content:attr(data-n);position:absolute;right:7px;bottom:6px;background:rgba(0,0,0,.42);color:white;font-weight:900;font-size:11px;border-radius:999px;padding:3px 6px}.tile:active:before{transform:scale(.96);filter:brightness(1.15)}.empty{background:#07090d;border:1px dashed #2a3140}.empty:before,.empty:after{display:none}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.btn{border:1px solid #2a3140;background:#171c26;color:#f5f7fb;border-radius:15px;padding:13px 14px;font-weight:800;font-size:14px}.btn.primary{background:#f2f5f8;color:#0a0d12}.message{margin-top:12px;text-align:center;color:#b8c1cc;font-size:13px;min-height:20px}.win{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,7,11,.72);backdrop-filter:blur(8px);z-index:5;padding:24px}.win.show{display:flex}.card{background:#11151d;border:1px solid #303849;border-radius:22px;padding:22px;width:min(100%,320px);text-align:center}.card h2{margin:0 0 8px;font-size:28px}.card p{color:#aeb8c4}.card button{width:100%;margin-top:8px}</style></head><body><div class="app"><div class="top"><div><div class="brand">SLIDE 15</div><div class="sub">Kaydır • Tamamla • Rekor kır</div></div><div class="stats"><div class="pill"><b id="moves">0</b><span>HAMLE</span></div><div class="pill"><b id="time">00:00</b><span>SÜRE</span></div></div></div><div class="panel"><div class="preview"><div class="board" id="board"></div><div class="win" id="win"><div class="card"><h2>Tamamlandı 🎉</h2><p id="winText"></p><button class="btn primary" id="again">YENİ OYUN</button></div></div></div><div class="controls"><button class="btn primary" id="shuffle">KARIŞTIR</button><button class="btn" id="solve">RESMİ GÖSTER</button></div><div class="message" id="msg">Boşluğun yanındaki kareye dokun.</div></div></div><script>(()=>{const N=4,board=document.getElementById('board'),movesEl=document.getElementById('moves'),timeEl=document.getElementById('time'),msg=document.getElementById('msg'),win=document.getElementById('win'),winText=document.getElementById('winText');const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#43c6ff"/><stop offset="1" stop-color="#b9efff"/></linearGradient></defs><rect width="800" height="800" fill="url(#sky)"/><circle cx="650" cy="130" r="72" fill="#ffd93d"/><g fill="#fff" opacity=".9"><ellipse cx="160" cy="120" rx="95" ry="35"/><ellipse cx="235" cy="135" rx="75" ry="28"/></g><path d="M0 510L150 300l105 135 120-190 155 230 115-150 155 185v290H0z" fill="#7654c7"/><path d="M0 555L145 410l110 115 135-165 135 155 105-105 170 150v240H0z" fill="#3d9b69"/><path d="M0 610 Q180 550 330 625T800 590V800H0z" fill="#22b8cf"/><path d="M0 690 Q180 620 350 700T800 650V800H0z" fill="#1677c8"/><g><rect x="105" y="500" width="180" height="145" rx="5" fill="#ff6b6b"/><polygon points="85,505 195,410 305,505" fill="#e03131"/><rect x="145" y="545" width="45" height="55" fill="#ffd43b"/><rect x="215" y="545" width="45" height="55" fill="#74c0fc"/><rect x="185" y="585" width="45" height="60" fill="#8d5524"/></g><g><rect x="530" y="465" width="150" height="120" fill="#ffa94d"/><polygon points="510,470 605,390 700,470" fill="#9c36b5"/><rect x="555" y="500" width="40" height="45" fill="#69db7c"/><rect x="620" y="500" width="40" height="45" fill="#4dabf7"/></g><g fill="#51cf66"><circle cx="80" cy="570" r="48"/><circle cx="340" cy="555" r="55"/><circle cx="735" cy="540" r="62"/></g><g><path d="M390 660h155l-28 55H418z" fill="#f8f9fa"/><path d="M455 585v78" stroke="#6c757d" stroke-width="10"/><path d="M460 595l70 55h-70z" fill="#ffec99"/><path d="M448 600l-58 48h58z" fill="#ff8787"/></g></svg>`;const art=`url("data:image/svg+xml,${encodeURIComponent(svg)}")`;let state=[],moves=0,startAt=null,timer=null,peek=false;const solved=()=>Array.from({length:15},(_,i)=>i+1).concat(0);const rc=i=>[Math.floor(i/N),i%N];const adjacent=(a,b)=>{const[ar,ac]=rc(a),[br,bc]=rc(b);return Math.abs(ar-br)+Math.abs(ac-bc)===1};function render(){board.innerHTML='';state.forEach((v,i)=>{const el=document.createElement(v?'button':'div');el.className=v?'tile':'tile empty';if(v){const idx=v-1,r=Math.floor(idx/N),c=idx%N;el.style.setProperty('--art',art);el.style.setProperty('--pos',`${c*100/3}% ${r*100/3}%`);el.dataset.n=v;el.addEventListener('click',()=>move(i))}board.appendChild(el)});movesEl.textContent=moves}function move(i){const e=state.indexOf(0);if(!adjacent(i,e)){msg.textContent='Sadece boşluğun yanındaki kare hareket eder.';return}if(!startAt)startTimer();[state[i],state[e]]=[state[e],state[i]];moves++;render();msg.textContent='Güzel. Devam et.';if(state.every((v,i)=>v===solved()[i]))finish()}function shuffle(){state=solved();let e=15,prev=-1;for(let k=0;k<220;k++){const opts=[];for(let i=0;i<16;i++)if(i!==prev&&adjacent(i,e))opts.push(i);const n=opts[Math.floor(Math.random()*opts.length)];[state[e],state[n]]=[state[n],state[e]];prev=e;e=n}moves=0;startAt=null;clearInterval(timer);timeEl.textContent='00:00';win.classList.remove('show');msg.textContent='Boşluğun yanındaki kareye dokun.';render()}function startTimer(){startAt=Date.now();clearInterval(timer);timer=setInterval(()=>{const s=Math.floor((Date.now()-startAt)/1000),m=Math.floor(s/60);timeEl.textContent=`${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`},250)}function finish(){clearInterval(timer);const sec=Math.floor((Date.now()-startAt)/1000);winText.textContent=`${moves} hamle • ${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;win.classList.add('show')}document.getElementById('shuffle').addEventListener('click',shuffle);document.getElementById('again').addEventListener('click',shuffle);document.getElementById('solve').addEventListener('click',()=>{if(peek)return;peek=true;const old=state.slice();state=solved();render();setTimeout(()=>{state=old;render();peek=false},1400)});shuffle()})();</script></body></html>
