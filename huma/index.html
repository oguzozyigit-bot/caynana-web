<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>HÜMA'NIN DOLABI — Uzun Hikâye</title><style>:root{--p:#ff70ad;--p2:#e94b8c;--deep:#75254d;--cream:#fffaf4}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Verdana,'Trebuchet MS',Arial,sans-serif;background:#f5a8cc;color:#57263f}body{overflow:hidden}.game{min-height:100vh;position:relative;overflow:hidden;background:linear-gradient(#8fdff5 0 43%,#f7b6d4 43%);transition:1.5s}.sky{position:absolute;inset:0 0 57%;background-image:radial-gradient(#fff9 1px,transparent 1px);background-size:25px 25px}.sun{position:absolute;right:8%;top:7%;width:86px;height:86px;border-radius:50%;background:#ffe681;box-shadow:0 0 38px #ffe681aa;transition:1s}.hill{position:absolute;left:-8%;right:-8%;height:175px;bottom:44%;background:#9bd58b;border-radius:50% 50% 0 0/80% 80% 0 0;transition:1s}.floor{position:absolute;left:0;right:0;bottom:0;height:45%;background:repeating-linear-gradient(90deg,#f8c5dd 0 38px,#f3b8d4 38px 76px);transition:1s}.room{width:min(1100px,100vw);height:100vh;margin:auto;position:relative}.top{position:absolute;z-index:4;top:17px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:clamp(27px,5vw,52px);font-weight:900;color:#c63e7a;text-shadow:0 3px #fff,0 6px #9a2f60;letter-spacing:-2px}.day{padding:8px 13px;border:3px solid white;border-radius:18px;background:#fff9;font-weight:900;box-shadow:0 4px #ce7098}.wardrobeWrap{position:absolute;left:50%;top:112px;transform:translateX(-50%);width:390px;height:455px}.shadow{position:absolute;left:35px;right:35px;bottom:-20px;height:34px;background:#65214140;border-radius:50%;filter:blur(8px)}.wardrobe{position:absolute;inset:0;background:linear-gradient(#ff9dcc,#ed6ca7);border:12px solid #ffeaf4;border-radius:30px 30px 10px 10px;box-shadow:0 14px #a84170,0 24px 44px #6523413c;display:flex;padding:23px;gap:9px;transition:1.3s}.wardrobe:before{content:'H';position:absolute;left:50%;top:17px;transform:translateX(-50%);width:50px;height:50px;border-radius:50%;background:#fff;border:5px solid #f7bdd7;color:#cb4c86;display:grid;place-items:center;font-weight:900;z-index:3}.door{flex:1;position:relative;border:5px solid #b34a77;border-radius:14px;background:linear-gradient(90deg,#ffadd0,#ff83b5);overflow:hidden;transition:1s}.door:before{content:'';position:absolute;inset:14px;border:2px solid #fff6;border-radius:9px}.knob{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:#fff0a0;border:3px solid #d39c39;z-index:2}.left .knob{right:9px}.right .knob{left:9px}.character{position:absolute;left:5%;bottom:35px;width:280px;text-align:center;z-index:5;transition:1s}.sprite{position:relative;width:220px;height:335px;margin:auto}.hairBack{position:absolute;left:34px;top:0;width:152px;height:160px;border-radius:64px 64px 48px 48px;background:#54364a}.neck{position:absolute;left:96px;top:116px;width:28px;height:35px;background:#efc4ab}.head{position:absolute;left:48px;top:8px;width:124px;height:130px;border-radius:48%;background:#efc4ab;border:5px solid #fff;box-shadow:0 7px #da88a8;z-index:2}.hairFront{position:absolute;left:50px;top:4px;width:120px;height:60px;border-radius:60px 60px 20px 20px;background:#54364a;z-index:4}.bang{position:absolute;top:0;width:43px;height:63px;background:#54364a;border-radius:0 0 30px 30px;z-index:5}.ba{left:58px;transform:rotate(12deg)}.bb{right:58px;transform:rotate(-12deg)}.eye{position:absolute;top:61px;width:13px;height:17px;background:#43283a;border-radius:50%;z-index:6}.eye:after{content:'';position:absolute;width:4px;height:4px;background:#fff;border-radius:50%;left:2px;top:2px}.el{left:79px}.er{right:79px}.mouth{position:absolute;left:99px;top:96px;width:23px;height:10px;border-bottom:3px solid #a44864;border-radius:50%;z-index:6}.torso{position:absolute;left:45px;right:45px;top:137px;height:122px;background:linear-gradient(#fff8fc,#ffd3e6);border:5px solid #fff;border-radius:34px 34px 18px 18px;box-shadow:0 8px #d96999}.skirt{position:absolute;left:30px;right:30px;top:228px;height:72px;background:linear-gradient(#ff8fbc,#ef5d9d);clip-path:polygon(16% 0,84% 0,100% 100%,0 100%);border-radius:10px}.legs{position:absolute;left:59px;right:59px;bottom:0;height:92px;display:flex;justify-content:space-between}.leg{width:34px;background:#efc4ab;border-radius:0 0 17px 17px}.shoe{position:absolute;bottom:-4px;width:57px;height:25px;background:#fff;border:4px solid #d96e9d;border-radius:50% 50% 8px 8px}.sl{left:31px}.sr{right:31px}.bow{position:absolute;left:149px;top:15px;width:52px;height:36px;z-index:7}.bow:before,.bow:after{content:'';position:absolute;width:28px;height:29px;background:#ff6dab;border:4px solid white;border-radius:60% 40% 60% 40%}.bow:after{right:0;transform:scaleX(-1)}.bow:before{left:0}.bow i{position:absolute;left:19px;top:8px;width:15px;height:15px;border-radius:50%;background:#fff0a0;z-index:2}.name{display:inline-block;background:#fff9;border:3px solid white;border-radius:20px;padding:7px 16px;font-weight:900;box-shadow:0 4px #d776a0}.panel{position:absolute;right:4%;bottom:55px;width:min(370px,39vw);z-index:6;background:#fffdfdcc;border:5px solid white;border-radius:27px;padding:18px;box-shadow:0 10px #c45c89,0 18px 40px #6820402d;backdrop-filter:blur(7px)}.panel h3{margin:0 0 12px;font-size:20px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{border:0;border-radius:16px;padding:13px 10px;min-height:52px;background:linear-gradient(var(--p),var(--p2));color:#fff;font-weight:900;box-shadow:0 5px #9e3265;cursor:pointer;transition:.17s}.choice:hover{transform:translateY(-2px)}.choice:active{transform:translateY(4px);box-shadow:0 1px #9e3265}.story{position:absolute;z-index:7;left:50%;bottom:27px;transform:translateX(-50%);width:min(650px,92vw);background:var(--cream);border:4px solid #ff8fbc;border-radius:22px;padding:16px 20px;text-align:center;font-size:16px;line-height:1.48;box-shadow:0 8px #b9537d,0 15px 30px #65213c28;min-height:77px}.progress{position:absolute;left:50%;top:82px;transform:translateX(-50%);z-index:5;width:min(430px,70vw);height:10px;background:#fff7;border:2px solid #fff;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#ff7ab4,#ffe982);transition:.5s}.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;text-align:center;padding:30px;background:linear-gradient(#98e7fa,#ffabd0)}.card{max-width:660px;background:#fffdfddd;border:8px solid white;border-radius:34px;padding:34px;box-shadow:0 15px #b64d7d,0 28px 55px #68203e3b}.card h1{font-size:clamp(42px,8vw,78px);margin:0;color:#c7427f;text-shadow:0 4px white,0 7px #96345f}.start{border:0;border-radius:999px;padding:16px 30px;background:linear-gradient(#ff70ad,#e94b8c);color:#fff;font-size:19px;font-weight:900;box-shadow:0 7px #a23768;cursor:pointer}.ending{display:none;background:#090508;color:#e9d9e1}.ending .card{background:#180f15;border-color:#3d2934;box-shadow:0 14px #000}.static{position:fixed;inset:0;z-index:12;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,#0000 0 3px,#0002 4px 5px);mix-blend-mode:multiply}.vignette{position:fixed;inset:0;z-index:11;pointer-events:none;box-shadow:inset 0 0 0 #000;transition:1.2s}.game.bad1{filter:saturate(.82)}.game.bad1 .sun{opacity:.55}.game.bad2{background:linear-gradient(#676472 0 43%,#826275 43%);filter:saturate(.5) contrast(1.03);color:#e5d5dc}.game.bad2 .sun,.game.bad2 .hill{filter:grayscale(1);opacity:.3}.game.bad2 .floor{background:repeating-linear-gradient(90deg,#806571 0 38px,#715a66 38px 76px)}.game.bad2 .wardrobe{background:#785064;border-color:#9c8993;box-shadow:0 14px #392933}.game.bad2 .door{background:#5e3b4d;border-color:#37252e}.game.bad2 .panel,.game.bad2 .story{background:#ded2d7e8;color:#3b2c34;border-color:#a7929b;box-shadow:0 7px #59414c}.game.bad3{background:linear-gradient(#171318 0 43%,#261720 43%);filter:saturate(.25) contrast(1.15);color:#e9dce2}.game.bad3 .sky,.game.bad3 .sun,.game.bad3 .hill{opacity:0}.game.bad3 .floor{background:repeating-linear-gradient(90deg,#2d1b24 0 38px,#26171f 38px 76px)}.game.bad3 .wardrobe{background:#22141c;border-color:#4b3942;box-shadow:0 14px #070507,0 20px 50px #0008}.game.bad3 .door{background:#140c11;border-color:#070507}.game.bad3 .panel,.game.bad3 .story{background:#1d1419ec;color:#decfd6;border-color:#4b3942;box-shadow:0 7px #080507}.game.bad3 .head{background:#9d877f;border-color:#44343d;box-shadow:0 7px #1d1217}.game.bad3 .hairBack,.game.bad3 .hairFront,.game.bad3 .bang{background:#171015}.game.bad3 .eye{height:7px;top:67px;background:#17080d}.game.bad3 .eye:after{display:none}.game.bad3 .mouth{left:94px;top:98px;width:34px;height:20px;border:0;background:#21070f;border-radius:0 0 50% 50%}.game.bad3 .torso{background:#4a3540;border-color:#372832;box-shadow:0 8px #120b0f}.game.bad3 .skirt{background:#2a1821}.static.on{opacity:.73}.bad2~.vignette{box-shadow:inset 0 0 150px 28px #180a12aa}.bad3~.vignette{box-shadow:inset 0 0 230px 65px #000e}.glitch{animation:gl .1s 9}@keyframes gl{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 4px)) skew(4deg);filter:hue-rotate(30deg)}50%{transform:translateX(calc(-50% + 5px)) skew(-5deg);filter:contrast(2)}75%{transform:translateX(calc(-50% - 2px))}}@media(max-width:760px){body{overflow:auto}.room{height:830px}.wardrobeWrap{top:112px;width:300px;height:365px}.character{left:1%;bottom:184px;transform:scale(.76);transform-origin:bottom left}.panel{right:2%;bottom:194px;width:59vw}.story{bottom:18px}.top{left:10px;right:10px}.logo{font-size:31px}.day{font-size:11px}.progress{top:72px}.sun{width:62px;height:62px}}</style></head><body><div class="overlay" id="intro"><div class="card"><h1>HÜMA'NIN DOLABI</h1><p>Yarın okulun bahar şenliği var. Hüma için kıyafet seç, odasını hazırla ve küçük görevleri tamamla.</p><button class="start" id="start">OYUNA BAŞLA 🌸</button><p style="font-size:12px;opacity:.72">Uzun seçimli hikâye • birden fazla son</p></div></div><main class="game" id="game"><div class="sky"></div><div class="sun"></div><div class="hill"></div><div class="floor"></div><section class="room"><div class="top"><div class="logo" id="logo">HÜMA'NIN DOLABI</div><div class="day" id="day">Bahar Şenliği • Yarın</div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="wardrobeWrap"><div class="shadow"></div><div class="wardrobe" id="wardrobe"><div class="door left"><span class="knob"></span></div><div class="door right"><span class="knob"></span></div></div></div><div class="character"><div class="sprite"><div class="hairBack"></div><div class="neck"></div><div class="head"></div><div class="hairFront"></div><div class="bang ba"></div><div class="bang bb"></div><div class="eye el"></div><div class="eye er"></div><div class="mouth"></div><div class="torso" id="torso"></div><div class="skirt" id="skirt"></div><div class="legs"><div class="leg"></div><div class="leg"></div></div><div class="shoe sl"></div><div class="shoe sr"></div><div class="bow"><i></i></div></div><span class="name">Hüma</span></div><div class="panel"><h3 id="question">Hazır mısın?</h3><div class="choices" id="choices"></div></div><div class="story" id="story">Hüma dolabın önünde bekliyor.</div></section></main><div class="static" id="static"></div><div class="vignette"></div><div class="overlay ending" id="ending"><div class="card"><h1 id="endTitle">SON</h1><p id="endText"></p><button class="start" onclick="location.reload()">TEKRAR OYNA</button></div></div><script>const G=game,C=choices,S=story,Q=question,B=bar,ST=static,D=day,L=logo,T=torso,K=skirt;let step=0,flags={},score=0;const scenes=[{q:'Üstünü seç',s:'Hüma şenlik için heyecanlı. Önce üstünü seçelim.',c:[['Pembe bluz','pink'],['Çiçekli tişört','flower'],['Sarı kazak','yellow']]},{q:'Etek mi pantolon mu?',s:'Aynanın önünde üç seçenek duruyor.',c:[['Pembe etek','skirt'],['Kot pantolon','jeans'],['Renkli şort','short']]},{q:'Ayakkabı',s:'Hüma odada birkaç adım atıp aynaya bakıyor.',c:[['Beyaz spor ayakkabı','sneaker'],['Pembe babet','flat'],['Kısa bot','boot']]},{q:'Saç aksesuarı',s:'Masada kurdeleler ve tokalar var.',c:[['Büyük kurdele','bow'],['Çiçekli toka','clip'],['Hiç takma','none']]},{q:'Çanta seç',s:'Şenlikte yanında küçük bir şeyler taşıması gerekecek.',c:[['Kalpli çanta','heartbag'],['Sarı sırt çantası','backpack'],['Çantasız git','nobag']]},{q:'Odayı hazırla',s:'Hazırlığa ara verip odayı toparlamak iyi fikir.',c:[['Yatağı düzelt','bed'],['Masayı topla','desk'],['Pencereyi aç','window']]},{q:'Müzik seç',s:'Hüma hazırlanırken müzik dinlemek istiyor.',c:[['Neşeli pop','pop'],['Sakin piyano','piano'],['Sessizlik','silent']]},{q:'Şenlik hediyesi',s:'Sınıftan bir arkadaşına küçük bir hediye götürebilir.',c:[['Bileklik yap','bracelet'],['Kart hazırla','card'],['Çiçek götür','giftflower']]},{q:'Fotoğraf zamanı',s:'Kombin neredeyse hazır. Bir fotoğraf çekelim.',c:[['Aynada fotoğraf','mirrorpic'],['Pencere önünde','windowpic'],['Fotoğraf istemiyorum','nopic']]},{q:'Eski kutu',s:'Fotoğraf için dolabın üst rafını düzeltirken eski, tozlu bir kutu görüyorsun.',c:[['Kutuyu indir','box'],['Şimdilik bırak','leavebox']]},{q:'Kutunun kapağı',s:'Kutunun üzerinde solmuş bir etiket var: “Bahar Şenliği — 2009”.',c:[['Aç','openbox'],['Annesine sor','askmom']]},{q:'Eski fotoğraf',s:'İçeride bir fotoğraf var. Hüma’ya çok benzeyen bir kız, aynı dolabın önünde duruyor.',c:[['Fotoğrafı incele','inspect'],['Geri koy','putback']]},{q:'Fotoğrafın arkası',s:'Arkasında tek cümle yazıyor: “En güzel kıyafeti seçtiler. Sonra beni burada bıraktılar.”',c:[['Tarihe bak','date'],['Hüma’ya göster','showhuma']]},{q:'Pembe anahtar',s:'Kutunun altında minik pembe bir anahtar var. Dolaptan çok hafif bir tık sesi geliyor.',c:[['Anahtarı al','key'],['Kutuda bırak','nokey']]},{q:'Normal bir akşam mı?',s:'Bir süre hiçbir şey olmuyor. Hüma yeniden şenlikten konuşmaya başlıyor. Belki de kutu sadece eski bir hatıra.',c:[['Hazırlığa devam et','continue'],['Kutuyu kapat','closebox']]},{q:'Şenlik programı',s:'Saat 19:42. Programı çantaya koyarken kağıtta basım hatası görüyorsun: tarih 17 Mayıs 2009.',c:[['Telefon tarihine bak','phone'],['Programı yırt','tear']]},{q:'Dolaptan ses',s:'Tak... tak... tak... Bu kez net. Ses dolabın içinden geliyor.',c:[['Kapakları aç','opendoor'],['Hüma’yı odadan çıkar','protect']]},{q:'İçerideki boşluk',s:'Kıyafetlerin arkasında duvar olması gerekirken karanlık, dar bir boşluk var.',c:[['Fener tut','flashlight'],['Kapakları kapat','shut']]},{q:'İkinci oda',s:'Boşluğun ardında Hüma’nın odasının aynısı görünüyor; fakat renkleri solmuş ve her şey yıllardır dokunulmamış gibi.',c:[['İçeri gir','enter'],['Seslen','call']]},{q:'Masadaki günlük',s:'Eski odanın masasında pembe kaplı bir günlük var. Kapağında “Hüma” yazıyor.',c:[['Günlüğü aç','diary'],['Önce odayı ara','searchroom']]},{q:'17 Mayıs 2009',s:'“Yarın şenliğe gideceğim. Oyuncu bana en sevdiği kıyafeti seçti. Keşke bana ne istediğimi sorsaydı.”',c:[['Sonraki sayfa','nextpage'],['Günlüğü kapat','closediary']]},{q:'18 Mayıs 2009',s:'“Şenlik hiç başlamadı. Ekran kapandı ama ben burada kaldım. Her açıldığında yeniden giyiniyorum.”',c:[['Devam et','readmore'],['Anahtarı dene','trykey']]},{q:'19 Mayıs 2009',s:'“Biri geri gelirse ona kızmayacağım. Sadece beni hatırlamasını isteyeceğim.”',c:[['Hüma? diye seslen','sayname'],['Sessiz kal','quiet']]},{q:'Aynadaki hareket',s:'Eski odadaki aynada sen ve Hüma görünüyorsunuz. Fakat arkanızda üçüncü biri daha var.',c:[['Arkana bak','turn'],['Aynaya bakmaya devam et','keepmirror']]},{q:'Eski Hüma',s:'Dolabın içinden aynı yüzlü başka bir kız çıkıyor. Elbisesi 2009 fotoğrafındakiyle aynı.',c:[['Konuş','talk'],['Geri çekil','backaway']]},{q:'“Beni kim seçti?”',s:'Eski Hüma sana bakıyor. “Bunca yıl kıyafetlerimi herkes seçti. Bir kere olsun ben seçebilir miyim?”',c:[['Evet, sen seç','letchoose'],['Hayır, çıkmamız gerek','refuse']]},{q:'Son kıyafet',s:'Dolabın içinde iki elbise beliriyor: biri parlak pembe, biri sade beyaz.',c:[['Pembe elbiseyi uzat','givepink'],['Beyaz elbiseyi uzat','givewhite'],['Seçimi ona bırak','herchoice']]},{q:'Kapı kapanıyor',s:'Eski odanın kapısı yavaşça kapanıyor. Günlükte yeni bir satır beliriyor: “Bir kişi çıkabilir.”',c:[['Hüma’yı gönder','sendhuma'],['Eski Hüma’yı gönder','sendold'],['Birlikte çıkmayı dene','together']]},{q:'Dolabın son sorusu',s:'Karanlıkta ekranda sadece iki kelime kalıyor: “HANGİ HÜMA?”',c:[['Şimdiki Hüma','newhuma'],['2009 Hüma','oldhuma'],['İkisi de','both']]},{q:'Son seçim',s:'Dolap kapağı açılıyor. Dışarıda sabah ışığı var. Bir el sana uzanıyor.',c:[['Eli tut','hand'],['Kapıyı kilitle','lock'],['Günlüğü al','takebook']]}];function phase(){let p=step/scenes.length;B.style.width=(p*100)+'%';if(step>=11)G.className='game bad1';if(step>=16)G.className='game bad2';if(step>=21){G.className='game bad3';ST.classList.add('on');D.textContent='17 Mayıs • 2009';L.textContent=step>=27?'HANGİ HÜMA?':'HÜMA’NIN DOLABI'}if(step===23||step===28){S.classList.add('glitch');setTimeout(()=>S.classList.remove('glitch'),900)}}function render(){phase();let x=scenes[step];Q.textContent=x.q;S.textContent=x.s;C.innerHTML='';x.c.forEach(([t,v])=>{let b=document.createElement('button');b.className='choice';b.textContent=t;b.onclick=()=>choose(v);C.appendChild(b)})}function choose(v){flags[v]=1;if(['inspect','date','key','flashlight','diary','readmore','sayname','talk','letchoose','herchoice','together','both','hand','takebook'].includes(v))score++;if(step===0){T.style.background=v==='pink'?'linear-gradient(#fff8fc,#ffd3e6)':v==='flower'?'linear-gradient(#fff8da,#ffd3e6)':'linear-gradient(#fff2a4,#ffd879)'}if(step===1){K.style.background=v==='skirt'?'linear-gradient(#ff8fbc,#ef5d9d)':v==='jeans'?'linear-gradient(#78a8d8,#4f78a7)':'linear-gradient(#ffd36e,#ff9e70)'}if(v==='protect')score+=2;if(v==='refuse')score-=2;if(v==='lock')score-=3;step++;if(step>=scenes.length)return finish();setTimeout(render,170)}function finish(){ending.style.display='grid';let title,text;if(flags.both&&flags.together&&score>=9){title='İKİ HÜMA';text='Elini uzattığında iki el birden tuttu. Dolabın içindeki karanlık çözüldü. Sabah olduğunda odada iki ayrı günlük vardı: biri 2009’da bitiyor, diğeri bugün başlıyordu. Şenlik fotoğrafında iki Hüma yan yana gülümsüyordu. Kimse bunun garip olduğunu fark etmedi.'}else if(flags.oldhuma&&score>=7){title='2009 GERİ DÖNDÜ';text='Kapıdan çıkan kız sessizce güneşe baktı. Yıllardır ilk kez gerçek bir sabah görüyordu. Arkandaki dolap kapanırken şimdiki Hüma’nın sesi içeriden geldi: “Beni de unutma.” Oyun yeniden açıldığında menüde yalnızca HÜMA — 2026 yazıyordu.'}else if(flags.lock||score<4){title='DOLAP KAPANDI';text='Kapıyı kilitledin. Sesler sustu. Şenlik ertesi gün normal geçti. Fakat çekilen her fotoğrafta Hüma’nın arkasında aynı pembe dolap görünüyordu; okul bahçesinde bile. Bir hafta sonra oyunun ana ekranında yeni bir seçenek belirdi: “DEVAM ET — 2009”.'}else{title='HATIRLANDIN';text='Günlüğü alıp kapıdan çıktınız. Sabah dolap sıradan görünüyordu. Son sayfada artık tek bir cümle vardı: “Beni seçmedin. Beni dinledin.” O günden sonra oyun her başladığında ilk soru değişti: “Hüma bugün ne giymek istiyor?”'}endTitle.textContent=title;endText.textContent=text}start.onclick=()=>{intro.style.display='none';render()};</script></body></html>
