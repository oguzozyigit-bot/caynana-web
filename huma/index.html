<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>HÜMA — PEMBE EV</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#12000b;font-family:Arial,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #6b1747;font-weight:800}.top{display:flex;justify-content:space-between;padding:15px 18px;font-size:14px}.msg{position:absolute;top:9%;left:50%;transform:translateX(-50%);padding:9px 16px;border-radius:20px;background:#ff7fbaaa;border:1px solid #fff8;max-width:88%;text-align:center}.cross{position:absolute;left:50%;top:50%;width:8px;height:8px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);opacity:.7}.controls{position:absolute;left:16px;right:16px;bottom:18px;display:flex;justify-content:space-between;align-items:end}.pad{width:142px;height:142px;position:relative;pointer-events:auto}.key{position:absolute;width:48px;height:48px;border:2px solid #fff8;background:#d9368099;color:#fff;border-radius:16px;display:grid;place-items:center;font-size:20px;user-select:none}.up{left:47px;top:0}.down{left:47px;bottom:0}.left{left:0;top:47px}.right{right:0;top:47px}.act{pointer-events:auto;width:86px;height:86px;border-radius:50%;border:2px solid #fff9;background:#ff4d9caa;color:white;font-weight:900}.start,.end{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;background:radial-gradient(circle,#ffe8f4,#ff9fcb 60%,#e64d92);color:#8a2455}.start h1,.end h1{font-size:clamp(38px,9vw,86px);margin:0 0 8px;text-shadow:0 3px #fff}.start p,.end p{max-width:620px;font-size:17px;line-height:1.5}.button{border:0;border-radius:999px;background:#d92f7b;color:#fff;padding:15px 30px;font-size:19px;font-weight:900;box-shadow:0 7px 0 #962052}.end{display:none;background:#090005;color:#ff7db5}.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 3px,#21000e22 4px 5px);opacity:0;transition:opacity 1s}.vignette{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 130px 30px #0000;transition:1s}.bad .scan{opacity:.7}.bad .vignette{box-shadow:inset 0 0 160px 45px #19000dcc}.flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0}.chapter{position:fixed;inset:0;z-index:8;pointer-events:none;display:grid;place-items:center;color:#fff;font-size:clamp(30px,8vw,72px);font-weight:900;text-align:center;text-shadow:0 4px 20px #000;opacity:0;transition:.5s}.small{font-size:12px;opacity:.75}@media(min-width:800px){.controls{opacity:.55}}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="top"><span id="obj">🌸 0 / 24</span><span id="time">00:00</span></div><div class="msg" id="msg">Evin içinde biraz dolaş.</div><div class="cross"></div><div class="controls"><div class="pad"><div class="key up" data-k="w">▲</div><div class="key down" data-k="s">▼</div><div class="key left" data-k="a">◀</div><div class="key right" data-k="d">▶</div></div><button class="act" id="act">DOKUN</button></div></div><div class="scan"></div><div class="vignette"></div><div class="flash" id="flash"></div><div class="chapter" id="chapter"></div><div class="start" id="start"><h1>HÜMA'NIN PEMBE EVİ</h1><p>Bugün yeni evine geldin. Ev biraz büyük ama çok tatlı. Odaları gez, pembe çiçekleri bul ve ışıkları aç. Burada korkacak hiçbir şey yok.</p><button class="button" id="play">EVE GİR</button><p class="small">3D birinci şahıs • WASD / yön tuşları • telefonda ekrandaki tuşlar</p></div><div class="end" id="end"><h1 id="endh">ÇIKTIN MI?</h1><p id="endt"></p><button class="button" onclick="location.reload()">TEKRAR GİR</button></div><script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H,D=1;function rs(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,1.5);cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',rs);rs();
const MAP=["111111111111111111","100000100000000001","101110101111011101","100010100001010001","111010111101010111","100010000101010001","101111110101011101","100000010100000001","101110010111111101","101000000000001001","101011111111101001","100010000000101001","111010111110101101","100010100010100001","101110101010111101","100000001000000001","111111111111111111"];const MW=18,MH=17;
let px=1.7,py=1.7,pa=.15,started=false,t0=0,last=0,flowers=0,stage=0,keys={},shake=0,monster={x:15.5,y:14.5,on:false},won=false,doorOpen=false;const items=[];[[3,1],[5,3],[1,5],[6,7],[3,9],[8,9],[12,9],[16,7],[15,5],[13,3],[16,1],[10,1],[9,5],[11,7],[15,9],[13,11],[9,11],[5,11],[3,13],[1,15],[5,15],[9,15],[13,15],[16,15]].forEach((q,i)=>items.push({x:q[0]+.5,y:q[1]+.5,taken:false,i}));
const wall=(x,y)=>{let X=Math.floor(x),Y=Math.floor(y);if(X<0||Y<0||X>=MW||Y>=MH)return true;return MAP[Y][X]==='1'};function audio(f=440,d=.08,type='sine',v=.03){try{let A=audio.a||(audio.a=new(AudioContext||webkitAudioContext)()),o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(A.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+d);o.stop(A.currentTime+d)}catch(e){}}function noise(d=.2,v=.025){try{let A=audio.a||(audio.a=new(AudioContext||webkitAudioContext)()),b=A.createBuffer(1,A.sampleRate*d,A.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;let s=A.createBufferSource(),g=A.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(A.destination);s.start()}catch(e){}}
function say(s){msg.textContent=s}function chap(s){chapter.textContent=s;chapter.style.opacity=1;setTimeout(()=>chapter.style.opacity=0,1800)}function hit(){flash.style.opacity=.65;setTimeout(()=>flash.style.opacity=0,80);shake=13;noise(.22,.05)}
play.onclick=()=>{start.style.display='none';started=true;t0=performance.now();chap('BÖLÜM 1 — YENİ EV');say('6 pembe çiçek bul. 🌸');audio(660,.15)};
function stageCheck(){let n=flowers;if(stage===0&&n>=6){stage=1;chap('BÖLÜM 2 — IŞIKLAR');say('Elektrikler neden gidip geliyor? 6 çiçek daha bul.');hit()}else if(stage===1&&n>=12){stage=2;document.body.classList.add('bad');chap('BÖLÜM 3 — EV DEĞİŞİYOR');say('Bu koridor daha önce bu kadar uzun değildi.');monster.on=true;hit()}else if(stage===2&&n>=18){stage=3;chap('BÖLÜM 4 — SAKIN ARKANA BAKMA');say('Bir şey seni takip ediyor. Koş.');monster.x=15.5;monster.y=14.5;hit()}else if(stage===3&&n>=23){stage=4;chap('SON BÖLÜM — ÇIKIŞ');say('SON ÇİÇEĞİ BUL. Sonra başlangıç kapısına dön.');hit()}else if(stage===4&&n===24){doorOpen=true;say('KAPI AÇILDI. Başladığın yere geri dön!');audio(110,.8,'sawtooth',.06)}}
function cast(){let sky=stage<1?'#f9b9d8':stage<2?'#c76d99':stage<3?'#43152d':'#13050d',floor=stage<1?'#f5d2e3':stage<2?'#9b5576':stage<3?'#35111f':'#0d0509';ctx.fillStyle=sky;ctx.fillRect(0,0,W,H/2);ctx.fillStyle=floor;ctx.fillRect(0,H/2,W,H/2);let fov=Math.PI/3,cols=Math.min(W,520),cw=W/cols;for(let i=0;i<cols;i++){let a=pa-fov/2+(i/cols)*fov,dx=Math.cos(a),dy=Math.sin(a),dist=.02,side=0;while(dist<20){let xx=px+dx*dist,yy=py+dy*dist;if(wall(xx,yy)){let fx=xx-Math.floor(xx),fy=yy-Math.floor(yy);side=(fx<.04||fx>.96)?1:0;break}dist+=.025}let cd=dist*Math.cos(a-pa),hh=Math.min(H*1.6,H/cd),y=(H-hh)/2;let shade=Math.max(18,100-cd*7),r=stage<2?255:stage===2?150:80,g=stage<2?105:25,b=stage<2?170:60;if(side){r*=.82;g*=.82;b*=.82}ctx.fillStyle=`rgb(${r*shade/100},${g*shade/100},${b*shade/100})`;ctx.fillRect(i*cw,y,cw+1,hh);if(stage<2&&cd<5){ctx.fillStyle='#ffffff10';ctx.fillRect(i*cw,y,cw+1,hh*.08)}}}
function sprite(sx,sy,kind){let dx=sx-px,dy=sy-py,d=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)-pa;while(ang>Math.PI)ang-=Math.PI*2;while(ang<-Math.PI)ang+=Math.PI*2;if(Math.abs(ang)>Math.PI/2)return;let screen=W/2+Math.tan(ang)*W/(2*Math.tan(Math.PI/6)),size=Math.min(H*.8,H/d)*(kind==='monster'?1.4:.35),base=H/2+size*.55;let oc=false;for(let q=.1;q<d-.15;q+=.12)if(wall(px+dx/d*q,py+dy/d*q)){oc=true;break}if(oc)return;ctx.save();ctx.translate(screen,base);if(kind==='flower'){ctx.fillStyle=stage<3?'#fff0a8':'#ff4b8c';ctx.shadowBlur=18;ctx.shadowColor='#ff78b5';for(let j=0;j<5;j++){ctx.rotate(Math.PI*2/5);ctx.beginPath();ctx.ellipse(0,-size*.22,size*.12,size*.23,0,0,7);ctx.fill()}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,size*.09,0,7);ctx.fill()}else{ctx.globalAlpha=Math.min(.95,.35+stage*.15);ctx.fillStyle='#080005';ctx.beginPath();ctx.ellipse(0,-size*.48,size*.18,size*.23,0,0,7);ctx.fill();ctx.fillRect(-size*.14,-size*.3,size*.28,size*.62);ctx.fillStyle='#ff5a96';ctx.beginPath();ctx.arc(-size*.065,-size*.51,size*.018,0,7);ctx.arc(size*.065,-size*.51,size*.018,0,7);ctx.fill()}ctx.restore()}
items.forEach(it=>{if(!it.taken)sprite(it.x,it.y,'flower')});if(monster.on)sprite(monster.x,monster.y,'monster');}
function update(dt,t){let speed=stage>=3?2.5:2.05,turn=2.1;if(keys.a)pa-=turn*dt;if(keys.d)pa+=turn*dt;let mv=(keys.w?1:0)-(keys.s?1:0),nx=px+Math.cos(pa)*mv*speed*dt,ny=py+Math.sin(pa)*mv*speed*dt;if(!wall(nx,py))px=nx;if(!wall(px,ny))py=ny;for(let it of items)if(!it.taken&&Math.hypot(px-it.x,py-it.y)<.55){it.taken=true;flowers++;obj.textContent='🌸 '+flowers+' / 24';audio(stage<2?720:180+flowers*5,.1,stage<2?'sine':'sawtooth',.035);stageCheck()}
if(monster.on&&stage>=2){let dx=px-monster.x,dy=py-monster.y,d=Math.hypot(dx,dy),ms=stage===2?.18:stage===3?.38:.5;if(d<9){let mx=monster.x+dx/d*ms*dt,my=monster.y+dy/d*ms*dt;if(!wall(mx,monster.y))monster.x=mx;if(!wall(monster.x,my))monster.y=my}if(d<.65){hit();say('YAKALADI. Gözlerini kapat...');px=stage<4?8.5:1.7;py=stage<4?9.5:1.7;monster.x=15.5;monster.y=14.5}}
if(doorOpen&&Math.hypot(px-1.7,py-1.7)<.7){won=true;end.style.display='flex';endt.textContent='Pembe evden çıktın. 24 çiçeği de buldun. Ama kapı kapanmadan önce içeriden birinin “Hüma...” dediğini duydun.';noise(.8,.04)}if(stage>=2&&Math.random()<dt*.07){flash.style.background='#2a0014';flash.style.opacity=.45;setTimeout(()=>flash.style.opacity=0,50)}time.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0')}
function loop(now){let dt=Math.min(.035,(now-last)/1000||0);last=now,t=started?(now-t0)/1000:0;ctx.save();if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);cast();ctx.restore();if(started&&!won)update(dt,t);shake*=.9;requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(e.key==='ArrowUp')k='w';if(e.key==='ArrowDown')k='s';if(e.key==='ArrowLeft')k='a';if(e.key==='ArrowRight')k='d';keys[k]=true;e.preventDefault()});addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(e.key==='ArrowUp')k='w';if(e.key==='ArrowDown')k='s';if(e.key==='ArrowLeft')k='a';if(e.key==='ArrowRight')k='d';keys[k]=false});document.querySelectorAll('.key').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[k]=true};b.onpointerup=b.onpointercancel=b.onpointerleave=e=>{e.preventDefault();keys[k]=false}});act.onpointerdown=e=>{e.preventDefault();if(stage===0)say('Her şey çok tatlı görünüyor.');else if(stage===1)say('Üst katta biri yürüyor gibi... ama üst kat yok.');else if(stage===2){say('Duvarın arkasından nefes sesi geliyor.');noise(.25,.04)}else if(stage===3){say('DOKUNMA. O da sana dokunabilir.');hit()}else say(doorOpen?'ÇIKIŞA KOŞ!':'Son çiçek yakınlarda. O da yakınlarda.')};
</script></body></html>
