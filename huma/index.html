<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>HÜMA'NIN DOLABI</title><style>:root{--pink:#ff79b6;--deep:#74264d;--cream:#fff7fb;--ink:#5b2844}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Verdana,'Trebuchet MS',Arial,sans-serif;background:#f6a8cd;color:var(--ink)}body{overflow:hidden}.game{min-height:100vh;position:relative;overflow:hidden;background:linear-gradient(#8eddf5 0 43%,#f8b7d4 43% 100%);transition:background 1.8s,filter 1.8s,color 1.8s}.skyDots{position:absolute;inset:0 0 57% 0;background-image:radial-gradient(#ffffff99 1px,transparent 1px);background-size:24px 24px;opacity:.45}.sun{position:absolute;width:90px;height:90px;border-radius:50%;background:#ffe984;right:8%;top:7%;box-shadow:0 0 40px #ffe984aa}.hill{position:absolute;left:-5%;right:-5%;height:180px;bottom:45%;background:#9ddb8d;border-radius:50% 50% 0 0/80% 80% 0 0}.floor{position:absolute;left:0;right:0;bottom:0;height:45%;background:repeating-linear-gradient(90deg,#f7c6dd 0 36px,#f4bad5 36px 72px)}.room{width:min(1080px,100vw);height:100vh;margin:auto;position:relative}.topbar{position:absolute;left:24px;right:24px;top:18px;display:flex;justify-content:space-between;align-items:center;z-index:3}.logo{font-size:clamp(28px,5vw,54px);font-weight:900;letter-spacing:-2px;color:#c5417e;text-shadow:0 3px #fff,0 6px 0 #9e2f63}.day{background:#fff9;border:3px solid #fff;padding:8px 14px;border-radius:18px;font-weight:900;box-shadow:0 4px 0 #ce6d97}.wardrobeWrap{position:absolute;left:50%;top:112px;transform:translateX(-50%);width:390px;height:455px}.wardrobeShadow{position:absolute;left:30px;right:30px;bottom:-20px;height:35px;background:#7a2e5540;border-radius:50%;filter:blur(8px)}.wardrobe{position:absolute;inset:0;background:linear-gradient(180deg,#ff9dcc,#ed6ca7);border:12px solid #ffe8f4;border-radius:30px 30px 10px 10px;box-shadow:0 14px 0 #a84070,0 24px 45px #6b21483d;display:flex;padding:22px;gap:8px;transition:1.4s}.wardrobe:before{content:'H';position:absolute;left:50%;top:18px;transform:translateX(-50%);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#cf4e88;font-weight:900;border:5px solid #f6bad6;z-index:2}.door{flex:1;border:5px solid #b54a78;border-radius:14px;background:linear-gradient(90deg,#ffaed1,#ff83b5);position:relative;overflow:hidden}.door:before{content:'';position:absolute;inset:15px;border:2px solid #ffffff55;border-radius:10px}.knob{position:absolute;top:50%;width:13px;height:13px;background:#fff1a0;border:3px solid #d49c36;border-radius:50%;z-index:2}.door.left .knob{right:10px}.door.right .knob{left:10px}.shelf{position:absolute;left:50%;top:95px;transform:translateX(-50%);width:230px;height:14px;background:#fff4f9;border-radius:10px;box-shadow:0 4px 0 #be5d87}.character{position:absolute;left:5%;bottom:36px;width:270px;text-align:center;z-index:3;transition:1.2s}.sprite{position:relative;width:210px;height:330px;margin:auto}.legs{position:absolute;left:55px;right:55px;bottom:0;height:94px;display:flex;justify-content:space-between}.leg{width:34px;background:#f1c6ac;border-radius:0 0 18px 18px}.shoe{position:absolute;bottom:-5px;width:58px;height:25px;border-radius:50% 50% 8px 8px;background:#fff;border:4px solid #d8719f}.shoe.l{left:28px}.shoe.r{right:28px}.torso{position:absolute;left:42px;right:42px;top:134px;height:120px;background:linear-gradient(#fff8fc,#ffd4e6);border:5px solid #fff;border-radius:34px 34px 18px 18px;box-shadow:0 8px 0 #d9699a}.skirt{position:absolute;left:28px;right:28px;top:225px;height:72px;background:linear-gradient(#ff8fbd,#ef5e9e);clip-path:polygon(16% 0,84% 0,100% 100%,0 100%);border-radius:10px}.neck{position:absolute;left:91px;top:112px;width:28px;height:32px;background:#f1c6ac}.head{position:absolute;left:45px;top:8px;width:120px;height:126px;background:#f1c6ac;border-radius:48% 48% 45% 45%;border:5px solid #fff;box-shadow:0 7px 0 #dc89a9}.hairBack{position:absolute;left:33px;top:0;width:144px;height:150px;background:#54374a;border-radius:62px 62px 48px 48px}.hairFront{position:absolute;left:48px;top:5px;width:114px;height:58px;background:#54374a;border-radius:60px 60px 20px 20px;z-index:3}.bang{position:absolute;top:0;width:42px;height:62px;background:#54374a;border-radius:0 0 30px 30px;z-index:4}.bang.a{left:54px;transform:rotate(12deg)}.bang.b{right:54px;transform:rotate(-12deg)}.face{position:absolute;left:45px;top:8px;width:120px;height:126px;z-index:5}.eye{position:absolute;top:59px;width:13px;height:17px;background:#43283a;border-radius:50%;box-shadow:inset 0 -4px #24121f}.eye:after{content:'';position:absolute;width:4px;height:4px;background:#fff;border-radius:50%;left:2px;top:2px}.eye.l{left:31px}.eye.r{right:31px}.cheek{position:absolute;top:81px;width:19px;height:8px;background:#eb91a9;border-radius:50%;opacity:.7}.cheek.l{left:18px}.cheek.r{right:18px}.mouth{position:absolute;left:49px;top:87px;width:22px;height:10px;border-bottom:3px solid #a54a65;border-radius:50%}.bow{position:absolute;left:142px;top:14px;width:52px;height:38px;z-index:6}.bow:before,.bow:after{content:'';position:absolute;width:28px;height:30px;background:#ff6fab;border:4px solid #fff;border-radius:60% 40% 60% 40%}.bow:before{left:0;transform:rotate(18deg)}.bow:after{right:0;transform:scaleX(-1) rotate(18deg)}.bow i{position:absolute;left:19px;top:9px;width:16px;height:16px;background:#fff0a2;border-radius:50%;z-index:2}.name{display:inline-block;margin-top:8px;background:#fff9;border:3px solid #fff;padding:7px 16px;border-radius:20px;font-weight:900;box-shadow:0 4px 0 #d878a2}.panel{position:absolute;right:4%;bottom:50px;width:min(360px,38vw);background:#fffdfdcc;border:5px solid #fff;border-radius:26px;padding:18px;box-shadow:0 10px 0 #c45d8a,0 18px 40px #7b2b4c33;z-index:4;backdrop-filter:blur(8px)}.panel h3{margin:0 0 12px;font-size:20px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{border:0;border-radius:16px;padding:13px 10px;background:linear-gradient(#ff79b7,#eb4e92);color:#fff;font-weight:900;box-shadow:0 5px 0 #a33267;cursor:pointer;transition:.18s;min-height:50px}.choice:hover{transform:translateY(-2px)}.choice:active{transform:translateY(4px);box-shadow:0 1px 0 #a33267}.story{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:min(620px,92vw);background:#fffaf4;border:4px solid #ff8fbd;border-radius:22px;padding:16px 20px;text-align:center;font-size:17px;line-height:1.45;box-shadow:0 8px 0 #b9537d,0 15px 30px #66213c2c;z-index:5}.story:before{content:'✦';position:absolute;left:14px;top:10px;color:#ff70aa}.story:after{content:'✦';position:absolute;right:14px;bottom:10px;color:#ff70aa}.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;text-align:center;padding:30px;background:linear-gradient(180deg,#9eeaff,#ffacd2)}.card{max-width:640px;background:#fffdfdcc;border:8px solid #fff;border-radius:34px;padding:34px;box-shadow:0 15px 0 #b64d7d,0 28px 55px #6e24443d}.card h1{font-size:clamp(42px,8vw,78px);margin:0;color:#c7447f;text-shadow:0 4px #fff,0 7px 0 #96345f}.start{border:0;border-radius:999px;padding:16px 30px;background:linear-gradient(#ff6fae,#e84f91);color:#fff;font-size:19px;font-weight:900;box-shadow:0 7px 0 #a33768;cursor:pointer}.ending{display:none;background:#080508;color:#ead5df}.ending .card{background:#170f15;border-color:#3d2934;box-shadow:0 14px 0 #000}.game.bad1{filter:saturate(.72) contrast(.96)}.game.bad1 .sun{opacity:.45}.game.bad1 .logo{color:#9e5578}.game.bad2{background:linear-gradient(#5b5968 0 43%,#745366 43% 100%);filter:saturate(.48) contrast(1.04);color:#e5d4dc}.game.bad2 .floor{background:repeating-linear-gradient(90deg,#7e6270 0 36px,#715967 36px 72px)}.game.bad2 .hill,.game.bad2 .sun{filter:grayscale(1);opacity:.28}.game.bad2 .wardrobe{background:#754c61;border-color:#9b8792;box-shadow:0 14px 0 #382831}.game.bad2 .door{background:#5c394b;border-color:#35232c}.game.bad2 .panel,.game.bad2 .story{background:#d9cdd2dd;color:#3d2c34;border-color:#a58b98;box-shadow:0 7px 0 #59404c}.game.bad3{background:linear-gradient(#171318 0 43%,#24151e 43% 100%);filter:saturate(.3) contrast(1.15);color:#e8dce2}.game.bad3 .skyDots,.game.bad3 .sun,.game.bad3 .hill{opacity:0}.game.bad3 .floor{background:repeating-linear-gradient(90deg,#2e1c25 0 36px,#271820 36px 72px)}.game.bad3 .wardrobe{background:#21131b;border-color:#4b3942;box-shadow:0 14px 0 #070507,0 20px 50px #0008}.game.bad3 .door{background:#140c11;border-color:#070507}.game.bad3 .logo{color:#a07a8d;text-shadow:0 3px #1b1117}.game.bad3 .panel,.game.bad3 .story{background:#1c1318e8;color:#dacbd2;border-color:#4b3942;box-shadow:0 7px 0 #080507}.game.bad3 .head{background:#9f887f;border-color:#44343d;box-shadow:0 7px 0 #1c1217}.game.bad3 .hairBack,.game.bad3 .hairFront,.game.bad3 .bang{background:#171015}.game.bad3 .eye{height:7px;top:65px;background:#17080d;box-shadow:none}.game.bad3 .eye:after,.game.bad3 .cheek{display:none}.game.bad3 .mouth{top:89px;left:44px;width:32px;height:20px;border:0;background:#21070f;border-radius:0 0 50% 50%}.game.bad3 .torso{background:#4a3540;border-color:#372832;box-shadow:0 8px 0 #120b0f}.game.bad3 .skirt{background:#2a1821}.static{pointer-events:none;position:fixed;inset:0;z-index:8;opacity:0;background:repeating-linear-gradient(0deg,#0000 0 3px,#00000022 4px 5px);mix-blend-mode:multiply}.static.on{opacity:.72}.vignette{pointer-events:none;position:fixed;inset:0;z-index:7;box-shadow:inset 0 0 0 #000;transition:1.3s}.bad2~.vignette{box-shadow:inset 0 0 140px 25px #1b0b14aa}.bad3~.vignette{box-shadow:inset 0 0 220px 60px #000d}.glitch{animation:gl .11s 8}@keyframes gl{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 4px)) skew(4deg);filter:hue-rotate(30deg)}50%{transform:translateX(calc(-50% + 5px)) skew(-5deg);filter:contrast(2)}75%{transform:translateX(calc(-50% - 2px))}}.blink{animation:blink .18s 3}@keyframes blink{50%{opacity:.15}}@media(max-width:760px){body{overflow:auto}.room{height:820px}.wardrobeWrap{top:115px;width:300px;height:365px}.character{left:1%;bottom:180px;transform:scale(.78);transform-origin:bottom left}.panel{right:2%;bottom:190px;width:58vw}.story{bottom:20px}.topbar{left:10px;right:10px}.logo{font-size:32px}.day{font-size:12px}.sun{width:65px;height:65px}}</style></head><body><div class="overlay" id="intro"><div class="card"><h1>HÜMA'NIN DOLABI</h1><p>Yarın okulun bahar şenliği var. Hüma için en güzel kombini hazırlayalım.</p><button class="start" id="start">OYUNA BAŞLA 🌸</button><p style="font-size:12px;opacity:.72">Sevimli bir giydirme oyunu • seçimli hikâye</p></div></div><main class="game" id="game"><div class="skyDots"></div><div class="sun"></div><div class="hill"></div><div class="floor"></div><section class="room"><div class="topbar"><div class="logo" id="logo">HÜMA'NIN DOLABI</div><div class="day" id="day">Bahar Şenliği • Yarın</div></div><div class="wardrobeWrap"><div class="wardrobeShadow"></div><div class="wardrobe" id="wardrobe"><div class="shelf"></div><div class="door left"><span class="knob"></span></div><div class="door right"><span class="knob"></span></div></div></div><div class="character"><div class="sprite"><div class="hairBack"></div><div class="legs"><div class="leg"></div><div class="leg"></div></div><div class="shoe l"></div><div class="shoe r"></div><div class="torso" id="torso"></div><div class="skirt" id="skirt"></div><div class="neck"></div><div class="head"></div><div class="hairFront"></div><div class="bang a"></div><div class="bang b"></div><div class="face"><i class="eye l"></i><i class="eye r"></i><i class="cheek l"></i><i class="cheek r"></i><i class="mouth"></i></div><div class="bow"><i></i></div></div><span class="name">Hüma</span></div><div class="panel"><h3 id="question">Bugün ne giyelim?</h3><div class="choices" id="choices"></div></div><div class="story" id="story">Hüma dolabın önünde heyecanla bekliyor.</div></section></main><div class="static" id="static"></div><div class="vignette"></div><div class="overlay ending" id="ending"><div class="card"><h1 id="endTitle">SON</h1><p id="endText"></p><button class="start" onclick="location.reload()">TEKRAR OYNA</button></div></div><script>const G=document.getElementById('game'),C=document.getElementById('choices'),S=document.getElementById('story'),Q=document.getElementById('question'),ST=document.getElementById('static'),torso=document.getElementById('torso'),skirt=document.getElementById('skirt'),day=document.getElementById('day'),logo=document.getElementById('logo');let step=0,flags={};const scenes=[{q:'Üstünü seç',s:'Hüma dolabın önünde heyecanla bekliyor. Şenlik için ilk parçayı seçelim.',c:[['Pembe bluz','pink'],['Çiçekli tişört','flower'],['Sarı kazak','yellow']]},{q:'Altını seç',s:'Harika görünüyor. Şimdi eteğini ya da pantolonunu seç.',c:[['Pembe etek','skirt'],['Kot pantolon','jean'],['Renkli şort','short']]},{q:'Ayakkabı seç',s:'Hüma aynaya bakıp gülümsüyor. Son dokunuş: ayakkabılar.',c:[['Spor ayakkabı','shoe'],['Bot','boot'],['Babet','flat']]},{q:'Aksesuar seç',s:'Dolabın en üst rafında küçük, eski bir kutu fark ediyorsun. Üzerinde sadece “H.” yazıyor.',c:[['Çanta al','bag'],['Kutuyu aç','box']]},{q:'Kutunun içinde...',s:'Eski bir fotoğraf ve küçük pembe bir anahtar var. Fotoğraftaki kız Hüma’ya fazlasıyla benziyor.',c:[['Anahtarı al','key'],['Fotoğrafa bak','photo']]},{q:'Fotoğrafın arkası',s:'Kurşun kalemle tek bir tarih yazıyor: “17 Mayıs 2009 — Hüma’nın son şenliği.”',c:[['Anneye sor','ask'],['Dolabı araştır','search']]},{q:'Tak... tak... tak...',s:'Ses dolabın içinden geliyor. Odanın renkleri sanki bir anda biraz soldu.',c:[['Dolabı aç','open'],['Odadan çık','leave']]},{q:'Kıyafetlerin arkasında',s:'Dolabın arka panelinde ince bir kapı çizgisi belirdi. Pembe anahtar kilide tam oturuyor.',c:[['Kapıyı aç','unlock'],['Anahtarı at','throw']]},{q:'Aynı oda',s:'Kapının ardında Hüma’nın odasının aynısı var. Ama terk edilmiş, eski ve sessiz. Masada bir günlük duruyor.',c:[['Günlüğü oku','diary'],['Geri dön','back']]},{q:'Günlük',s:'“Bugün yine beni seçtiler. Saçımı, elbisemi, ayakkabımı... Kimse bana ne istediğimi sormuyor. Oyun kapanınca burada yalnız kalıyorum.”',c:[['Devamını oku','read'],['Oyunu kapat','quit']]},{q:'Son sayfa',s:'Mürekkep kendi kendine yayılıyor. Yeni bir cümle beliriyor: “Şimdi sıra sende, Hüma.”',c:[['ARKANA BAKMA','dont'],['Dolaba bak','look']]},{q:'Kapak açılıyor',s:'Ekrandaki Hüma sana bakmayı bıraktı. Bakışları dolaba çevrildi. İçeriden biri nefes alıyor.',c:[['SAKLAN','hide'],['KOŞ','run']]},{q:'Son seçim',s:'Dolaptan aynı kıyafetleri giymiş başka bir kız çıkıyor. Yüzü karanlıkta. “Ben de Hüma’ydım,” diyor.',c:[['Elini tut','hand'],['Kapıyı kilitle','lock']]}];function tone(f=440,d=.08,type='sine',v=.025){try{const A=tone.a||(tone.a=new(AudioContext||webkitAudioContext)()),o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(A.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+d);o.stop(A.currentTime+d)}catch(e){}}function render(){const x=scenes[step];Q.textContent=x.q;S.textContent=x.s;C.innerHTML='';x.c.forEach(([t,v])=>{const b=document.createElement('button');b.className='choice';b.textContent=t;b.onclick=()=>choose(v);C.appendChild(b)});if(step>=4){G.className='game bad1';day.textContent='Bahar Şenliği • ?'}if(step>=6){G.className='game bad2';day.textContent='17 Mayıs 2009';tone(83,.22,'triangle',.03)}if(step>=8){G.className='game bad3';ST.classList.add('on');day.textContent='YARIN GELMEDİ';logo.textContent=step>=10?'HÜMA’NIN DOLABI SENİ HATIRLIYOR':'HÜMA’NIN DOLABI'}if(step===10){S.classList.add('glitch');setTimeout(()=>S.classList.remove('glitch'),1000)}if(step===11){document.querySelector('.character').classList.add('blink')}}function choose(v){flags[v]=1;tone(step<4?620:step<7?260:95,.08,step<7?'sine':'square',.025);if(step===0){torso.style.background=v==='pink'?'linear-gradient(#ffe6f2,#ff9fc8)':v==='flower'?'linear-gradient(#fff9d8,#fff0a0)':'linear-gradient(#ffeaa3,#ffc85d)'}if(step===1){skirt.style.background=v==='skirt'?'linear-gradient(#ff8fbd,#ef5e9e)':v==='jean'?'linear-gradient(#7fb2e3,#4d78aa)':'linear-gradient(#f8cc75,#e99b52)'}if(v==='leave'){S.textContent='Kapıyı açıyorsun. Koridor yok. Sadece aynı oda tekrar başlıyor.'}if(v==='quit'){S.textContent='Kapat düğmesi çalışmıyor.'}step++;if(step>=scenes.length)return finish(v);setTimeout(render,230)}function finish(v){document.getElementById('ending').style.display='grid';const good=flags.hand&&!flags.lock;document.getElementById('endTitle').textContent=good?'HÜMA’YI HATIRLADIN':'OYUN KAPANDI';document.getElementById('endText').textContent=good?'Kız elini tuttuğunda oda bir anlığına eski renklerine döndü. Günlüğün son cümlesi silindi. “Ben bir karakter değilim,” dedi. Ertesi sabah dolap normaldi. Ama oyun menüsünde artık iki isim vardı: HÜMA ve HÜMA-2009.':'Kapıyı kilitledin. Ses kesildi. Ertesi sabah her şey normal görünüyordu. Fakat şenlik fotoğrafını akşam açtığında Hüma’nın hemen arkasında, dolaptaki kız duruyordu.'}document.getElementById('start').onclick=()=>{document.getElementById('intro').style.display='none';render();tone(660,.14,'sine',.03)};</script></body></html>
