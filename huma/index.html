<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>HÜMA'NIN DOLABI</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Trebuchet MS',Arial,sans-serif;background:#ffb9db;color:#6e2851}body{overflow-x:hidden}.game{min-height:100vh;background:linear-gradient(#9ee8ff 0 45%,#ffd2e7 45%);transition:1.4s;position:relative;overflow:hidden}.game.bad1{filter:saturate(.72)}.game.bad2{background:linear-gradient(#5d536a 0 45%,#8d5d76 45%);filter:saturate(.55)}.game.bad3{background:linear-gradient(#18131c 0 45%,#2c1723 45%);color:#ead5df}.cloud{position:absolute;background:#fff;border-radius:60px;width:150px;height:45px;opacity:.8}.c1{top:8%;left:6%}.c2{top:15%;right:8%;transform:scale(.7)}.room{width:min(980px,96vw);height:620px;margin:auto;position:relative;padding-top:38px}.title{text-align:center;font-size:clamp(30px,7vw,60px);margin:0;text-shadow:3px 3px #fff;font-weight:900}.subtitle{text-align:center;font-size:15px}.wardrobe{position:absolute;left:50%;top:150px;transform:translateX(-50%);width:330px;height:390px;background:#f582b7;border:12px solid #fff0f7;border-radius:24px 24px 8px 8px;box-shadow:0 14px 0 #b34b7c,0 20px 30px #7e31564a;display:flex;padding:22px;gap:8px;transition:1s}.door{flex:1;border:5px solid #b84f7d;border-radius:12px;background:linear-gradient(90deg,#ff9fc8,#ff78ae);position:relative}.door:after{content:'♥';position:absolute;top:48%;font-size:26px;color:#fff}.door:first-child:after{right:9px}.door:last-child:after{left:9px}.character{position:absolute;left:7%;bottom:38px;width:210px;text-align:center;transition:.8s}.head{width:118px;height:118px;background:#ffd8bd;border-radius:50%;margin:auto;position:relative;border:5px solid #fff}.hair{position:absolute;inset:-10px -8px 45px;background:#6b3a5a;border-radius:60px 60px 20px 20px}.eyes{position:absolute;top:56px;left:29px;right:29px;display:flex;justify-content:space-between}.eye{width:10px;height:14px;background:#542c46;border-radius:50%}.mouth{position:absolute;top:82px;left:49px;width:20px;height:8px;border-bottom:3px solid #c35a77;border-radius:50%}.body{width:145px;height:150px;margin:-8px auto 0;background:#fff0f8;border:5px solid #fff;border-radius:35px 35px 10px 10px;display:grid;place-items:center;font-size:52px}.name{background:#fff9;padding:5px 12px;border-radius:20px;display:inline-block;font-weight:900}.panel{position:absolute;right:3%;bottom:35px;width:min(330px,42vw);background:#fff9;border:5px solid #fff;border-radius:24px;padding:16px;box-shadow:0 8px 0 #c86491}.panel h3{margin:0 0 10px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice,.next{border:0;border-radius:14px;padding:12px;background:#ff67a6;color:white;font-weight:900;box-shadow:0 4px 0 #a93a6c;cursor:pointer}.choice:active,.next:active{transform:translateY(3px);box-shadow:0 1px 0 #a93a6c}.story{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(570px,90vw);background:#fffdf5;border:4px solid #ff8fbd;border-radius:18px;padding:13px 18px;text-align:center;font-size:16px;line-height:1.35;box-shadow:0 7px 0 #b9537d;z-index:4}.glitch{animation:gl .15s 5}@keyframes gl{50%{transform:translateX(-50%) skew(5deg);filter:contrast(2)}}.bad2 .wardrobe{background:#8d526d;border-color:#b5a1ac;box-shadow:0 14px 0 #3e2833}.bad2 .door{background:#714055;border-color:#3e2632}.bad3 .wardrobe{background:#23141d;border-color:#51404a;box-shadow:0 14px 0 #090609}.bad3 .door{background:#160d12;border-color:#070507}.bad3 .cloud{display:none}.bad3 .head{background:#a88e86;border-color:#44343d}.bad3 .hair{background:#1a1217}.bad3 .eye{height:5px;background:#1a0a10}.bad3 .mouth{width:30px;height:18px;left:44px;border:0;background:#260812;border-radius:0 0 50% 50%}.bad3 .body{background:#4b3541;border-color:#392831}.overlay{position:fixed;inset:0;z-index:20;background:linear-gradient(#ffb4d7,#ff76ac);display:grid;place-items:center;text-align:center;padding:30px}.card{max-width:600px;background:#fff9;border:7px solid #fff;border-radius:30px;padding:28px;box-shadow:0 12px 0 #b44a78}.card h1{font-size:clamp(38px,9vw,75px);margin:0}.start{border:0;border-radius:999px;padding:15px 28px;background:#ef4d91;color:#fff;font-size:19px;font-weight:900}.ending{display:none;background:#080508;color:#ead5df}.ending .card{background:#170e14;border-color:#39252f;box-shadow:0 12px 0 #000}.static{pointer-events:none;position:fixed;inset:0;z-index:8;opacity:0;background:repeating-linear-gradient(0deg,#0000 0 3px,#0002 4px 5px)}.bad3~.static,.static.on{opacity:.7}@media(max-width:700px){.room{height:760px}.wardrobe{top:130px;width:280px;height:340px}.character{left:2%;bottom:155px;transform:scale(.72);transform-origin:bottom left}.panel{right:2%;bottom:160px;width:55vw}.story{bottom:15px}.title{font-size:34px}}</style></head><body><div class="overlay" id="intro"><div class="card"><h1>HÜMA'NIN DOLABI</h1><p>Hüma yarın okulun bahar şenliğine gidecek. Ona en güzel kıyafeti seçer misin?</p><button class="start" id="start">DOLABI AÇ 🌸</button><p style="font-size:12px">Sevimli bir giydirme ve hikâye oyunu.</p></div></div><main class="game" id="game"><div class="cloud c1"></div><div class="cloud c2"></div><section class="room"><h1 class="title" id="title">HÜMA'NIN DOLABI</h1><div class="subtitle" id="sub">Yarın çok güzel bir gün olacak!</div><div class="wardrobe" id="wardrobe"><div class="door"></div><div class="door"></div></div><div class="character"><div class="head"><div class="hair"></div><div class="eyes"><i class="eye"></i><i class="eye"></i></div><div class="mouth"></div></div><div class="body" id="outfit">🌸</div><span class="name" id="name">Hüma</span></div><div class="panel"><h3 id="question">Bugün ne giyelim?</h3><div class="choices" id="choices"></div></div><div class="story" id="story">Hüma dolabın önünde heyecanla bekliyor. Önce bir üst seçelim.</div></section></main><div class="static" id="static"></div><div class="overlay ending" id="ending"><div class="card"><h1 id="endTitle">SON</h1><p id="endText"></p><button class="start" onclick="location.reload()">TEKRAR OYNA</button></div></div><script>const G=document.getElementById('game'),C=document.getElementById('choices'),S=document.getElementById('story'),Q=document.getElementById('question'),O=document.getElementById('outfit'),ST=document.getElementById('static');let step=0,flags={};const scenes=[{q:'Üstünü seç',s:'Hüma dolabın önünde heyecanla bekliyor. Önce bir üst seçelim.',c:[['🎀 Pembe bluz','pink'],['🌼 Çiçekli tişört','flower'],['⭐ Sarı kazak','yellow']]},{q:'Altını seç',s:'Harika! Şimdi eteğini ya da pantolonunu seç.',c:[['💗 Pembe etek','skirt'],['👖 Kot pantolon','jean'],['🌈 Renkli şort','short']]},{q:'Ayakkabı seç',s:'Hüma aynaya bakıp gülümsüyor. Ayakkabılar kaldı!',c:[['👟 Spor ayakkabı','shoe'],['👢 Bot','boot'],['🥿 Babet','flat']]},{q:'Aksesuar seç',s:'Dolabın en üst rafında eski bir kutu var. Kutuyu daha önce gördüğünü hatırlamıyorsun.',c:[['🎒 Çanta al','bag'],['📦 Kutuyu aç','box']]},{q:'Kutunun içinde...',s:'Kutunun içinden eski bir fotoğraf ve küçük pembe bir anahtar çıktı. Fotoğraftaki kız Hüma’ya çok benziyor.',c:[['🔑 Anahtarı al','key'],['📷 Fotoğrafa bak','photo']]},{q:'Ne yapacaksın?',s:'Fotoğrafın arkasında kurşun kalemle yazılmış bir tarih var: “17 Mayıs 2009 — Hüma’nın son şenliği.” Ama bu mümkün değil.',c:[['Anneye sor','ask'],['Dolabı araştır','search']]},{q:'Dolap ses çıkarıyor',s:'Tak... tak... tak... Ses dolabın içinden geliyor. Ekrandaki renkler sanki biraz soldu.',c:[['Dolabı aç','open'],['Odadan çık','leave']]},{q:'İçeride bir kapı var',s:'Kıyafetlerin arkasında daha önce olmayan ince bir kapı belirdi. Pembe anahtar tam kilidine uyuyor.',c:[['Kapıyı aç','unlock'],['Anahtarı at','throw']]},{q:'Karanlık oda',s:'Kapının ardında Hüma’nın odasının aynısı var. Fakat eski, sessiz ve terk edilmiş. Masada bir günlük duruyor.',c:[['Günlüğü oku','diary'],['Geri dön','back']]},{q:'Günlük',s:'“Bugün yine beni seçtiler. Saçımı, elbisemi, ayakkabımı... Kimse bana ne istediğimi sormuyor. Oyun kapanınca burada yalnız kalıyorum.”',c:[['Devamını oku','read'],['Oyunu kapat','quit']]},{q:'Sayfalar değişiyor',s:'Son sayfada yeni bir cümle kendi kendine yazılıyor: “Şimdi sıra sende, Hüma.”',c:[['ARKANA BAKMA','dont'],['Dolaba bak','look']]},{q:'...',s:'Ekrandaki Hüma artık sana bakmıyor. Odadaki dolaba bakıyor. Kapak yavaşça açılıyor.',c:[['SAKLAN','hide'],['KOŞ','run']]},{q:'Son seçim',s:'Dolabın içinden aynı kıyafetleri giymiş başka bir kız çıkıyor. Yüzü görünmüyor. “Ben de Hüma’ydım,” diyor.',c:[['Elini tut','hand'],['Kapıyı kilitle','lock']]}];function render(){let x=scenes[step];Q.textContent=x.q;S.textContent=x.s;C.innerHTML='';x.c.forEach(([t,v])=>{let b=document.createElement('button');b.className='choice';b.textContent=t;b.onclick=()=>choose(v);C.appendChild(b)});if(step>=4)G.className='game bad1';if(step>=6)G.className='game bad2';if(step>=8){G.className='game bad3';ST.classList.add('on');document.getElementById('title').textContent=step>=10?'HÜMA’NIN DOLABI SENİ HATIRLIYOR':'HÜMA’NIN DOLABI';document.getElementById('sub').textContent=step>=10?'BU OYUNU DAHA ÖNCE OYNADIN.':'Yarın hiç gelmedi.'}if(step===10){S.classList.add('glitch');setTimeout(()=>S.classList.remove('glitch'),900)}}function choose(v){flags[v]=1;if(step<3){O.textContent=step===0?(v==='pink'?'🎀':v==='flower'?'🌼':'⭐'):step===1?(v==='skirt'?'🎀💗':v==='jean'?'🎀👖':'🎀🌈'):'👧'}if(v==='leave'){S.textContent='Kapıyı açıyorsun. Koridor yok. Yalnızca aynı oda var.'}if(v==='quit'){document.body.requestFullscreen?.().catch(()=>{});S.textContent='Kapat düğmesi çalışmıyor.'}step++;if(step>=scenes.length)return finish(v);setTimeout(render,250)}function finish(v){document.getElementById('ending').style.display='grid';let good=flags.hand&&!flags.lock;document.getElementById('endTitle').textContent=good?'HÜMA’YI HATIRLADIN':'OYUN KAPANDI';document.getElementById('endText').textContent=good?'Kız elini tuttuğunda oda yeniden pembeleşti. Günlükteki son cümle silindi. “Ben bir karakter değilim,” dedi. Ertesi sabah dolap normaldi. Ama oyunu her açtığında menüde artık iki isim görünüyordu: HÜMA ve HÜMA-2009.':'Kapıyı kilitledin. Ses kesildi. Ertesi sabah her şey normal görünüyordu. Bahar şenliğinde çekilen fotoğrafı akşam telefonda açtığında, Hüma’nın hemen arkasında dolaptaki kız duruyordu.'}document.getElementById('start').onclick=()=>{document.getElementById('intro').style.display='none';render()};</script></body></html>
