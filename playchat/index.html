<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PLAYCHAT</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#0f1720;color:#eef4f7}button,input{font:inherit}.app{min-height:100vh;background:linear-gradient(160deg,#0d141c,#13242b)}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #ffffff12;background:#0d141ddd;backdrop-filter:blur(14px);position:sticky;top:0;z-index:10}.brand{font-weight:950;font-size:24px;letter-spacing:-1px}.brand b{color:#65f0b3}.status{font-size:12px;color:#9db1bb}.shell{display:grid;grid-template-columns:330px 1fr;min-height:calc(100vh - 64px)}.left{border-right:1px solid #ffffff12;background:#101923;padding:14px}.profile{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:#ffffff08}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,#35c89f,#5e8fff);color:#062119}.add{margin:14px 0;display:flex;gap:8px}.add input{min-width:0;flex:1;border:1px solid #ffffff18;background:#0d151d;color:#fff;border-radius:12px;padding:12px}.add button,.iconBtn,.send{border:0;border-radius:12px;background:#35c89f;color:#082218;font-weight:900;padding:11px 13px}.section{font-size:12px;color:#86a0ab;margin:14px 6px 8px;text-transform:uppercase;font-weight:800;letter-spacing:.08em}.contact{display:flex;align-items:center;gap:10px;padding:11px;border-radius:15px;cursor:pointer}.contact:hover,.contact.on{background:#ffffff0d}.contact .avatar{width:42px;height:42px}.contact b{display:block}.contact small{color:#8fa4ae}.main{min-width:0;display:flex;flex-direction:column;background:radial-gradient(circle at 20% 0,#14333d 0,#101820 45%,#0c131a 100%)}.chatHead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #ffffff12;background:#0f1820cc}.who{display:flex;align-items:center;gap:10px}.actions{display:flex;gap:8px}.iconBtn{background:#ffffff0d;color:#eaf4f7;border:1px solid #ffffff12}.msgs{flex:1;padding:20px;overflow:auto;min-height:420px}.bubble{max-width:min(72%,520px);padding:11px 13px;border-radius:16px;margin:8px 0;line-height:1.35;box-shadow:0 4px 18px #0002}.me{margin-left:auto;background:#2e9d7b;color:#fff;border-bottom-right-radius:5px}.them{background:#1b2832;color:#eef4f7;border-bottom-left-radius:5px}.time{font-size:10px;opacity:.65;margin-top:5px;text-align:right}.composer{display:flex;gap:9px;padding:12px;border-top:1px solid #ffffff12;background:#0e171f}.composer input{flex:1;min-width:0;background:#16222b;border:1px solid #ffffff12;color:#fff;border-radius:14px;padding:13px}.empty{display:grid;place-items:center;flex:1;color:#8298a3;text-align:center;padding:30px}.call{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 30%,#1d4e55,#0b1218 62%);display:none;padding:22px}.callInner{max-width:980px;margin:auto;height:100%;display:flex;flex-direction:column}.callTop{display:flex;justify-content:space-between;align-items:center}.callStage{flex:1;display:grid;place-items:center;position:relative}.callAvatar{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;font-size:44px;font-weight:900;background:linear-gradient(135deg,#38d3a2,#6887ff);box-shadow:0 0 0 14px #ffffff08,0 0 60px #35c89f44}.callName{text-align:center;font-size:28px;font-weight:900;margin-top:18px}.callState{text-align:center;color:#a8bcc5}.callControls{display:flex;justify-content:center;gap:13px;flex-wrap:wrap;padding:15px}.round{width:60px;height:60px;border-radius:50%;border:0;background:#ffffff16;color:#fff;font-size:22px}.hang{background:#f05262}.gameBtn{width:auto;border-radius:18px;padding:0 18px;background:#5d79ff;font-size:16px;font-weight:900}.gamesPanel{position:absolute;right:16px;top:70px;width:300px;background:#111c24;border:1px solid #ffffff14;border-radius:18px;padding:14px;display:none;box-shadow:0 18px 50px #0007}.gameCard{padding:12px;border-radius:14px;background:#ffffff08;margin-top:8px;cursor:pointer}.gameCard:hover{background:#ffffff12}.mini{position:absolute;inset:70px 14px 92px;display:none;background:#101922e8;border:1px solid #ffffff14;border-radius:22px;padding:18px;overflow:auto}.mini h3{text-align:center;margin-top:0}.ttt{width:min(340px,90vw);margin:20px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cell{aspect-ratio:1;border:0;border-radius:15px;background:#1c2b35;color:white;font-size:38px;font-weight:900}.rps{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:30px}.rps button{font-size:40px;width:90px;height:90px;border:0;border-radius:20px;background:#1c2b35}.gameInfo{text-align:center;color:#a9bec6}.closeMini{display:block;margin:16px auto 0;border:0;border-radius:12px;background:#ffffff12;color:white;padding:10px 16px;font-weight:800}@media(max-width:760px){.shell{grid-template-columns:1fr}.left{border-right:0}.main{min-height:640px}.bubble{max-width:86%}.chatHead{position:sticky;top:64px;z-index:5}.gamesPanel{left:14px;right:14px;width:auto}.call{padding:12px}}</style></head><body><div class="app"><header class="top"><div class="brand"><b>PLAY</b>CHAT</div><div class="status">Mesaj • Ara • Birlikte Oyna</div></header><div class="shell"><aside class="left"><div class="profile"><div class="avatar">S</div><div><b>Sen</b><small style="display:block;color:#8fa4ae">+90 555 000 00 00</small></div></div><form class="add" id="addForm"><input id="phone" inputmode="tel" placeholder="Telefon numarası yaz"><button>Ekle</button></form><div class="section">Kişilerim</div><div id="contacts"></div></aside><section class="main" id="main"><div class="empty" id="empty"><div><div style="font-size:54px">💬🎮</div><h2>Bir kişi seç</h2><p>Mesajlaş, ara ve arama sırasında beraber oyun aç.</p></div></div><div id="chat" style="display:none;flex:1;flex-direction:column"><div class="chatHead"><div class="who"><div class="avatar" id="headAvatar">A</div><div><b id="headName">Arkadaş</b><small id="headPhone" style="display:block;color:#8fa4ae"></small></div></div><div class="actions"><button class="iconBtn" id="audioCall">📞 Ara</button><button class="iconBtn" id="videoCall">🎥 Görüntülü</button></div></div><div class="msgs" id="msgs"></div><form class="composer" id="msgForm"><input id="message" placeholder="Mesaj yaz..."><button class="send">Gönder</button></form></div></section></div></div><section class="call" id="call"><div class="callInner"><div class="callTop"><b id="callType">Sesli arama</b><span id="callTimer">00:00</span></div><div class="callStage"><div><div class="callAvatar" id="callAvatar">A</div><div class="callName" id="callName">Arkadaş</div><div class="callState" id="callState">Bağlanıyor...</div></div><div class="gamesPanel" id="gamesPanel"><b>Birlikte oyun seç</b><div class="gameCard" data-game="ttt">❌⭕ X-O-X</div><div class="gameCard" data-game="rps">✊✋✌ Taş Kağıt Makas</div></div><div class="mini" id="mini"><h3 id="miniTitle"></h3><div id="miniBody"></div><button class="closeMini" id="closeMini">Oyundan Çık</button></div></div><div class="callControls"><button class="round" id="mute">🎙️</button><button class="round" id="speaker">🔊</button><button class="round gameBtn" id="games">🎮 Oyun Oyna</button><button class="round hang" id="hang">📵</button></div></div></section><script>const $=id=>document.getElementById(id);let contacts=JSON.parse(localStorage.pcContacts||'[]');let chats=JSON.parse(localStorage.pcChats||'{}');let current=null,callSecs=0,callTick=null,muted=false;function persist(){localStorage.pcContacts=JSON.stringify(contacts);localStorage.pcChats=JSON.stringify(chats)}function normalize(v){return v.replace(/[^0-9+]/g,'').slice(0,16)}function renderContacts(){contacts.innerHTML='';const box=$('contacts');box.innerHTML='';contactsData().forEach((c,i)=>{let d=document.createElement('div');d.className='contact'+(current===i?' on':'');d.innerHTML=`<div class="avatar">${c.name[0]}</div><div><b>${c.name}</b><small>${c.phone}</small></div>`;d.onclick=()=>selectContact(i);box.appendChild(d)})}function contactsData(){return contacts}function selectContact(i){current=i;renderContacts();$('empty').style.display='none';$('chat').style.display='flex';let c=contacts[i];$('headName').textContent=c.name;$('headPhone').textContent=c.phone;$('headAvatar').textContent=c.name[0];renderMsgs()}function renderMsgs(){let key=contacts[current].phone,arr=chats[key]||[];$('msgs').innerHTML='';arr.forEach(m=>{let b=document.createElement('div');b.className='bubble '+(m.me?'me':'them');b.innerHTML=`${m.text}<div class="time">${m.time}</div>`;$('msgs').appendChild(b)});$('msgs').scrollTop=$('msgs').scrollHeight}function addMessage(text,me=true){let key=contacts[current].phone;chats[key]=chats[key]||[];chats[key].push({text,me,time:new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})});persist();renderMsgs()}$('addForm').onsubmit=e=>{e.preventDefault();let p=normalize($('phone').value);if(p.length<10)return alert('Geçerli bir telefon numarası yaz.');if(contacts.some(c=>c.phone===p))return alert('Bu kişi zaten ekli.');let n=prompt('Kişinin adı?','Yeni Kişi')||'Yeni Kişi';contacts.push({name:n,phone:p});$('phone').value='';persist();renderContacts();selectContact(contacts.length-1)};$('msgForm').onsubmit=e=>{e.preventDefault();let t=$('message').value.trim();if(!t||current==null)return;addMessage(t,true);$('message').value='';setTimeout(()=>{addMessage('Mesajını gördüm 👍',false)},700)};function startCall(video){if(current==null)return;let c=contacts[current];$('call').style.display='block';$('callName').textContent=c.name;$('callAvatar').textContent=c.name[0];$('callType').textContent=video?'Görüntülü arama':'Sesli arama';$('callState').textContent='Bağlandı • DEMO';callSecs=0;$('callTimer').textContent='00:00';clearInterval(callTick);callTick=setInterval(()=>{callSecs++;$('callTimer').textContent=String(Math.floor(callSecs/60)).padStart(2,'0')+':'+String(callSecs%60).padStart(2,'0')},1000)}$('audioCall').onclick=()=>startCall(false);$('videoCall').onclick=()=>startCall(true);$('hang').onclick=()=>{clearInterval(callTick);$('call').style.display='none';$('gamesPanel').style.display='none';$('mini').style.display='none'};$('games').onclick=()=>{$('gamesPanel').style.display=$('gamesPanel').style.display==='block'?'none':'block'};$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🎙️'};$('speaker').onclick=()=>{$('speaker').textContent=$('speaker').textContent==='🔊'?'🔉':'🔊'};document.querySelectorAll('.gameCard').forEach(g=>g.onclick=()=>{openGame(g.dataset.game);$('gamesPanel').style.display='none'});$('closeMini').onclick=()=>{$('mini').style.display='none'};function openGame(type){$('mini').style.display='block';if(type==='ttt')ttt();else rps()}function ttt(){$('miniTitle').textContent='X-O-X';$('miniBody').innerHTML='<div class="gameInfo" id="gi">Sen X, arkadaş O. Sıra sende.</div><div class="ttt" id="board"></div>';let board=Array(9).fill(''),turn=true,done=false;function draw(){let b=$('board');b.innerHTML='';board.forEach((v,i)=>{let c=document.createElement('button');c.className='cell';c.textContent=v;c.onclick=()=>{if(done||!turn||board[i])return;board[i]='X';turn=false;check();draw();if(!done)setTimeout(bot,450)};b.appendChild(c)})}function bot(){let free=board.map((v,i)=>v?'':i).filter(v=>v!=='');if(!free.length)return;let i=free[Math.floor(Math.random()*free.length)];board[i]='O';turn=true;check();draw()}function check(){let w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].find(a=>board[a[0]]&&board[a[0]]===board[a[1]]&&board[a[1]]===board[a[2]]);if(w){done=true;$('gi').textContent=board[w[0]]==='X'?'Kazandın! 🎉':'Arkadaş kazandı.'}else if(board.every(Boolean)){done=true;$('gi').textContent='Berabere!'}}draw()}function rps(){$('miniTitle').textContent='Taş Kağıt Makas';$('miniBody').innerHTML='<div class="gameInfo" id="rpsInfo">Seçimini yap.</div><div class="rps"><button data-v="taş">✊</button><button data-v="kağıt">✋</button><button data-v="makas">✌️</button></div>';document.querySelectorAll('.rps button').forEach(b=>b.onclick=()=>{let vals=['taş','kağıt','makas'],opp=vals[Math.floor(Math.random()*3)],me=b.dataset.v,res=me===opp?'Berabere':(me==='taş'&&opp==='makas'||me==='kağıt'&&opp==='taş'||me==='makas'&&opp==='kağıt')?'Kazandın!':'Kaybettin.';$('rpsInfo').textContent=`Sen: ${me} • Arkadaş: ${opp} — ${res}`})}renderContacts();if(!contacts.length){contacts.push({name:'Hüma',phone:'+905551112233'},{name:'Ozan',phone:'+905554445566'});persist();renderContacts()}</script></body></html>
