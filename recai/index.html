<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>RecAI — Cebindeki Öğretmen</title><style>:root{--ink:#0b1020;--muted:#768096;--line:#e9edf4;--soft:#f6f8fc;--blue:#1769ff;--purple:#7357ff;--green:#22b573;--shadow:0 12px 34px rgba(24,39,75,.08)}*{box-sizing:border-box}html,body{margin:0;background:#eef2f7;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,select{font:inherit}.phone{width:100%;max-width:470px;min-height:100svh;margin:auto;background:#fff;position:relative;overflow:hidden}.page{min-height:100svh;padding:calc(16px + env(safe-area-inset-top)) 18px calc(98px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#fff 0,#fbfcff 100%)}.topbar{height:54px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.logo{display:flex;align-items:center;gap:9px;font-size:24px;font-weight:900;letter-spacing:-1px}.logoMark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#1769ff,#7656ff);display:grid;place-items:center;box-shadow:0 8px 20px rgba(23,105,255,.28)}.logoMark svg{width:21px}.logo .ai{color:var(--blue)}.topActions{display:flex;gap:8px}.iconBtn{width:40px;height:40px;border:1px solid var(--line);border-radius:14px;background:#fff;display:grid;place-items:center;color:#27324a;box-shadow:0 6px 16px rgba(24,39,75,.04)}.heroPanel{background:linear-gradient(135deg,#111b36,#1b2d56 58%,#243d79);color:#fff;border-radius:28px;padding:26px 22px;box-shadow:0 24px 50px rgba(27,46,88,.22);position:relative;overflow:hidden}.heroPanel:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(105,127,255,.20);right:-65px;top:-65px}.heroKicker{font-size:12px;font-weight:800;opacity:.72;letter-spacing:.4px}.heroPanel h1{font-size:31px;line-height:1.05;letter-spacing:-1.4px;margin:10px 0 12px;max-width:310px}.heroPanel p{font-size:14px;line-height:1.55;opacity:.78;margin:0;max-width:330px}.roleCards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.role{border:1px solid var(--line);background:#fff;border-radius:22px;padding:18px 15px;text-align:left;box-shadow:var(--shadow);min-height:138px}.roleIcon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin-bottom:18px;background:#edf3ff;color:#1769ff}.role:nth-child(2) .roleIcon{background:#f1edff;color:#7357ff}.role b{display:block;font-size:16px}.role small{display:block;color:var(--muted);line-height:1.35;margin-top:6px}.sectionTitle{display:flex;align-items:end;justify-content:space-between;margin:24px 2px 12px}.sectionTitle h2{font-size:19px;margin:0;letter-spacing:-.5px}.sectionTitle span{font-size:12px;color:var(--muted)}.card{border:1px solid var(--line);background:#fff;border-radius:22px;padding:18px;box-shadow:0 8px 24px rgba(24,39,75,.05);margin-bottom:12px}.loginTitle{text-align:center;margin:38px 0 24px}.loginTitle .bigMark{width:66px;height:66px;border-radius:22px;margin:0 auto 18px;background:linear-gradient(135deg,#1769ff,#7657ff);display:grid;place-items:center;box-shadow:0 18px 35px rgba(55,78,200,.25)}.loginTitle h1{font-size:28px;margin:0 0 8px}.loginTitle p{color:var(--muted);font-size:14px;line-height:1.5;margin:0}.btn{width:100%;height:56px;border:0;border-radius:17px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px}.primary{background:linear-gradient(135deg,#1769ff,#356ff5);color:#fff;box-shadow:0 13px 28px rgba(23,105,255,.22)}.google{background:#fff;border:1px solid #dde3ec;color:#202b42;box-shadow:var(--shadow)}.back{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:#fff}.fieldLabel{font-size:12px;color:#69748a;font-weight:800;margin:16px 0 7px}.field{width:100%;height:54px;border:1px solid #dfe5ee;border-radius:15px;padding:0 15px;background:#fff;outline:none}.field:focus{border-color:#8cb3ff;box-shadow:0 0 0 4px #edf3ff}.formTitle{font-size:28px;letter-spacing:-.8px;margin:18px 0 7px}.formSub{font-size:14px;color:var(--muted);line-height:1.5;margin:0 0 22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{border:1px solid var(--line);border-radius:17px;padding:14px 8px;text-align:center;background:#fbfcff}.stat strong{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}.studentHead{display:flex;align-items:center;gap:13px}.avatar{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,#1769ff,#7657ff);display:grid;place-items:center;color:white;font-weight:900;font-size:18px}.studentHead h3{margin:0;font-size:16px}.studentHead p{margin:4px 0 0;color:var(--muted);font-size:12px}.progressRow{margin-top:15px}.progressRow .r{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px}.bar{height:8px;border-radius:99px;background:#edf1f6;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#24b97c,#5bd69e);border-radius:99px}.bar.warn i{background:linear-gradient(90deg,#ff8a78,#ffb060)}.recommend{background:linear-gradient(135deg,#f3f6ff,#f7f2ff);border:1px solid #e7e8fb}.recommend b{display:block;margin-bottom:6px}.recommend p{margin:0;color:#687289;font-size:13px;line-height:1.45}.featureGrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.feature{border:0;border-radius:24px;padding:18px;min-height:138px;text-align:left;color:#fff;box-shadow:0 15px 28px rgba(36,60,120,.13)}.feature strong{display:block;font-size:17px;margin-top:24px}.feature small{display:block;opacity:.8;margin-top:5px}.f1{background:linear-gradient(135deg,#7357ff,#9d78ff)}.f2{background:linear-gradient(135deg,#1769ff,#4e9cff)}.f3{background:linear-gradient(135deg,#19a86b,#4bcf94)}.f4{background:linear-gradient(135deg,#ff6f97,#ff9bb7)}.wide{grid-column:1/-1;min-height:100px}.freeBadge{display:flex;align-items:center;justify-content:space-between}.freeBadge span{font-size:13px;color:var(--muted)}.freeBadge b{color:#1769ff}.upload{border:1.5px dashed #cfd6e2;border-radius:24px;background:#f9fbff;padding:54px 20px;text-align:center}.upload .cam{width:62px;height:62px;border-radius:20px;background:#edf3ff;color:#1769ff;display:grid;place-items:center;margin:0 auto 12px;font-size:27px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:5px;border-radius:16px;background:#f1f3f7;margin-bottom:15px}.tabs div{text-align:center;padding:11px 6px;font-size:12px;color:#7b8497}.tabs .active{background:#fff;border-radius:12px;color:#1769ff;font-weight:800;box-shadow:0 4px 12px rgba(20,40,80,.06)}.bubble{background:#f3f0ff;border:1px solid #e6defe;border-radius:8px 20px 20px 20px;padding:16px;line-height:1.55;color:#463d68;font-size:14px}.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(470px,100%);height:calc(74px + env(safe-area-inset-bottom));padding:9px 12px env(safe-area-inset-bottom);background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-top:1px solid #e8ecf2;display:grid;grid-template-columns:repeat(4,1fr);z-index:20}.nav{border:0;background:none;color:#8a93a5;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.nav svg{width:22px;height:22px;stroke:currentColor}.nav.active{color:#1769ff}.navCenter{position:relative}.navCenter:before{content:"";position:absolute;width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,#1769ff,#7657ff);top:2px;box-shadow:0 10px 22px rgba(45,80,220,.25)}.navCenter svg{position:relative;color:#fff}.navCenter span{margin-top:4px}.hide{display:none}@media(min-width:700px){body{padding:24px}.phone{border-radius:32px;box-shadow:0 30px 80px rgba(20,35,70,.16);min-height:900px}.page{min-height:900px}}</style></head><body><div class="phone"><main id="app"></main><div id="bottom"></div></div><script>const A=document.getElementById('app'),B=document.getElementById('bottom');let student='Öğrenci',grade='6. Sınıf';const I={home:'<svg viewBox="0 0 24 24" fill="none"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z" stroke-width="1.8"/></svg>',chart:'<svg viewBox="0 0 24 24" fill="none"><path d="M5 20V10m7 10V4m7 16v-7" stroke-width="1.8" stroke-linecap="round"/></svg>',plus:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke-width="2" stroke-linecap="round"/></svg>',user:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke-width="1.8"/><path d="M4.5 21c1-4.3 3.6-6.5 7.5-6.5s6.5 2.2 7.5 6.5" stroke-width="1.8" stroke-linecap="round"/></svg>'};function logo(){return '<div class="logo"><span class="logoMark"><svg viewBox="0 0 24 24"><path d="M2 7.5 12 3l10 4.5L12 12 2 7.5Z" fill="#fff"/><path d="M6 10.2v4.6c3.2 2.5 8.8 2.5 12 0v-4.6L12 13.4 6 10.2Z" fill="#fff" opacity=".9"/></svg></span>Rec<span class="ai">AI</span></div>'}function top(){return '<div class="topbar">'+logo()+'<div class="topActions"><button class="iconBtn">?</button><button class="iconBtn">⋮</button></div></div>'}function bottom(active){B.innerHTML='<nav class="bottom"><button class="nav '+(active==='home'?'active':'')+'" data-go="dash">'+I.home+'<span>Ana Sayfa</span></button><button class="nav '+(active==='progress'?'active':'')+'" data-go="progress">'+I.chart+'<span>Gelişim</span></button><button class="nav navCenter" data-go="question">'+I.plus+'<span>Soru Sor</span></button><button class="nav '+(active==='profile'?'active':'')+'" data-go="profile">'+I.user+'<span>Profil</span></button></nav>';bind()}function nobottom(){B.innerHTML=''}function go(x){A.innerHTML=views[x]();['dash','progress','profile','home'].includes(x)?bottom(x==='home'?'home':x):x==='question'||x==='solution'?bottom(''):nobottom();bind();scrollTo(0,0)}const views={landing:()=>'<section class="page">'+top()+'<div class="heroPanel"><div class="heroKicker">CEBİNDEKİ ÖĞRETMEN</div><h1>Öğrenmeyi kişiselleştiren yapay zekâ.</h1><p>RecAI soruyu sadece çözmez; öğrencinin nerede zorlandığını anlar, anlatır ve gelişimi veliye gösterir.</p></div><div class="sectionTitle"><h2>Nasıl devam edeceksin?</h2><span>Bir rol seç</span></div><div class="roleCards"><button class="role" data-go="parent"><span class="roleIcon">V</span><b>Veli Girişi</b><small>Google ile giriş yap, öğrencini yönet.</small></button><button class="role" data-go="student"><span class="roleIcon">Ö</span><b>Öğrenci Girişi</b><small>Kod ve şifreyle kendi alanına gir.</small></button></div><div class="sectionTitle"><h2>RecAI ne yapar?</h2></div><div class="card"><b>Soruyu görür, nasıl düşündüğünü anlar.</b><p class="formSub" style="margin:8px 0 0">Fotoğraf, ses ve konuşma üzerinden adım adım öğretir.</p></div></section>',parent:()=>'<section class="page">'+top()+'<div class="loginTitle"><div class="bigMark">'+logo().replace('<div class="logo">','<div style="display:none">')+'</div><h1>Veli Girişi</h1><p>Çocuğunun öğrenme yolculuğunu takip etmek için Google hesabınla devam et.</p></div><button class="btn google" data-go="add"><b style="color:#4285f4;font-size:20px">G</b> Google ile devam et</button><button class="btn" style="margin-top:12px;background:#f5f7fb;color:#33405c" data-go="landing">Geri dön</button></section>',add:()=>'<section class="page"><div class="topbar"><button class="back" data-go="parent">‹</button>'+logo()+'<span></span></div><h1 class="formTitle">Öğrencini ekle</h1><p class="formSub">Seviyesine göre çalışma planını ve anlatım biçimini hazırlayalım.</p><div class="fieldLabel">Öğrencinin adı</div><input id="name" class="field" placeholder="Adı"><div class="fieldLabel">Sınıfı</div><select id="grade" class="field"><option>4. Sınıf</option><option>5. Sınıf</option><option selected>6. Sınıf</option><option>7. Sınıf</option><option>8. Sınıf</option></select><button id="save" class="btn primary" style="margin-top:20px">Öğrenciyi Kaydet</button></section>',dash:()=>'<section class="page">'+top()+'<div class="studentHead"><div class="avatar">'+student.slice(0,1).toUpperCase()+'</div><div><h3>'+student+'</h3><p>'+grade+' · Bugün aktif</p></div></div><div class="sectionTitle"><h2>Bugünkü özet</h2><span>8 Eylül</span></div><div class="stats"><div class="stat"><strong>14</strong><span>Soru</span></div><div class="stat"><strong>38 dk</strong><span>Çalışma</span></div><div class="stat"><strong>%78</strong><span>Doğruluk</span></div></div><div class="sectionTitle"><h2>Öğrenme durumu</h2><span>Bu hafta</span></div><div class="card"><div class="progressRow"><div class="r"><b>Kesirler</b><span>%86</span></div><div class="bar"><i style="width:86%"></i></div></div><div class="progressRow"><div class="r"><b>Ondalık gösterim</b><span>%44</span></div><div class="bar warn"><i style="width:44%"></i></div></div></div><div class="card recommend"><b>RecAI öneriyor</b><p>Yarın 12 dakikalık ondalık gösterim tekrarı ve 5 benzer soru iyi olur.</p></div></section>',progress:()=>'<section class="page">'+top()+'<h1 class="formTitle">Gelişim</h1><p class="formSub">Öğrencinin güçlü ve geliştirilmesi gereken konuları.</p><div class="card"><div class="progressRow"><div class="r"><b>Matematik</b><span>%82</span></div><div class="bar"><i style="width:82%"></i></div></div><div class="progressRow"><div class="r"><b>Fen Bilimleri</b><span>%74</span></div><div class="bar"><i style="width:74%"></i></div></div><div class="progressRow"><div class="r"><b>Türkçe</b><span>%88</span></div><div class="bar"><i style="width:88%"></i></div></div></div><div class="sectionTitle"><h2>Son 7 gün</h2></div><div class="stats"><div class="stat"><strong>56</strong><span>Soru</span></div><div class="stat"><strong>4.2</strong><span>Saat</span></div><div class="stat"><strong>5</strong><span>Konu</span></div></div></section>',profile:()=>'<section class="page">'+top()+'<h1 class="formTitle">Veli hesabı</h1><div class="card"><b>Öğrenci hesabı</b><p class="formSub" style="margin:8px 0 14px">Kod: <b>R7K3L9</b></p><button class="btn" style="background:#f4f7fc">Şifreyi yenile</button></div><div class="card"><b>RecAI Sınırsız</b><p class="formSub" style="margin:8px 0 0">Demo abonelik ekranı · Aylık plan</p></div><button class="btn" style="background:#fff1f2;color:#c34251" data-go="landing">Çıkış yap</button></section>',student:()=>'<section class="page"><div class="topbar"><button class="back" data-go="landing">‹</button>'+logo()+'<span></span></div><div class="loginTitle" style="margin-top:50px"><div class="avatar" style="width:70px;height:70px;border-radius:23px;margin:auto auto 18px">Ö</div><h1>Öğrenci Girişi</h1><p>Velinin oluşturduğu kod ve şifreyle giriş yap.</p></div><div class="fieldLabel">Öğrenci kodu</div><input class="field" value="R7K3L9"><div class="fieldLabel">Şifre</div><input class="field" type="password" value="1234"><button class="btn primary" style="margin-top:20px" data-go="home">Giriş Yap</button></section>',home:()=>'<section class="page">'+top()+'<h1 class="formTitle">Merhaba '+student+'</h1><p class="formSub">Bugün ne öğrenmek istiyorsun?</p><div class="featureGrid"><button class="feature f1" data-go="question"><span>▣</span><strong>Soru Sor</strong><small>Fotoğraf çek veya yükle</small></button><button class="feature f2"><span>◫</span><strong>Konu Tekrarı</strong><small>Eksiklerini tamamla</small></button><button class="feature f3"><span>✓</span><strong>Sınava Hazırlan</strong><small>Kısa testlerle çalış</small></button><button class="feature f4"><span>◉</span><strong>RecAI ile Konuş</strong><small>Sesli öğretmen modu</small></button></div><div class="card freeBadge" style="margin-top:14px"><span>Bugünkü ücretsiz hakkın</span><b>1 soru</b></div></section>',question:()=>'<section class="page"><div class="topbar"><button class="back" data-go="home">‹</button>'+logo()+'<span></span></div><h1 class="formTitle">Sorunu göster</h1><p class="formSub">Kitaptan ya da defterden net bir fotoğraf çek.</p><label class="upload"><input id="file" type="file" accept="image/*" capture="environment" hidden><div id="prev"><div class="cam">⌁</div><b>Fotoğraf çek veya yükle</b><p class="formSub" style="margin:7px 0 0">RecAI soruyu analiz edip öğretmeye başlayacak.</p></div></label><button class="btn primary" style="margin-top:16px" data-go="solution">RecAI’ye Sor</button></section>',solution:()=>'<section class="page"><div class="topbar"><button class="back" data-go="question">‹</button>'+logo()+'<span></span></div><div class="tabs"><div class="active">Çözüm</div><div>Anlatım</div><div>Benzer Soru</div></div><div class="bubble"><b>Önce soruyu birlikte anlayalım.</b><br>Verilen bilgileri ayıralım, sonra hangi işlemi neden yaptığımızı adım adım görelim.</div><div class="card"><b>1. Verilenleri belirle</b><p class="formSub" style="margin:7px 0 15px">Sorudaki sayıları ve ilişkileri çıkar.</p><b>2. İstenen sonucu bul</b><p class="formSub" style="margin:7px 0 15px">Hangi bilgiye ulaşmamız gerektiğini netleştir.</p><b>3. İşlemi kur</b><p class="formSub" style="margin:7px 0 0">Sonucu bulduktan sonra kontrol et.</p></div><button class="btn" id="speak" style="background:#f1edff;color:#654ad8">▶ Sesli anlat</button></section>'};function bind(){document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go));const s=document.getElementById('save');if(s)s.onclick=()=>{student=document.getElementById('name').value||'Öğrenci';grade=document.getElementById('grade').value;go('dash')};const f=document.getElementById('file');if(f)f.onchange=e=>{const file=e.target.files[0];if(file)document.getElementById('prev').innerHTML='<img src="'+URL.createObjectURL(file)+'" style="max-width:100%;border-radius:18px">'};const sp=document.getElementById('speak');if(sp)sp.onclick=()=>{if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Bu soruyu adım adım birlikte çözelim. Önce verilen bilgileri belirleyelim.');u.lang='tr-TR';speechSynthesis.speak(u)}}}go('landing');</script></body></html>
