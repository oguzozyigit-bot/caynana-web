<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f9ff"><title>RecAI — Cebindeki Öğretmen</title><style>:root{--blue:#1769ff;--blue2:#3d8cff;--purple:#7d58ff;--ink:#18223a;--muted:#7a859f;--line:#e7ecf5;--bg:#f7f9ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#f4f7ff 0%,#fff 42%)}button,input,select{font:inherit}.app{width:100%;max-width:470px;min-height:100svh;margin:0 auto;background:rgba(255,255,255,.88);position:relative;overflow:hidden}.screen{min-height:100svh;padding:calc(18px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));position:relative}.orb{position:absolute;border-radius:50%;filter:blur(4px);opacity:.38;pointer-events:none}.o1{width:180px;height:180px;background:#dfe9ff;right:-72px;top:70px}.o2{width:150px;height:150px;background:#eee6ff;left:-80px;top:330px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:25px;letter-spacing:-.8px;position:relative;z-index:2}.brandmark{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#0f5cff,#7758ff);display:grid;place-items:center;box-shadow:0 10px 24px rgba(45,96,255,.28)}.brandmark svg{width:25px;height:25px}.brand .ai{color:#1867ff}.tagline{font-size:11px;color:#7c87a1;font-weight:700;margin-left:50px;margin-top:-5px;letter-spacing:.15px}.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:28px;position:relative;z-index:1}.art{width:230px;height:230px;margin:4px auto 2px;filter:drop-shadow(0 18px 28px rgba(41,68,132,.12))}.eyebrow{display:inline-flex;align-items:center;gap:7px;background:#edf3ff;color:#2867e8;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;margin-bottom:12px}.hero h1{font-size:31px;line-height:1.08;letter-spacing:-1.2px;margin:4px 0 12px}.hero p{font-size:15px;line-height:1.55;color:var(--muted);margin:0 auto;max-width:330px}.ctaWrap{margin-top:28px;width:100%}.btn{width:100%;border:0;border-radius:17px;min-height:56px;padding:0 18px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:11px;cursor:pointer;transition:.15s transform,.15s box-shadow}.btn:active{transform:scale(.985)}.google{background:#fff;color:#26334d;border:1px solid #e3e8f2;box-shadow:0 12px 30px rgba(35,62,125,.10)}.googleIcon{width:23px;height:23px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-family:Arial;color:#4285f4}.subLink{margin-top:17px;color:#8a94aa;font-size:13px}.subLink button{border:0;background:none;color:#1769ff;font-weight:800;padding:2px 4px}.trust{margin-top:26px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap}.trust span{display:flex;align-items:center;gap:6px;font-size:11px;color:#8a94aa}.tinyDot{width:6px;height:6px;border-radius:50%;background:#47c985}.back{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 8px 20px rgba(27,50,99,.06)}.headrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.miniBrand{font-size:20px;font-weight:900}.miniBrand b{color:#1769ff}.form h1{font-size:28px;letter-spacing:-.8px;margin:14px 0 6px}.form p{color:var(--muted);font-size:14px;margin:0 0 24px}.label{font-size:12px;color:#6e7890;font-weight:700;display:block;margin:14px 0 7px}.field{width:100%;height:54px;border:1px solid #dfe5f0;border-radius:15px;background:#fff;padding:0 15px;outline:none}.field:focus{border-color:#8bb0ff;box-shadow:0 0 0 4px #edf3ff}.primary{background:linear-gradient(135deg,#1769ff,#376fff);color:#fff;box-shadow:0 14px 28px rgba(23,105,255,.25);margin-top:18px}.studentHero{width:135px;height:135px;margin:14px auto}.choice{width:100%;border:1px solid #e3e8f2;background:#fff;border-radius:20px;padding:17px 16px;display:flex;align-items:center;gap:14px;text-align:left;margin:12px 0;box-shadow:0 10px 24px rgba(31,59,121,.06)}.choice .ico{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:#eef4ff;color:#1769ff}.choice b{font-size:15px}.choice small{display:block;color:#8791a6;margin-top:4px}.pill{display:inline-flex;padding:7px 10px;border-radius:999px;background:#eef4ff;color:#1769ff;font-size:11px;font-weight:800}.panel{border:1px solid #e4eaf4;background:#fff;border-radius:20px;padding:17px;margin:14px 0;box-shadow:0 10px 26px rgba(31,59,121,.05)}.price{display:flex;justify-content:space-between;align-items:center}.price strong{font-size:23px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.stat{background:#f6f8fc;border-radius:15px;padding:12px;text-align:center}.stat b{display:block;font-size:19px}.stat small{color:#8b95aa}.bar{height:8px;background:#edf1f6;border-radius:99px;overflow:hidden;margin-top:7px}.bar span{display:block;height:100%;background:#45c98a;border-radius:99px}.warn span{background:#ff7d87}.homeTitle{font-size:27px;margin:14px 0 2px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.action{border:0;border-radius:22px;padding:20px 16px;text-align:left;min-height:118px;color:#fff;font-weight:800;box-shadow:0 14px 26px rgba(35,70,145,.14)}.aPurple{background:linear-gradient(135deg,#7959ff,#a26eff)}.aBlue{background:linear-gradient(135deg,#3c87ff,#5ba8ff)}.aGreen{background:linear-gradient(135deg,#2fc58a,#62d59f)}.aPink{background:linear-gradient(135deg,#ff6fa5,#ff8fc0)}.wide{grid-column:1/-1;min-height:96px}.upload{border:2px dashed #cfd8ea;border-radius:22px;padding:48px 20px;text-align:center;background:#fafcff}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#f1f3f8;padding:5px;border-radius:14px}.tabs div{padding:10px;text-align:center;font-size:12px}.tabs .on{background:#fff;border-radius:10px;color:#6f50ef;font-weight:800}.bubble{background:#f3efff;padding:15px;border-radius:6px 18px 18px 18px;margin:16px 0;line-height:1.55;color:#4b416d}.code{background:#eef4ff;color:#245ac7;padding:14px;border-radius:15px;font-weight:900;letter-spacing:1.2px;text-align:center}.small{font-size:12px;color:#7f8aa1}@media(min-width:700px){body{padding:26px}.app{min-height:880px;border-radius:34px;box-shadow:0 30px 80px rgba(28,55,115,.16)}.screen{min-height:880px}}</style></head><body><main class="app"><div id="app"></div></main><script>const A=document.getElementById('app');let student='Öğrenci',grade='6. Sınıf';const parentArt=`<svg class="art" viewBox="0 0 240 240" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dfe9ff"/><stop offset="1" stop-color="#f0e8ff"/></linearGradient><linearGradient id="shirt" x1="0" x2="1"><stop stop-color="#4b76ff"/><stop offset="1" stop-color="#7d5bff"/></linearGradient></defs><circle cx="120" cy="120" r="105" fill="url(#g)"/><ellipse cx="120" cy="203" rx="68" ry="19" fill="#cad6f5" opacity=".55"/><path d="M74 187c8-42 28-63 48-63s41 21 48 63" fill="url(#shirt)"/><circle cx="120" cy="90" r="43" fill="#ffd8c4"/><path d="M78 93c-4-31 12-58 43-58 26 0 45 17 44 50-9-7-17-20-18-29-10 17-38 25-67 23" fill="#3a2a32"/><path d="M81 79c-9 9-9 27-2 39l10-8zM160 77c10 9 11 28 3 42l-10-8z" fill="#3a2a32"/><circle cx="104" cy="92" r="3.4" fill="#3e3540"/><circle cx="136" cy="92" r="3.4" fill="#3e3540"/><path d="M110 108c7 6 14 6 21 0" fill="none" stroke="#d9827e" stroke-width="3" stroke-linecap="round"/><rect x="151" y="127" width="42" height="68" rx="10" transform="rotate(8 151 127)" fill="#20324f"/><rect x="156" y="133" width="32" height="52" rx="7" transform="rotate(8 156 133)" fill="#8eb8ff"/><circle cx="170" cy="189" r="2.5" fill="#fff"/></svg>`;const childArt=`<svg class="studentHero" viewBox="0 0 160 160"><defs><linearGradient id="cg" x1="0" x2="1"><stop stop-color="#6f5cff"/><stop offset="1" stop-color="#a370ff"/></linearGradient></defs><circle cx="80" cy="80" r="74" fill="#eee9ff"/><circle cx="80" cy="61" r="30" fill="#ffd6bb"/><path d="M51 62c-2-28 14-41 30-41 17 0 31 12 30 35-9-10-20-14-34-12-10 2-18 8-26 18" fill="#49322e"/><path d="M40 147c5-38 21-56 40-56s36 18 41 56" fill="url(#cg)"/><circle cx="69" cy="64" r="2.7" fill="#423a3a"/><circle cx="91" cy="64" r="2.7" fill="#423a3a"/><path d="M72 77c5 4 11 4 16 0" fill="none" stroke="#d98578" stroke-width="2.4" stroke-linecap="round"/></svg>`;function brand(){return `<div class="brand"><div class="brandmark"><svg viewBox="0 0 24 24"><path d="M2 7.5 12 3l10 4.5L12 12 2 7.5Z" fill="#fff"/><path d="M6 10.2v4.6c3.2 2.5 8.8 2.5 12 0v-4.6L12 13.4 6 10.2Z" fill="#fff" opacity=".9"/></svg></div><span>Rec<span class="ai">AI</span></span></div><div class="tagline">Cebindeki Öğretmen</div>`}function page(x){A.innerHTML=views[x]();bind();scrollTo(0,0)}const views={parent:()=>`<section class="screen"><i class="orb o1"></i><i class="orb o2"></i>${brand()}<div class="hero">${parentArt}<div class="eyebrow">✦ Veli alanı</div><h1>Geleceği birlikte<br>öğrenelim.</h1><p>Çocuğunun eğitim yolculuğunu takip et, gelişimini gör ve RecAI ile yanında ol.</p><div class="ctaWrap"><button class="btn google" data-go="add"><span class="googleIcon">G</span>Google ile devam et</button><div class="subLink">Öğrenci misin? <button data-go="student">Öğrenci Girişi</button></div><div class="trust"><span><i class="tinyDot"></i>Güvenli veli hesabı</span><span><i class="tinyDot"></i>Çocuk için e-posta gerekmez</span></div></div></div></section>`,add:()=>`<section class="screen form"><div class="headrow"><button class="back" data-go="parent">‹</button><div class="miniBrand">Rec<b>AI</b></div><span class="pill">1 / 2</span></div><h1>Öğrencini ekle</h1><p>Çocuğunun seviyesine uygun bir öğrenme deneyimi hazırlayalım.</p><label class="label">Öğrencinin adı</label><input id="name" class="field" placeholder="Adı"><label class="label">Sınıfı</label><select id="grade" class="field"><option>4. Sınıf</option><option>5. Sınıf</option><option selected>6. Sınıf</option><option>7. Sınıf</option><option>8. Sınıf</option></select><button class="btn primary" id="save">Öğrenciyi Kaydet</button></section>`,plan:()=>`<section class="screen form"><div class="headrow"><button class="back" data-go="add">‹</button><div class="miniBrand">Rec<b>AI</b></div><span class="pill">2 / 2</span></div><h1>RecAI Sınırsız</h1><p>Bir öğretmen gibi açıklar, tekrar eder ve öğrencinin gelişimini takip eder.</p><div class="panel">✓ Sınırsız soru çözümü<br><br>✓ Fotoğrafla soru gönderme<br><br>✓ Sesli anlatım ve karşılıklı konuşma<br><br>✓ Veli gelişim paneli</div><div class="panel price"><div><b>Aylık</b><div class="small">İstediğin zaman iptal</div></div><strong>₺399<small>/ay</small></strong></div><button class="btn primary" data-go="dash">Demoda devam et</button></section>`,dash:()=>`<section class="screen"><div class="headrow"><div class="miniBrand">Rec<b>AI</b></div><span class="pill">Veli Paneli</span></div><h1 class="homeTitle">Merhaba 👋</h1><p class="small">Çocuğunun gelişimini buradan takip edebilirsin.</p><div class="panel"><b>${student}</b><div class="small">${grade}</div><div class="stats"><div class="stat"><b>14</b><small>Bugün</small></div><div class="stat"><b>56</b><small>Bu hafta</small></div><div class="stat"><b>%78</b><small>Doğruluk</small></div></div></div><div class="panel"><b>Güçlü olduğu konular</b><div class="small" style="margin-top:12px">Kesirler<div class="bar"><span style="width:86%"></span></div></div><div class="small" style="margin-top:12px">Denklemler<div class="bar"><span style="width:72%"></span></div></div></div><div class="panel"><b>Zorlandığı konular</b><div class="small" style="margin-top:12px">Ondalık gösterim<div class="bar warn"><span style="width:44%"></span></div></div><div class="small" style="margin-top:12px">Problemler<div class="bar warn"><span style="width:36%"></span></div></div></div><div class="panel">💡 <b>RecAI önerisi</b><div class="small" style="margin-top:7px">Yarın 10 dakikalık kısa tekrar yapması faydalı olur.</div></div><div class="code">Öğrenci kodu: R7K3L9</div></section>`,student:()=>`<section class="screen form"><div class="headrow"><button class="back" data-go="parent">‹</button><div class="miniBrand">Rec<b>AI</b></div><span></span></div>${childArt}<div style="text-align:center"><h1>Öğrenci Girişi</h1><p>Veli tarafından verilen kod ve şifre ile giriş yap.</p></div><label class="label">Öğrenci kodu</label><input id="code" class="field" value="R7K3L9"><label class="label">Şifre</label><input id="pin" class="field" type="password" value="1234"><button class="btn primary" data-go="home">Giriş Yap</button><div class="small" style="text-align:center;margin-top:14px">Demo: R7K3L9 / 1234</div></section>`,home:()=>`<section class="screen"><div class="headrow"><div class="miniBrand">Rec<b>AI</b></div><span class="pill">${grade}</span></div><h1 class="homeTitle">Merhaba ${student} 👋</h1><p class="small">Bugün ne öğrenmek istiyorsun?</p><div class="actions" style="margin-top:18px"><button class="action aPurple" data-go="question">📷<br><br>Soru Sor<div class="small" style="color:#fff;margin-top:5px">Fotoğraf çek veya yükle</div></button><button class="action aBlue">📘<br><br>Konu Tekrarı</button><button class="action aGreen">📝<br><br>Sınava Hazırlan</button><button class="action aPink" id="voice">🎙️<br><br>RecAI ile Konuş</button></div><div class="panel small">Bugünkü ücretsiz hakkın: <b>1 soru</b></div></section>`,question:()=>`<section class="screen form"><div class="headrow"><button class="back" data-go="home">‹</button><div class="miniBrand">Rec<b>AI</b></div><span></span></div><h1>Sorunu göster</h1><p>Kitaptan veya defterden fotoğraf çek.</p><label class="upload"><input id="file" type="file" accept="image/*" capture="environment" style="display:none"><div id="prev">📷<br><br><b>Fotoğraf çek / yükle</b></div></label><button class="btn primary" data-go="solution">RecAI’ye Sor</button></section>`,solution:()=>`<section class="screen form"><div class="headrow"><button class="back" data-go="question">‹</button><div class="miniBrand">Rec<b>AI</b></div><span></span></div><div class="tabs"><div class="on">Çözüm</div><div>Anlatım</div><div>Benzer Soru</div></div><div class="bubble">Bu soruda önce verilen bilgileri bulalım. Sonra birlikte adım adım ilerleyelim.</div><div class="panel"><h3>Çözüm adımları</h3><ol><li>Verilenleri belirle.</li><li>Bizden isteneni yaz.</li><li>Uygun işlemi seç.</li><li>Sonucu kontrol et.</li></ol></div><button class="btn google" id="speak">▶ RecAI sesli anlatsın</button></section>`};function bind(){document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>page(e.dataset.go));const s=document.getElementById('save');if(s)s.onclick=()=>{student=document.getElementById('name').value.trim()||'Öğrenci';grade=document.getElementById('grade').value;page('plan')};const f=document.getElementById('file');if(f)f.onchange=e=>{const x=e.target.files[0];if(x)document.getElementById('prev').innerHTML=`<img src="${URL.createObjectURL(x)}" style="max-width:100%;border-radius:16px">`};const v=document.getElementById('voice');if(v)v.onclick=()=>say(`Merhaba ${student}. Bugün hangi dersi çalışmak istiyorsun?`);const sp=document.getElementById('speak');if(sp)sp.onclick=()=>say('Bu soruda önce verilen bilgileri belirleyelim. Sonra bizden isteneni yazıp uygun işlemi birlikte seçelim.')}function say(t){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';speechSynthesis.speak(u)}else alert(t)}page('parent');</script></body></html>
