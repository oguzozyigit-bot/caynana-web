<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RecAI — Cebindeki Öğretmen</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7ff;color:#16213e}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}.top{padding:20px 22px;border-bottom:1px solid #e8edf7;font-weight:800;font-size:26px}.top b{color:#246bfd}.screen{padding:28px 22px}.center{text-align:center}.hero{padding-top:60px}.hero h1{font-size:34px;margin:10px 0}.hero p,p{color:#71809b;line-height:1.5}.card,.btn,.field{width:100%;border-radius:18px}.card{border:1px solid #e2e8f3;background:#fff;padding:18px;margin:12px 0;text-align:left;box-shadow:0 12px 30px rgba(36,107,253,.08)}.btn{border:0;padding:16px;margin-top:12px;font-weight:700}.blue{background:#246bfd;color:#fff}.purple{background:#7c5cff;color:#fff}.ghost{background:#fff;border:1px solid #dfe6f2}.field{padding:14px;border:1px solid #dbe3ef;margin:8px 0 14px}.avatar{font-size:52px;margin:18px}.pill{display:inline-block;background:#edf3ff;color:#246bfd;padding:7px 10px;border-radius:99px;font-size:12px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.stat{background:#f8faff;padding:14px;border-radius:16px;text-align:center}.action{padding:18px;border-radius:18px;color:#fff;margin:12px 0;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.small{font-size:12px;color:#71809b}.back{border:0;background:#eef3fb;border-radius:50%;width:38px;height:38px}.code{background:#eef4ff;padding:15px;border-radius:16px;margin-top:16px;font-weight:800;letter-spacing:2px}.panel{background:#fff;border:1px solid #e6ebf4;border-radius:18px;padding:16px;margin-top:14px}.bar{height:8px;background:#e8eef6;border-radius:99px;overflow:hidden;margin-top:7px}.bar span{display:block;height:100%;background:#22c55e}.warn span{background:#ff6b78}.upload{border:2px dashed #cfd8ea;border-radius:22px;padding:60px 20px;text-align:center;background:#fafcff}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#f1f3f9;padding:5px;border-radius:14px}.tabs div{padding:10px;text-align:center}.tabs .on{background:#fff;border-radius:10px;color:#7c5cff;font-weight:700}.bubble{background:#f2edff;padding:14px;border-radius:4px 16px 16px 16px;margin:14px 0;line-height:1.5}</style></head><body><div class="app"><div class="top">🎓 Rec<b>AI</b></div><div id="app"></div></div><script>const A=document.getElementById('app');let student='Ozan',grade='6. Sınıf';function page(x){A.innerHTML=views[x]();bind()}const views={role:()=>`<section class="screen hero center"><span class="pill">Cebindeki Öğretmen</span><h1>RecAI'ye Hoş Geldin</h1><p>Veli veya öğrenci olarak devam et.</p><button class="card" data-go="parent"><b>👩‍👦 Veli Girişi</b><br><span class="small">Google ile devam et</span></button><button class="card" data-go="student"><b>🧑‍🎓 Öğrenci Girişi</b><br><span class="small">Kod + şifre ile giriş</span></button><div class="panel small">Her öğrenciye günde <b>1 soru ücretsiz</b>. Sınırsız için abonelik.</div></section>`,parent:()=>`<section class="screen center"><button class="back" data-go="role">←</button><div class="avatar">👩🏻</div><h1>Veli Girişi</h1><p>Google ile hızlıca devam et.</p><button class="btn blue" data-go="add">G Google ile giriş yap</button></section>`,add:()=>`<section class="screen"><button class="back" data-go="parent">←</button><span class="pill">1 / 2</span><h1>Öğrencini Tanı</h1><label>Adı<input id="name" class="field" value="Ozan"></label><label>Sınıf<select id="grade" class="field"><option>4. Sınıf</option><option>5. Sınıf</option><option selected>6. Sınıf</option><option>7. Sınıf</option><option>8. Sınıf</option></select></label><button class="btn blue" id="save">Öğrenciyi Kaydet</button></section>`,plan:()=>`<section class="screen center"><button class="back" data-go="add">←</button><span class="pill">2 / 2</span><h1>RecAI Sınırsız</h1><div class="panel">✓ Sınırsız soru<br>✓ Fotoğrafla soru<br>✓ Sesli öğretmen<br>✓ Veli gelişim paneli</div><div class="card"><b>Aylık</b><span style="float:right"><b>₺399</b> / ay</span></div><button class="btn blue" data-go="dash">Demoda Ödemeyi Geç</button></section>`,dash:()=>`<section class="screen"><h1>Çocuğunun gelişimi</h1><div class="panel"><b>🧑🏻 ${student}</b><br><span class="small">${grade}</span><div class="stats"><div class="stat"><b>14</b><div class="small">Bugün</div></div><div class="stat"><b>56</b><div class="small">Bu hafta</div></div><div class="stat"><b>%78</b><div class="small">Doğruluk</div></div></div></div><div class="panel"><b>Güçlü konular</b><div>Kesirler<div class="bar"><span style="width:86%"></span></div></div><div>Denklemler<div class="bar"><span style="width:72%"></span></div></div></div><div class="panel"><b>Zorlandığı konular</b><div>Ondalık Gösterim<div class="bar warn"><span style="width:44%"></span></div></div><div>Problemler<div class="bar warn"><span style="width:36%"></span></div></div></div><div class="panel">💡 <b>RecAI Önerisi:</b><br><span class="small">Yarın 10 dakikalık kesir tekrarı yapması faydalı olur.</span></div><div class="code">Öğrenci kodu: R7K3L9</div></section>`,student:()=>`<section class="screen center"><button class="back" data-go="role">←</button><div class="avatar">🧑🏻</div><h1>Öğrenci Girişi</h1><input id="code" class="field" value="R7K3L9" placeholder="Öğrenci kodu"><input id="pin" class="field" value="1234" type="password" placeholder="Şifre"><button class="btn purple" data-go="home">Giriş Yap</button><div class="small">Demo: R7K3L9 / 1234</div></section>`,home:()=>`<section class="screen"><h1>Merhaba ${student} 👋</h1><p>Bugün ne çalışıyoruz?</p><div class="action purple" data-go="question">📷 Soru Sor<br><span class="small" style="color:#fff">Fotoğraf çek veya yükle</span></div><div class="grid"><div class="action" style="background:#3f8df7">📘 Konu Tekrarı</div><div class="action" style="background:#29bd73">📝 Sınava Hazırlan</div></div><div class="action" id="voice" style="background:#ff6d9a">🎙️ RecAI ile Konuş</div><div class="panel">Bugünkü ücretsiz hakkın: <b>1 soru</b></div></section>`,question:()=>`<section class="screen"><button class="back" data-go="home">←</button><h1>Sorunu Göster</h1><p>Kitaptan veya defterden fotoğraf yükle.</p><label class="upload"><input id="file" type="file" accept="image/*" capture="environment" style="display:none"><div id="prev">📷<br><b>Fotoğraf çek / yükle</b></div></label><button class="btn purple" data-go="solution">RecAI'ye Sor</button></section>`,solution:()=>`<section class="screen"><button class="back" data-go="question">←</button><div class="tabs"><div class="on">Çözüm</div><div>Anlatım</div><div>Benzer Soru</div></div><div class="bubble">Bu soruda önce verilen bilgileri bulalım. Sonra birlikte adım adım ilerleyelim.</div><div class="panel"><h3>Çözüm Adımları</h3><ol><li>Verilenleri belirle.</li><li>İstenen sonucu yaz.</li><li>Uygun işlemi seç.</li><li>Sonucu kontrol et.</li></ol></div><button class="btn ghost" id="speak">▶ RecAI sesli anlatsın</button></section>`};function bind(){document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>page(e.dataset.go));let s=document.getElementById('save');if(s)s.onclick=()=>{student=document.getElementById('name').value||'Öğrenci';grade=document.getElementById('grade').value;page('plan')};let f=document.getElementById('file');if(f)f.onchange=e=>{let x=e.target.files[0];if(x)document.getElementById('prev').innerHTML=`<img src="${URL.createObjectURL(x)}" style="max-width:100%;border-radius:16px">`};let v=document.getElementById('voice');if(v)v.onclick=()=>say(`Merhaba ${student}. Bugün hangi dersi çalışmak istiyorsun?`);let sp=document.getElementById('speak');if(sp)sp.onclick=()=>say('Bu soruda önce verilen bilgileri belirleyelim. Sonra bizden isteneni yazıp uygun işlemi birlikte seçelim.')}function say(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';speechSynthesis.speak(u)}else alert(t)}page('role');</script></body></html>
