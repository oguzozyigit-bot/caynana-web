<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RecAI — Cebindeki Öğretmen</title><style>
:root{--ink:#0b1020;--muted:#7b8497;--line:#e8ecf2;--blue:#1769ff;--purple:#7357ff;--soft:#f6f8fc}*{box-sizing:border-box}html,body{margin:0;background:#eef2f7;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,select{font:inherit}.phone{max-width:470px;min-height:100svh;margin:auto;background:#fff;position:relative;overflow:hidden}.page{min-height:100svh;padding:18px 18px 96px;background:linear-gradient(180deg,#fff,#fbfcff)}.topbar{height:56px;display:flex;align-items:center;justify-content:space-between}.logo{display:flex;align-items:center;gap:9px;font-size:24px;font-weight:900;letter-spacing:-1px}.mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--purple));display:grid;place-items:center;color:white;font-size:18px;box-shadow:0 8px 20px rgba(60,85,220,.25)}.ai{color:var(--blue)}.iconBtn{width:40px;height:40px;border:1px solid var(--line);border-radius:14px;background:#fff}.hero{margin-top:18px;background:linear-gradient(135deg,#111a34,#1c2d59 60%,#26417f);color:#fff;border-radius:28px;padding:26px 22px;box-shadow:0 24px 50px rgba(27,46,88,.20)}.hero small{font-weight:800;opacity:.68;letter-spacing:.5px}.hero h1{font-size:31px;line-height:1.06;letter-spacing:-1.3px;margin:10px 0 12px}.hero p{font-size:14px;line-height:1.55;opacity:.8;margin:0}.section{display:flex;align-items:end;justify-content:space-between;margin:24px 2px 12px}.section h2{font-size:19px;margin:0}.section span{font-size:12px;color:var(--muted)}.roles,.features{display:grid;grid-template-columns:1fr 1fr;gap:12px}.role,.card{border:1px solid var(--line);background:#fff;border-radius:22px;padding:18px;text-align:left;box-shadow:0 10px 28px rgba(24,39,75,.06)}.role{min-height:140px}.roleIcon{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:#edf3ff;color:var(--blue);font-weight:900;margin-bottom:18px}.role:nth-child(2) .roleIcon{background:#f1edff;color:var(--purple)}.role b{display:block;font-size:16px}.role small{display:block;color:var(--muted);line-height:1.4;margin-top:6px}.loginTitle{text-align:center;margin:46px 0 28px}.bigMark{width:74px;height:74px;border-radius:24px;margin:0 auto 18px;background:linear-gradient(135deg,var(--blue),var(--purple));display:grid;place-items:center;color:#fff;font-size:30px;font-weight:900;box-shadow:0 18px 36px rgba(60,85,220,.24)}.loginTitle h1{font-size:29px;margin:0 0 8px}.loginTitle p,.sub{color:var(--muted);font-size:14px;line-height:1.5}.btn{width:100%;height:56px;border:0;border-radius:17px;font-weight:800}.google{background:#fff;border:1px solid #dde3ec;color:#202b42;box-shadow:0 10px 28px rgba(24,39,75,.06)}.primary{background:linear-gradient(135deg,var(--blue),#3f75ff);color:#fff;box-shadow:0 14px 28px rgba(23,105,255,.22)}.back{width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:#fff}.formTitle{font-size:28px;margin:22px 0 6px}.fieldLabel{font-size:12px;color:#6d778d;font-weight:800;margin:16px 0 7px}.field{width:100%;height:54px;border:1px solid #dfe5ee;border-radius:15px;padding:0 15px;background:#fff;outline:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.stat{border:1px solid var(--line);border-radius:17px;padding:14px 8px;text-align:center;background:#fbfcff}.stat strong{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}.studentHead{display:flex;align-items:center;gap:12px}.avatar{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;display:grid;place-items:center;font-weight:900}.card{margin-bottom:12px}.recommend{background:linear-gradient(135deg,#f3f6ff,#f7f2ff)}.feature{border:0;border-radius:24px;padding:18px;min-height:138px;text-align:left;color:#fff;box-shadow:0 15px 28px rgba(36,60,120,.13)}.feature strong{display:block;font-size:17px;margin-top:30px}.feature small{display:block;opacity:.8;margin-top:5px}.f1{background:linear-gradient(135deg,#7357ff,#9d78ff)}.f2{background:linear-gradient(135deg,#1769ff,#4e9cff)}.f3{background:linear-gradient(135deg,#19a86b,#4bcf94)}.f4{background:linear-gradient(135deg,#ff6f97,#ff9bb7)}.wide{grid-column:1/-1;min-height:100px}.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(470px,100%);height:76px;background:rgba(255,255,255,.97);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:20}.nav{border:0;background:none;color:#8a93a5;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}.nav i{font-style:normal;font-size:20px}.nav.active{color:var(--blue)}.navCenter i{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--blue),var(--purple));color:white;display:grid;place-items:center;margin-top:-18px;box-shadow:0 10px 22px rgba(45,80,220,.25)}.upload{border:1.5px dashed #cfd6e2;border-radius:24px;background:#f9fbff;padding:54px 20px;text-align:center}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:5px;border-radius:16px;background:#f1f3f7}.tabs div{text-align:center;padding:11px 6px;font-size:12px;color:#7b8497}.tabs .active{background:#fff;border-radius:12px;color:var(--blue);font-weight:800}.bubble{background:#f3f0ff;border:1px solid #e6defe;border-radius:8px 20px 20px 20px;padding:16px;line-height:1.55;color:#463d68;font-size:14px;margin-top:16px}@media(min-width:700px){body{padding:24px}.phone{border-radius:32px;box-shadow:0 30px 80px rgba(20,35,70,.16)}}
</style></head><body><div class="phone"><main id="app"></main><div id="bottom"></div></div><script>
const A=document.getElementById('app'),B=document.getElementById('bottom');let student='Öğrenci',grade='6. Sınıf';
function logo(){return '<div class="logo"><span class="mark">R</span>Rec<span class="ai">AI</span></div>'}
function top(){return '<div class="topbar">'+logo()+'<div><button class="iconBtn">?</button></div></div>'}
function nav(active){B.innerHTML='<nav class="bottom"><button class="nav '+(active==='dash'?'active':'')+'" data-go="dash"><i>⌂</i><span>Ana Sayfa</span></button><button class="nav '+(active==='progress'?'active':'')+'" data-go="progress"><i>▥</i><span>Gelişim</span></button><button class="nav navCenter" data-go="question"><i>＋</i><span>Soru Sor</span></button><button class="nav '+(active==='profile'?'active':'')+'" data-go="profile"><i>◯</i><span>Profil</span></button></nav>';bind()}
function noNav(){B.innerHTML=''}
function go(name){A.innerHTML=views[name]();if(['dash','progress','profile','home','question','solution'].includes(name))nav(name);else noNav();bind();window.scrollTo(0,0)}
const views={
landing:()=>'<section class="page">'+top()+'<div class="hero"><small>CEBİNDEKİ ÖĞRETMEN</small><h1>Öğrenmeyi kişiselleştiren yapay zekâ.</h1><p>RecAI soruyu sadece çözmez; öğrencinin nerede zorlandığını anlar, anlatır ve gelişimi veliye gösterir.</p></div><div class="section"><h2>Nasıl devam edeceksin?</h2><span>Bir rol seç</span></div><div class="roles"><button class="role" data-go="parent"><span class="roleIcon">V</span><b>Veli Girişi</b><small>Google ile giriş yap, öğrencini yönet.</small></button><button class="role" data-go="student"><span class="roleIcon">Ö</span><b>Öğrenci Girişi</b><small>Kod ve şifreyle kendi alanına gir.</small></button></div><div class="section"><h2>RecAI ne yapar?</h2></div><div class="card"><b>Soruyu görür, nasıl düşündüğünü anlar.</b><p class="sub">Fotoğraf, ses ve konuşma üzerinden adım adım öğretir.</p></div></section>',
parent:()=>'<section class="page">'+top()+'<div class="loginTitle"><div class="bigMark">R</div><h1>Veli Girişi</h1><p>Çocuğunun öğrenme yolculuğunu takip etmek için Google hesabınla devam et.</p></div><button class="btn google" data-go="add">G&nbsp;&nbsp; Google ile devam et</button><button class="btn" style="margin-top:12px;background:#f5f7fb;color:#33405c" data-go="landing">Geri dön</button></section>',
add:()=>'<section class="page"><div class="topbar"><button class="back" data-go="parent">‹</button>'+logo()+'<span></span></div><h1 class="formTitle">Öğrencini ekle</h1><p class="sub">Seviyesine göre çalışma planını ve anlatım biçimini hazırlayalım.</p><div class="fieldLabel">Öğrencinin adı</div><input id="name" class="field" placeholder="Adı"><div class="fieldLabel">Sınıfı</div><select id="grade" class="field"><option>4. Sınıf</option><option>5. Sınıf</option><option selected>6. Sınıf</option><option>7. Sınıf</option><option>8. Sınıf</option></select><button class="btn primary" style="margin-top:20px" id="saveStudent">Devam et</button></section>',
plan:()=>'<section class="page"><div class="topbar"><button class="back" data-go="add">‹</button>'+logo()+'<span></span></div><h1 class="formTitle">RecAI Sınırsız</h1><p class="sub">Sor, konuş, tekrar et. RecAI öğrencinin ihtiyacına göre anlatmaya devam eder.</p><div class="card"><b>Sınırsız kullanım</b><p class="sub">Fotoğrafla soru • Sesli öğretmen • Konu tekrarı • Veli gelişim paneli</p></div><div class="card"><b>Aylık</b><strong style="float:right;font-size:24px">₺399</strong><p class="sub">İstediğin zaman iptal</p></div><button class="btn primary" data-go="dash">Demoda devam et</button></section>',
dash:()=>'<section class="page">'+top()+'<div class="section"><h2>Bugünkü durum</h2><span>Veli Paneli</span></div><div class="card"><div class="studentHead"><div class="avatar">'+student.charAt(0)+'</div><div><b>'+student+'</b><div class="sub">'+grade+'</div></div></div><div class="stats"><div class="stat"><strong>18</strong><span>Soru</span></div><div class="stat"><strong>37 dk</strong><span>Çalışma</span></div><div class="stat"><strong>%78</strong><span>Doğruluk</span></div></div></div><div class="card recommend"><b>RecAI önerisi</b><p class="sub">Ondalık gösterimde zorlandı. Yarın 12 dakikalık kısa tekrar öneriyorum.</p></div><div class="section"><h2>Hızlı işlemler</h2></div><div class="features"><button class="feature f1" data-go="progress"><strong>Gelişimi gör</strong><small>Zayıf ve güçlü konular</small></button><button class="feature f2" data-go="question"><strong>Soru gönder</strong><small>Fotoğrafla hemen sor</small></button></div></section>',
progress:()=>'<section class="page">'+top()+'<div class="section"><h2>Gelişim</h2><span>Son 7 gün</span></div><div class="card"><b>Matematik</b><p class="sub">Kesirler güçlü • Ondalık gösterim gelişmeli</p></div><div class="card"><b>Fen Bilimleri</b><p class="sub">Madde ve ısı konularında istikrarlı.</p></div><div class="card recommend"><b>Bu haftanın özeti</b><p class="sub">56 soru çözüldü. Çalışma süresi geçen haftaya göre %18 arttı.</p></div></section>',
profile:()=>'<section class="page">'+top()+'<div class="section"><h2>Profil</h2><span>Veli hesabı</span></div><div class="card"><b>'+student+'</b><p class="sub">'+grade+' • Öğrenci kodu: R7K3L9</p></div><div class="card"><b>RecAI Sınırsız</b><p class="sub">Demo abonelik ekranı</p></div></section>',
student:()=>'<section class="page">'+top()+'<div class="loginTitle"><div class="bigMark">Ö</div><h1>Öğrenci Girişi</h1><p>Velinin oluşturduğu kod ve şifre ile giriş yap.</p></div><input class="field" value="R7K3L9" placeholder="Öğrenci kodu"><input class="field" style="margin-top:10px" value="1234" type="password" placeholder="Şifre"><button class="btn primary" style="margin-top:16px" data-go="home">Giriş yap</button><button class="btn" style="margin-top:12px;background:#f5f7fb;color:#33405c" data-go="landing">Geri dön</button></section>',
home:()=>'<section class="page">'+top()+'<div class="section"><h2>Merhaba '+student+'</h2><span>'+grade+'</span></div><div class="hero"><small>BUGÜN NE ÇALIŞIYORUZ?</small><h1>Sorunu göster, RecAI anlatsın.</h1><p>Fotoğraf çekebilir, sesli konuşabilir veya konu tekrarı yapabilirsin.</p></div><div class="section"><h2>Başla</h2></div><div class="features"><button class="feature f1" data-go="question"><strong>Soru Sor</strong><small>Fotoğraf çek veya yükle</small></button><button class="feature f2"><strong>Konu Tekrarı</strong><small>Bugünkü konuları pekiştir</small></button><button class="feature f3"><strong>Sınava Hazırlan</strong><small>Eksik konularına odaklan</small></button><button class="feature f4"><strong>RecAI ile Konuş</strong><small>Sesli öğretmeninle konuş</small></button><button class="feature wide f2"><strong>Bugünkü ücretsiz hakkın: 1 soru</strong></button></div></section>',
question:()=>'<section class="page">'+top()+'<div class="section"><h2>Sorunu göster</h2><span>Fotoğraf</span></div><label class="upload"><input id="fileInput" type="file" accept="image/*" capture="environment" style="display:none"><div id="preview"><div style="font-size:30px">📷</div><b>Fotoğraf çek veya yükle</b><p class="sub">Sorunun tamamı net görünsün.</p></div></label><button class="btn primary" style="margin-top:16px" data-go="solution">RecAI’ye Sor</button></section>',
solution:()=>'<section class="page">'+top()+'<div class="tabs"><div class="active">Çözüm</div><div>Anlatım</div><div>Benzer Soru</div></div><div class="bubble">Önce verilenleri birlikte bulalım. Sonra hangi işlemi neden yapacağımızı adım adım açıklayacağım.</div><div class="card"><b>1. Adım</b><p class="sub">Soruda verilen bilgileri ayır.</p></div><div class="card"><b>2. Adım</b><p class="sub">Bizden isteneni belirle ve uygun işlemi seç.</p></div><button class="btn google" id="speakBtn">▶ RecAI sesli anlatsın</button></section>'
};
function bind(){document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go(el.dataset.go));const save=document.getElementById('saveStudent');if(save)save.onclick=()=>{student=(document.getElementById('name').value||'Öğrenci').trim();grade=document.getElementById('grade').value;go('plan')};const f=document.getElementById('fileInput');if(f)f.onchange=e=>{const file=e.target.files&&e.target.files[0];if(file)document.getElementById('preview').innerHTML='<img src="'+URL.createObjectURL(file)+'" style="max-width:100%;border-radius:18px">'};const s=document.getElementById('speakBtn');if(s)s.onclick=()=>{if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Önce verilenleri bulalım. Sonra bizden isteneni belirleyip uygun işlemi birlikte seçelim.');u.lang='tr-TR';speechSynthesis.speak(u)}}}
go('landing');
</script></body></html>
