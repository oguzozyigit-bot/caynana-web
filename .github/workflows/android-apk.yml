name: Build Telefon Call APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TelefonCall-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK into website
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk payphone/TelefonCall.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payphone/TelefonCall.apk
          if git diff --cached --quiet; then
            echo "APK already current"
            exit 0
          fi
          git commit -m "Publish latest Telefon Call APK"
          git push
